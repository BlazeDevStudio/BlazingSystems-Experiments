<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlazePwifi Portal Editor</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:#080d16;color:#e9f0fb}.page{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top a{color:#8ab7ff;text-decoration:none}.layout{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px}.card{background:#111927;border:1px solid #26364d;border-radius:18px;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:.78rem;color:#9fb0c6}input,select,button{font:inherit;border-radius:10px;border:1px solid #31425b;min-height:42px;padding:8px 10px}input,select{background:#0a111d;color:#fff}input[type=color]{padding:4px}.check{display:flex;align-items:center;gap:8px;color:#cbd8e8}.check input{min-height:auto;width:auto}.actions{display:flex;gap:8px;margin-top:14px}button{background:#2477ff;color:white;font-weight:750;cursor:pointer;flex:1}.ghost{background:#172235}.msg{min-height:1.2em;color:#91a6bf;margin-top:9px}.preview{min-height:760px;overflow:hidden}.preview iframe{width:100%;height:760px;border:0;border-radius:14px;background:#07111f}@media(max-width:850px){.layout{grid-template-columns:1fr}.preview{min-height:680px}.preview iframe{height:680px}}</style></head><body><div class="page"><div class="top"><div><h1 style="margin:0">Portal Builder</h1><div style="color:#8397ae">Lite-safe structured editor</div></div><a href="/admin.html">← Admin</a></div><div class="layout"><div class="card"><div class="fields"><div class="field full"><label>Hotspot name</label><input id="brand" maxlength="48"></div><div class="field full"><label>Short message</label><input id="tagline" maxlength="120"></div><div class="field"><label>Accent</label><input id="accent" type="color"></div><div class="field"><label>Second accent</label><input id="accent2" type="color"></div><div class="field"><label>Background</label><input id="background" type="color"></div><div class="field"><label>Text</label><input id="text" type="color"></div><div class="field"><label>Corner radius</label><input id="radius" type="number" min="8" max="40"></div><div class="field"><label>Template</label><select id="template"><option value="neon-simple">Neon Simple</option></select></div><div class="field full"><label>Coin button label</label><input id="coin_label" maxlength="32"></div><div class="field full"><label>Buy button label</label><input id="buy_label" maxlength="32"></div><div class="field full"><label>Voucher label</label><input id="voucher_label" maxlength="32"></div><div class="field full"><label>Details heading</label><input id="details_title" maxlength="64"></div><div class="field full"><label>Footer</label><input id="footer" maxlength="100"></div><div class="field full"><label class="check"><input id="show_voucher" type="checkbox"> Show voucher section</label></div><div class="field full"><label class="check"><input id="show_pause" type="checkbox"> Show pause/resume controls</label></div><div class="field full"><label class="check"><input id="show_details" type="checkbox"> Show safe connection details</label></div></div><div class="actions"><button onclick="saveAll()">Save & publish</button><button class="ghost" onclick="loadConfig()">Reload</button></div><div id="msg" class="msg"></div></div><div class="card preview"><iframe id="preview" src="/index.html?preview=1" title="Portal preview"></iframe></div></div></div>
<script>
const ids=['template','brand','tagline','accent','accent2','background','text','radius','show_voucher','show_details','show_pause','coin_label','buy_label','voucher_label','details_title','footer'];let csrf='';const q=id=>document.getElementById(id);async function j(url,opt){try{let r=await fetch(url,Object.assign({credentials:'same-origin'},opt||{}));return await r.json()}catch(e){return {ok:false,error:'Connection failed'}}}function collect(){let o={};ids.forEach(id=>{let e=q(id);o[id]=e.type==='checkbox'?(e.checked?'1':'0'):e.value});return o}function pushPreview(){let f=q('preview');if(f.contentWindow)f.contentWindow.postMessage({type:'blazePreview',config:collect()},location.origin)}async function session(){let x=await j('/cgi-bin/admin-session');if(!x.ok){location.href='/admin.html';return false}csrf=x.csrf||'';if(x.role!=='admin')q('msg').textContent='Admin role is required to publish portal changes.';return true}async function loadConfig(){let x=await j('/cgi-bin/api',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=portal_config'});if(!x.ok||!x.portal){q('msg').textContent=x.error||'Could not load portal.';return}ids.forEach(id=>{let e=q(id),v=x.portal[id];if(v==null)return;if(e.type==='checkbox')e.checked=v==='1';else e.value=v});q('msg').textContent='Loaded current portal.';pushPreview()}function rawBody(o){return Object.keys(o).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(String(o[k]))).join('&')}async function saveAll(){if(!csrf&&!await session())return;let c=collect();q('msg').textContent='Saving…';for(let id of ids){let x=await j('/cgi-bin/admin',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Blaze-CSRF':csrf},body:rawBody({action:'portal_set',key:id,value:c[id]})});if(!x.ok){q('msg').textContent='Could not save '+id+': '+(x.error||'failed');return}}q('msg').textContent='Portal published.';pushPreview()}ids.forEach(id=>q(id).addEventListener('input',pushPreview));q('preview').addEventListener('load',pushPreview);session().then(ok=>{if(ok)loadConfig()});
</script></body></html>
