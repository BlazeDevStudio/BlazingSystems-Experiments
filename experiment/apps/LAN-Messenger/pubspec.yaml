name: lan_messenger
description: Zero-configuration peer-to-peer LAN chat, files, and intercom.
publish_to: none
version: 0.3.4+17

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  crypto: ^3.0.6
  file_picker: ^13.1.0
  flutter_webrtc: ^1.6.2+hotfix.4
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  audioplayers: ^6.5.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  flutter_background: ^1.3.1
  video_player: ^2.10.0
  video_player_win: ^3.3.1
  pdfrx: ^2.4.8
  archive: ^4.5.2
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/