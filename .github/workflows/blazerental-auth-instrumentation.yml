name: PHX BlazeRental isolated native status-auth instrumentation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/blazerental-auth-instrumentation.yml'
      - 'experiment/openwrt/BlazePwifi/android/BlazeRentalLauncher/src/com/blazesystems/blazerental/LeaseClient.java'
      - 'experiment/openwrt/BlazePwifi/android/BlazeRentalLauncher/tests/src/com/blazesystems/blazerental/LeaseSyncAuthBeforeCommitTest.java'
      - 'experiment/openwrt/BlazePwifi/android/BlazeRentalLauncher/build.gradle'

permissions:
  contents: read

concurrency:
  group: phx-rental-auth-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-lease-auth:
    name: Native Android 27 lease/HMAC regression (isolated emulator)
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      TARGET: experiment/openwrt/BlazePwifi/android/BlazeRentalLauncher
      GRADLE_VERSION: 4.4.1
      TEST_CLASS: com.blazesystems.blazerental.LeaseSyncAuthBeforeCommitTest
    steps:
      - uses: actions/checkout@v4
        with:
          # This is the actual PR source, not an old default branch or a stale merge artifact.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Pin Android 27 SDK and build-tools 27.0.3 (Launcher3 AGP 3.1.3)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-27" "build-tools;27.0.3"
          mkdir -p /tmp/blazerental-sdk27/platforms /tmp/blazerental-sdk27/build-tools
          cp -a "${ANDROID_SDK_ROOT}/platforms/android-27" /tmp/blazerental-sdk27/platforms/
          cp -a "${ANDROID_SDK_ROOT}/build-tools/27.0.3" /tmp/blazerental-sdk27/build-tools/
          # connectedAospDebugAndroidTest needs ADB inside the isolated legacy SDK.
          test -x "${ANDROID_SDK_ROOT}/platform-tools/adb"
          ln -s "${ANDROID_SDK_ROOT}/platform-tools" /tmp/blazerental-sdk27/platform-tools
          printf 'sdk.dir=/tmp/blazerental-sdk27\n' > "$TARGET/local.properties"

      - name: Pin JDK 8 for historical Launcher3
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Pin Gradle 4.4.1 and verify exact connected test task
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/blazerental-gradle.zip
          unzip -q /tmp/blazerental-gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          mkdir -p rental-auth-results
          (
            cd "$TARGET"
            ANDROID_HOME=/tmp/blazerental-sdk27 ANDROID_SDK_ROOT=/tmp/blazerental-sdk27 \
              "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon tasks --all
          ) > rental-auth-results/tasks.txt
          grep -Eq '^[[:space:]]*connectedAospDebugAndroidTest[[:space:]]' rental-auth-results/tasks.txt
          grep -Eq '^[[:space:]]*assembleAospDebugAndroidTest([[:space:]]|$)' rental-auth-results/tasks.txt

      - name: Compile debug app and regression test APK (no production signer)
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$TARGET"
            ANDROID_HOME=/tmp/blazerental-sdk27 ANDROID_SDK_ROOT=/tmp/blazerental-sdk27 \
              "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon --stacktrace assembleAospDebug assembleAospDebugAndroidTest
          ) 2>&1 | tee rental-auth-results/compile.log

      - name: Enable KVM for disposable Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Switch to JDK 17 for modern Android SDK emulator startup
        # SDK command-line tools contain Java 11+ bytecode; Gradle 4.4.1 remains on JDK 8.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify emulator CLI has a Java 17 runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_8_X64:-}"
          java -version 2>&1 | tee rental-auth-results/emulator-java.txt
          java -version 2>&1 | grep -Eq 'version "17\.'

      - name: Execute three security tests on isolated Android API 27
        # v2.38.0 pinned to its immutable commit, avoiding a floating action tag.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 27
          arch: x86
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          emulator-boot-timeout: 300
          script: |
            set -euo pipefail
            mkdir -p rental-auth-results
            sdk="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            test "$sdk" = 27
            printf 'Emulator API level: %s\n' "$sdk" | tee rental-auth-results/emulator.txt
            # The emulator action was launched using Java 17; legacy AGP 3.1.3
            # must use the original JDK 8 for connected instrumentation.
            export JAVA_HOME="$JAVA_HOME_8_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            java -version 2>&1 | tee rental-auth-results/instrumentation-java.txt
            java -version 2>&1 | grep -Eq 'version "1\.8\.'
            (
              cd "$TARGET"
              ANDROID_HOME=/tmp/blazerental-sdk27 ANDROID_SDK_ROOT=/tmp/blazerental-sdk27 \
                "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon --stacktrace \
                "-Pandroid.testInstrumentationRunnerArguments.class=${TEST_CLASS}" \
                connectedAospDebugAndroidTest
            ) 2>&1 | tee rental-auth-results/connected.log
            python3 - <<'PY'
            import glob, os, sys, xml.etree.ElementTree as ET
            root = os.environ["TARGET"]
            reports = sorted(set(
                glob.glob(os.path.join(root, "build", "outputs", "androidTest-results", "connected", "**", "*.xml"), recursive=True)
                + glob.glob(os.path.join(root, "build", "outputs", "androidTest-results", "connected", "*.xml"))
            ))
            expected = {
                "invalidCoinSignatureCannotAlterPaidLease",
                "responseSuppliedSigningKeyCannotAuthorizeStatus",
                "legitimateSignedStatusStillExtendsLease",
            }
            tests = {}
            for path in reports:
                xml = ET.parse(path).getroot()
                for case in xml.iter("testcase"):
                    if case.get("classname", "").endswith("LeaseSyncAuthBeforeCommitTest"):
                        tests[case.get("name")] = case
            print("JUnit XML reports:", reports)
            print("Observed native rental security tests:", sorted(tests))
            if set(tests) != expected:
                sys.exit("FAIL: exact three native security cases not executed")
            for name, case in tests.items():
                if list(case.findall("failure")) or list(case.findall("error")) or list(case.findall("skipped")):
                    sys.exit("FAIL: native security test failed/skipped: " + name)
            with open("rental-auth-results/results.txt", "w") as out:
                out.write("EMULATOR API 27 / ALL THREE SECURITY TESTS PASSED\n")
                for name in sorted(expected):
                    out.write("PASS " + name + "\n")
            print("EMULATOR API 27 / 3/3 native tests PASS")
            PY

      - name: Save exact emulator logs and JUnit reports, including failures
        if: always()
        shell: bash
        run: |
          mkdir -p rental-auth-results
          timeout 8s adb devices -l > rental-auth-results/adb-devices.txt 2>&1 || true
          # Never hang evidence collection if emulator boot or test execution failed.
          timeout 8s adb logcat -d -t 1000 > rental-auth-results/logcat-tail.txt 2>&1 || true
          cp -a "$TARGET/build/outputs/androidTest-results" rental-auth-results/androidTest-results 2>/dev/null || true
          cp -a "$TARGET/build/reports/androidTests" rental-auth-results/androidTests 2>/dev/null || true

      - name: Upload source-linked native execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHX-Rental-auth-native-${{ github.event.pull_request.head.sha }}
          path: rental-auth-results/
          if-no-files-found: error
