  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify historical hardware ledger is preserved byte-for-byte
        env:
          LEDGER_BASE_REF: phoenix/hw-active-v06-poll-intake-deny-20261126-utc05
          LEDGER_EXPECTED_BASE_SHA: fc842342596786e072630179acfbbc4feeb2ba02
          LEDGER_PATH: experiment/openwrt/BlazePwifi/docs/handover/CHANGE_LEDGER.md
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$LEDGER_BASE_REF"
          actual_base="$(git rev-parse FETCH_HEAD)"
          test "$actual_base" = "$LEDGER_EXPECTED_BASE_SHA"
          base_file="$(mktemp)"
          trap 'rm -f "$base_file"' EXIT
          git show "$actual_base:$LEDGER_PATH" > "$base_file"
          python3 experiment/openwrt/BlazePwifi/tools/handover_ledger_append_only_guard.py --base "$base_file" --candidate "$LEDGER_PATH"
      - name: Test append-only ledger guard failure injection
        run: python3 experiment/openwrt/BlazePwifi/tests/handover_ledger_append_only_guard_test.py
      - name: Compile source-extracted poll, relay and pending-evidence regression
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab.py
      - name: Compile source-extracted deny-only remote-config regression
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/remote_config_deny_lab.py
      - name: Verify per-board request signing and action guards
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/controller_request_auth_guard_lab.py
      - name: Verify relay and LED OFF latch precedes output enable
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/output_enable_sequence_lab.py
      - name: Verify bounded EEPROM config validation and legacy migration
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/config_storage_integrity_lab.py
      - name: Verify EEPROM and Preferences write results before setup reboot
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/config_persistence_write_result_lab.py
      - name: Verify fail-closed pending journal recovery promotion
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/pending_recovery_promotion_lab.py
