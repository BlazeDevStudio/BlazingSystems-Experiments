name: PHX-HARDWARE Active v0.6 Poll Intake Deny
on:
  push:
    branches:
      - phoenix/hw-active-v06-poll-intake-deny-20261126-utc05
    paths:
      - 'experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/BlazePwifiVendo32.ino'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/BlazePwifiVendo.ino'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab_contract.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab_harness.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab_cases.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/remote_config_deny_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/controller_request_auth_guard_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/output_enable_sequence_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/config_storage_integrity_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/firmware_source_extract.py'
      - 'experiment/openwrt/BlazePwifi/docs/handover/2026-11-26-hw-active-v06-poll-intake-deny-utc05.md'
      - '.github/workflows/phx-hw-active-v06-poll-intake-deny.yml'
  pull_request:
    paths:
      - 'experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/BlazePwifiVendo32.ino'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/BlazePwifiVendo.ino'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab_contract.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab_harness.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab_cases.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/remote_config_deny_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/controller_request_auth_guard_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/output_enable_sequence_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/config_storage_integrity_lab.py'
      - 'experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/firmware_source_extract.py'
      - '.github/workflows/phx-hw-active-v06-poll-intake-deny.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Compile source-extracted poll, relay and pending-evidence regression
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_preflight_inhibit_lab.py
      - name: Compile source-extracted deny-only remote-config regression
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/remote_config_deny_lab.py
      - name: Verify per-board request signing and action guards
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/controller_request_auth_guard_lab.py
      - name: Verify relay and LED OFF latch precedes output enable
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/output_enable_sequence_lab.py
      - name: Verify bounded EEPROM config validation and legacy migration
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/config_storage_integrity_lab.py
