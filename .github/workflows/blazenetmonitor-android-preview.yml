name: BlazeNetMonitor Android Preview APK
on:
  push:
    branches:
      - feature/blazenetmonitor-android-v0.1.0
    paths:
      - .github/workflows/blazenetmonitor-android-preview.yml
      - expiremental/BlazeNetMonitorAndroid/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-preview:
    if: github.repository == 'BlazingSystems/BlazingSystems-Experiments'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: expiremental/BlazeNetMonitorAndroid
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: blazenetmonitor-android-v0.1.1-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ -e "$ANDROID_HOME/platforms/android-35/android.jar" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            echo "Required SDK already installed on GitHub runner"
          else
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Native unit tests and APK build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Validate Android package, SDK levels and service permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/blazenetmonitor-package.txt
          grep -q "package: name='com.blazesystems.blazenetmonitor'" /tmp/blazenetmonitor-package.txt
          grep -q "sdkVersion:'26'" /tmp/blazenetmonitor-package.txt
          grep -q "targetSdkVersion:'35'" /tmp/blazenetmonitor-package.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/blazenetmonitor-permissions.txt
          grep -q "versionName='0.1.1-preview.1'" /tmp/blazenetmonitor-package.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' /tmp/blazenetmonitor-permissions.txt
          if grep -q 'android.permission.SYSTEM_ALERT_WINDOW' /tmp/blazenetmonitor-permissions.txt; then
            echo 'Floating overlay permission must not be present'; exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'app/src/main/res/layout/notification_speed_strip.xml'
          root = ET.parse(p).getroot()
          aid = '{http://schemas.android.com/apk/res/android}id'
          ids = [v.attrib.get(aid,'').replace('@+id/','') for v in root]
          expected = ['strip_dot_left','strip_upload','strip_download','strip_dot_right']
          assert ids == expected, f'Incorrect notification strip order: {ids}'
          assert root.attrib.get('{http://schemas.android.com/apk/res/android}orientation') == 'horizontal'
          print('PASS compact shade layout: dot, upload, download, dot')
          PY
          if grep -R 'FloatingWidget\|ACTION_WIDGET\|Show floating speed' app/src/main/java/ app/src/main/AndroidManifest.xml; then
            echo 'Obsolete floating widget reference detected'; exit 1
          fi
          if grep -q 'android.permission.QUERY_ALL_PACKAGES' /tmp/blazenetmonitor-permissions.txt; then
            echo 'Unexpected broad installed-app inventory permission'; exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/BlazeNetMonitor-Android-v0.1.1-preview.1.apk
          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BlazeNetMonitor-Android-v0.1.1-preview.1-APK
          path: expiremental/BlazeNetMonitorAndroid/artifacts/
          retention-days: 60
      - name: Publish signed-debug APK preview release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Tag already published; refusing to overwrite'; exit 1
          fi
          notes='BlazeNetMonitor Android v0.1.1 preview: compact live notification strip ordered Target 1 health dot / upload speed / download speed / Target 2 health dot. Expanded notification is At a Glance with two connection targets, and session/day/month traffic totals; Stop action available. Removes floating widget and SYSTEM_ALERT_WINDOW permission. Android controls the TOP status bar so arbitrary numeric fields beside Wi-Fi/battery cannot be inserted by a regular app; there will be a small notification icon in the top bar and live text within the notification shade. Debug-signed APK for testing, not Play Store production. No per-app Top 5, Android emulator and physical OEM shade checks remain pending.'
          for attempt in 1 2 3 4; do
            if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title 'BlazeNetMonitor Android v0.1.1 Preview APK' \
              --prerelease --notes "$notes"; then break; fi
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              sleep $((attempt*5))
            else
              echo 'Release appears after retry; proceeding to upload'
              break
            fi
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          for attempt in 1 2 3 4; do
            if gh release upload "$RELEASE_TAG" artifacts/*.apk artifacts/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber; then break; fi
            sleep $((attempt*5))
          done
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
          echo "$assets" | jq -e '.assets | map(.name) |
            index("BlazeNetMonitor-Android-v0.1.1-preview.1.apk") != null' >/dev/null
          echo "$assets" | jq -e '.assets | map(.name) | index("SHA256SUMS.txt") != null' >/dev/null
          echo 'PASS GitHub release and downloadable APK/sha256 assets verified'
