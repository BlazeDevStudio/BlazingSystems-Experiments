name: BlazeNetMonitor Android Preview APK
on:
  push:
    branches:
      - feature/blazenetmonitor-android-v0.1.0
    paths:
      - .github/workflows/blazenetmonitor-android-preview.yml
      - expiremental/BlazeNetMonitorAndroid/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-preview:
    if: github.repository == 'BlazingSystems/BlazingSystems-Experiments'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: expiremental/BlazeNetMonitorAndroid
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: blazenetmonitor-android-v0.1.8-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ -e "$ANDROID_HOME/platforms/android-35/android.jar" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            echo "Required SDK already installed on GitHub runner"
          else
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Native unit tests and APK build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Validate Android package, SDK levels and service permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/blazenetmonitor-package.txt
          grep -q "package: name='com.blazesystems.blazenetmonitor'" /tmp/blazenetmonitor-package.txt
          grep -q "sdkVersion:'26'" /tmp/blazenetmonitor-package.txt
          grep -q "targetSdkVersion:'35'" /tmp/blazenetmonitor-package.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/blazenetmonitor-permissions.txt
          grep -q "versionName='0.1.8-preview.1'" /tmp/blazenetmonitor-package.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' /tmp/blazenetmonitor-permissions.txt
          if grep -q 'android.permission.SYSTEM_ALERT_WINDOW' /tmp/blazenetmonitor-permissions.txt; then
            echo 'Floating overlay permission must not be present'; exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/src/main/java/com/blazesystems/blazenetmonitor/MonitorService.java').read_text()
          for bad in ('import android.widget.RemoteViews','new RemoteViews(',
                      'setCustomContentView','setCustomBigContentView',
                      'DecoratedCustomViewStyle','setImageViewBitmap',
                      'R.layout.notification_glance','R.layout.notification_speed_strip'):
              assert bad not in src, f'Unsupported custom notification element: {bad}'
          assert 'new Notification.InboxStyle()' in src
          assert '.setStyle(style)' in src
          assert 'startForeground(NOTIFICATION_ID,initial' in src
          assert 'Notification initial=notification(false);' in src
          assert 'manager.notify(NOTIFICATION_ID,notification(true));' in src
          assert 'StatusLabel.strip(' in src
          assert 'StatusLabel.quality(' in src
          assert 'StatusSpeedIcon.icon(f.rx,bits)' in src
          assert src.count('manager.notify(')==1
          assert 'manager.notify(NOTIFICATION_ID,notification(true));' in src
          assert 'manager.cancel(LEGACY_DOWNLOAD_ID)' in src
          assert '.setLargeIcon(logo)' in src
          assert 'Notification.BigPictureStyle' in src
          assert 'NotificationCardRenderer.render(' in src
          assert 'targetFavicons.refresh(' in src
          assert 'targetFavicons.icon(0),targetFavicons.icon(1)' in src
          canvas=Path('app/src/main/java/com/blazesystems/blazenetmonitor/NotificationCardRenderer.java').read_text()
          assert 'c.drawCircle(42,top+45,12,p)' in canvas
          assert 'c.drawBitmap(icon' in canvas
          assert 'healthColor(health)' in canvas
          assert 'Bitmap.Config.RGB_565' in canvas
          assert 'WIDTH=720, HEIGHT=426' in canvas
          assert '"MONTH     ↓ "' in canvas
          fav=Path('app/src/main/java/com/blazesystems/blazenetmonitor/TargetFavicons.java').read_text()
          assert 'icoPngFrame(data)' in fav
          assert '"favicon.ico"' in fav
          print('PASS visible two-dot, two-logo notification picture wiring')
          assert 'downloadNotification(' not in src
          dynamic=Path('app/src/main/java/com/blazesystems/blazenetmonitor/StatusSpeedIcon.java').read_text()
          assert 'Icon.createWithBitmap(' in dynamic
          assert 'Bitmap.Config.ALPHA_8' in dynamic
          assert 'drawCircle(' not in dynamic
          print('PASS one download-only numeric small icon, logo and full notification shade')
          app=Path('app/src/main/java/com/blazesystems/blazenetmonitor/MainActivity.java').read_text()
          assert 'targetLogos[i]' in app and 'refreshLogos()' in app
          assert 'Crash diagnostics' in app
          print('PASS standard notification template, health status and app icon diagnostics')
          PY
          if grep -R 'FloatingWidget\|ACTION_WIDGET\|Show floating speed' app/src/main/java/ app/src/main/AndroidManifest.xml; then
            echo 'Obsolete floating widget reference detected'; exit 1
          fi
          if grep -q 'android.permission.QUERY_ALL_PACKAGES' /tmp/blazenetmonitor-permissions.txt; then
            echo 'Unexpected broad installed-app inventory permission'; exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/BlazeNetMonitor-Android-v0.1.8-preview.1.apk
          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BlazeNetMonitor-Android-v0.1.8-preview.1-APK
          path: expiremental/BlazeNetMonitorAndroid/artifacts/
          retention-days: 60
      - name: Publish signed-debug APK preview release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag already exists. Keeping the immutable preview release unchanged.'
            echo 'This commit APK is available as this workflow run artifact, not as the older tagged release.'
            exit 0
          fi
          notes='BlazeNetMonitor Android v0.1.8: one ongoing notification with download-only status-bar speed. In expanded BigPictureStyle, two large health dots, two independently fetched favicon images (including supported PNG-in-ICO), readable targets, both speeds and session/day/month totals. Height compacted after observing Android 15 clipping. Real favicon loading requires site DNS/HTTPS; drawn globe fallback shown if unavailable. No overlays, custom RemoteViews or duplicated cards. Debug preview; physical-device acceptance remains pending.'
          for attempt in 1 2 3 4; do
            if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title 'BlazeNetMonitor Android v0.1.8 Preview APK' \
              --prerelease --notes "$notes"; then break; fi
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              sleep $((attempt*5))
            else
              echo 'Release appears after retry; proceeding to upload'
              break
            fi
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          for attempt in 1 2 3 4; do
            if gh release upload "$RELEASE_TAG" artifacts/*.apk artifacts/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber; then break; fi
            sleep $((attempt*5))
          done
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
          echo "$assets" | jq -e '.assets | map(.name) |
            index("BlazeNetMonitor-Android-v0.1.8-preview.1.apk") != null' >/dev/null
          echo "$assets" | jq -e '.assets | map(.name) | index("SHA256SUMS.txt") != null' >/dev/null
          echo 'PASS GitHub release and downloadable APK/sha256 assets verified'
