name: LAN Messenger v0.2.8 - floating call owner preview
on:
  push:
    branches: [release/lan-messenger-v028-floating-calls]
    paths: [.github/workflows/lan-messenger-publish-v027.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  verify-compiled-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require successful cross-platform source build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            conclusion="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40043721236 --jq '.conclusion // ""')"
            commit="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40043721236 --jq '.head_sha')"
            test "$commit" = "506363ab02ef0cfe30b993e11dda3e7e9fb46ba1" || { echo "Unrecognized source SHA"; exit 1; }
            if [ "$conclusion" = "success" ]; then
              echo "Verified successful full CI run 40043721236 for 506363ab02ef0cfe30b993e11dda3e7e9fb46ba1"
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "Build concluded $conclusion, refusing release"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out verifying compiled cross-platform candidate"
          exit 1

  windows-installer:
    needs: verify-compiled-candidate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested Windows portable app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 40043721236 --repo "$env:GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
          New-Item -ItemType Directory -Force -Path windows-payload | Out-Null
          Expand-Archive artifacts/windows/LAN-Messenger-Windows-Optimized.zip -DestinationPath windows-payload -Force
          if (!(Test-Path windows-payload/lan_messenger.exe)) { throw "Missing Windows executable" }
      - name: Assemble user-level EXE installer (no administrative rights needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @'
          [Setup]
          AppId=BlazingSystems.LANMessenger
          AppName=LAN Messenger
          AppVersion=0.2.8
          DefaultDirName={localappdata}\Programs\LAN Messenger
          DefaultGroupName=LAN Messenger
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          OutputDir=dist
          OutputBaseFilename=LAN-Messenger-Windows-Setup-v0.2.8
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayName=LAN Messenger
          SetupIconFile=windows-payload\data\flutter_assets\assets\icons\lan_messenger.ico
          [Files]
          Source: "windows-payload\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\LAN Messenger"; Filename: "{app}\lan_messenger.exe"
          [Run]
          Filename: "{app}\lan_messenger.exe"; Description: "Launch LAN Messenger"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 100000) { throw "Installer missing or too small" }
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer bytes: $($setup.Length), SHA256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.8
          path: dist/LAN-Messenger-Windows-Setup-v0.2.8.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optimized compiled platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/android artifacts/windows dist
          gh run download 40043721236 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Optimized --dir artifacts/android
          gh run download 40043721236 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.8
          path: artifacts/installer
      - name: Check checksums, stage downloads and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile
          checks = [
            ('artifacts/android/app-arm64-v8a-release.apk','LAN-Messenger-Android-arm64-v0.2.8.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-armeabi-v7a-release.apk','LAN-Messenger-Android-arm32-v0.2.8.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-x86_64-release.apk','LAN-Messenger-Android-x86_64-v0.2.8.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/windows/LAN-Messenger-Windows-Optimized.zip','LAN-Messenger-Windows-Portable-v0.2.8.zip','artifacts/windows/SHA256SUMS.txt'),
          ]
          for src, dst, sums in checks:
            p=Path(src)
            expected={line.split()[1].removeprefix('*'):line.split()[0].lower() for line in Path(sums).read_text(encoding='utf-8-sig').splitlines()}
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            assert expected.get(p.name)==actual, f'CI hash mismatch: {src}'
            if p.suffix=='.zip':
              with zipfile.ZipFile(p) as z: assert z.testzip() is None
            shutil.copy2(p,Path('dist')/dst)
          setup=Path('artifacts/installer/LAN-Messenger-Windows-Setup-v0.2.8.exe')
          assert setup.stat().st_size>100000, 'Missing Windows installer'
          shutil.copy2(setup, Path('dist')/setup.name)
          PY
          (cd dist && sha256sum *.apk *.zip *.exe > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # LAN Messenger v0.2.8 — Floating Calls Owner Test Preview

          Cross-platform release-preview compilation and smoke testing passed GitHub Actions. Physical-device incoming-call popups, call media and foreground behavior remain for owner acceptance, not production certified.

          ## Incoming calls
          - Windows: show only a small bottom-right non-focus-stealing call toast near the taskbar (not the full chat window), with visible **Answer** and **Decline** buttons. Drag its header to another location.
          - Answer audio without expanding Messenger: keep the small floating controller visible with **Mute**, **End**, **Thread**, and optional **Expand** actions.
          - Answer video into a small draggable viewer with the same controls. Thread restores the main chat while maintaining the call; Expand opens the complete call panel for existing screen sharing and remote-control tools.
          - On rejection, hangup or thread-opening, restore previous desktop window geometry and taskbar behavior; initially hidden Messenger remains hidden after call end.
          - Android: in-app incoming toast with Answer/Decline, Android CallStyle notification with native actions, and a draggable compact in-call card with media controls. Unlocked phones avoid a forced full-screen app switch.
          - New high-importance Android notification channels for this preview; notifications and popups still follow Android permissions, DND and vendor restrictions.

          ## Design and limits
          - Windows compact UI temporarily resizes the existing Flutter application HWND. This is not yet an independent second Windows overlay, nor does it guarantee overlay visibility above exclusive fullscreen games. It should avoid interrupting other normal desktop windows.
          - Windows installer is unsigned. Android APK signing identity may change between previews, requiring uninstall and loss of app-private data.
          - Use the ARM64 APK for typical modern phones; only install one matching architecture.
          - Call capture, frame refresh, Bluetooth audio, Android background notification policy, desktop drag and restoration need manual Windows↔Android acceptance checks before production.
          - Consent-based remote access and LAN transport restrictions remain unchanged.

          ## Automated build evidence
          - Source commit: https://github.com/BlazingSystems/BlazingSystems-Experiments/commit/506363ab02ef0cfe30b993e11dda3e7e9fb46ba1
          - Complete CI run: https://github.com/BlazingSystems/BlazingSystems-Experiments/actions/runs/40043721236
          - Release workflow requires all Android and Windows CI jobs, including emulator install, to pass before publication.
          EOF
      - name: Publish immutable GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lan-messenger-v0.2.8-preview.1 dist/*.apk dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target 506363ab02ef0cfe30b993e11dda3e7e9fb46ba1 \
            --title "LAN Messenger v0.2.8 - Floating Calls Preview" \
            --notes-file dist/RELEASE-NOTES.md --prerelease
