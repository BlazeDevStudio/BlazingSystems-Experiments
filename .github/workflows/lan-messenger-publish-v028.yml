name: LAN Messenger v0.2.8 - Compact Call Finalization Preview
on:
  push:
    branches: [release/lan-messenger-v028-compact-call-finalization]
    paths: [.github/workflows/lan-messenger-publish-v028.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  verify-compiled-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require successful cross-platform source build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            conclusion="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40041356332 --jq '.conclusion // ""')"
            commit="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40041356332 --jq '.head_sha')"
            test "$commit" = "7c707fa16420e80f8613bac56b567c370c5f8ed6" || { echo "Unrecognized source SHA"; exit 1; }
            if [ "$conclusion" = "success" ]; then
              echo "Verified successful full CI run 40041356332 for 7c707fa16420e80f8613bac56b567c370c5f8ed6"
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "Build concluded $conclusion, refusing release"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out verifying compiled cross-platform candidate"
          exit 1

  windows-installer:
    needs: verify-compiled-candidate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested Windows portable app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 40041356332 --repo "$env:GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
          New-Item -ItemType Directory -Force -Path windows-payload | Out-Null
          Expand-Archive artifacts/windows/LAN-Messenger-Windows-Optimized.zip -DestinationPath windows-payload -Force
          if (!(Test-Path windows-payload/lan_messenger.exe)) { throw "Missing Windows executable" }
      - name: Assemble user-level EXE installer (no administrative rights needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @'
          [Setup]
          AppId=BlazingSystems.LANMessenger
          AppName=LAN Messenger
          AppVersion=0.2.8
          DefaultDirName={localappdata}\Programs\LAN Messenger
          DefaultGroupName=LAN Messenger
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          OutputDir=dist
          OutputBaseFilename=LAN-Messenger-Windows-Setup-v0.2.8
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayName=LAN Messenger
          SetupIconFile=windows-payload\data\flutter_assets\assets\icons\lan_messenger.ico
          [Files]
          Source: "windows-payload\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\LAN Messenger"; Filename: "{app}\lan_messenger.exe"
          [Run]
          Filename: "{app}\lan_messenger.exe"; Description: "Launch LAN Messenger"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 100000) { throw "Installer missing or too small" }
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer bytes: $($setup.Length), SHA256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.8
          path: dist/LAN-Messenger-Windows-Setup-v0.2.8.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optimized compiled platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/android artifacts/windows dist
          gh run download 40041356332 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Optimized --dir artifacts/android
          gh run download 40041356332 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.8
          path: artifacts/installer
      - name: Check checksums, stage downloads and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile
          checks = [
            ('artifacts/android/app-arm64-v8a-release.apk','LAN-Messenger-Android-arm64-v0.2.8.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-armeabi-v7a-release.apk','LAN-Messenger-Android-arm32-v0.2.8.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-x86_64-release.apk','LAN-Messenger-Android-x86_64-v0.2.8.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/windows/LAN-Messenger-Windows-Optimized.zip','LAN-Messenger-Windows-Portable-v0.2.8.zip','artifacts/windows/SHA256SUMS.txt'),
          ]
          for src, dst, sums in checks:
            p=Path(src)
            expected={line.split()[1].removeprefix('*'):line.split()[0].lower() for line in Path(sums).read_text(encoding='utf-8-sig').splitlines()}
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            assert expected.get(p.name)==actual, f'CI hash mismatch: {src}'
            if p.suffix=='.zip':
              with zipfile.ZipFile(p) as z: assert z.testzip() is None
            shutil.copy2(p,Path('dist')/dst)
          setup=Path('artifacts/installer/LAN-Messenger-Windows-Setup-v0.2.8.exe')
          assert setup.stat().st_size>100000, 'Missing Windows installer'
          shutil.copy2(setup, Path('dist')/setup.name)
          PY
          (cd dist && sha256sum *.apk *.zip *.exe > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # LAN Messenger v0.2.8 — Compact, Non-Disruptive Calls

          **Owner-test release candidate, not field-certified production.**

          This update addresses incoming-call interruption and missing Answer/Decline actions in v0.2.7.

          ## Windows
          - Incoming calls now use a separate, draggable, non-activating popup near the system tray clock. The main LAN Messenger window is not restored or focused automatically.
          - Answer, Decline and Open Thread controls are available directly on the popup while the full app is hidden.
          - Answering voice keeps the main window minimized/hidden; the native popup switches to Mute/Unmute, End Call and Open Thread.
          - Answering video opens only a compact remote video viewer with draggable heading, mute/end/thread controls. It tries not to steal focus and restores prior main-window size/position/minimized visibility after the call.

          ## Android
          - System CallStyle notification with Answer and Decline; full-screen activity launch removed. Heads-up rendering is under Android's notification channel and DND rules.
          - Non-modal, draggable incoming-call controls are also provided while the app is open.
          - Ongoing call notification includes Hang Up, Mute and Open Thread; in-app mini viewer likewise has Mute/End/Open Thread/Expand.
          - System notification permission must be granted to receive notification banners while in another app.

          ## Previously retained
          - Encrypted P2P LAN intercom/video, screen sharing, owner-approved temporary remote control and four touch control modes.
          - The Android Accessibility permission setup flow remains manual and respects Android's restricted-settings policy.

          ## Verification and limits
          - Android and Windows source compilation, automated tests and APK validation via GitHub Actions: https://github.com/BlazingSystems/BlazingSystems-Experiments/actions/runs/40041356332
          - Windows Setup EXE is unsigned. Portable ZIP must be fully extracted; Android preview APKs can have a different signing key and may require uninstalling an older version, losing local app data.
          - **Important:** Real busy-PC no-focus-steal behavior, draggable native HWND, Android OEM call banner presentation, live video after screen capture, and Bluetooth/background calling STILL REQUIRE owner testing. Passing CI is not equivalent to real device approval.
          - Source: https://github.com/BlazingSystems/BlazingSystems-Experiments/commit/7c707fa16420e80f8613bac56b567c370c5f8ed6
          EOF
      - name: Publish immutable GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lan-messenger-v0.2.8-preview.1 dist/*.apk dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target 7c707fa16420e80f8613bac56b567c370c5f8ed6 \
            --title "LAN Messenger v0.2.8 - Compact Incoming Call Preview" \
            --notes-file dist/RELEASE-NOTES.md --prerelease
