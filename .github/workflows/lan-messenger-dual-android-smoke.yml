name: LAN Messenger - reusable dual Android cloud test
on:
  push:
    paths:
      - '.github/workflows/lan-messenger-dual-android-smoke.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Prior GitHub Actions run containing LAN-Messenger-Android-Optimized APK'
        type: string
        required: true
        default: '40086084493'

# This is an infrastructure/e2e test. Reuse a built v0.3.0 APK so
# iterating emulator setup does not waste another 10-minute Flutter rebuild.
permissions:
  contents: read
  actions: read

jobs:
  dual-android-lan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previously verified v0.3.0 Android binaries
        uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Android-Optimized
          run-id: ${{ inputs.source_run_id || '40086084493' }}
          repository: BlazingSystems/BlazingSystems-Experiments
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: android-apk
      - name: Install emulator native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          if [ -c /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: LAN Messenger first incoming background call Answer and WebRTC
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/.github/scripts/lan-messenger/run_dual_android_voice_e2e.sh"
      - name: Upload screenshots, UI hierarchy and network logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Dual-Android-LAN-Evidence
          path: android-lan-evidence/
          if-no-files-found: ignore
          retention-days: 14
