name: PHX Release ESP32 core compatibility
on:
  push:
    branches:
      - "phoenix/release-publisher-isolation-20261115"
    paths:
      - ".github/workflows/phx-release-esp32-core-compatibility.yml"
      - ".github/scripts/test_phx_release_esp32_core_compatibility.py"
      - ".github/scripts/test_release_artifact_action_pins.py"
      - ".github/PHX_RELEASE_HANDOVER.md"
  pull_request:
    branches:
      - "draft/softtimer-future-release-signing-pipeline-20261029"
    paths:
      - ".github/workflows/phx-release-esp32-core-compatibility.yml"
      - ".github/scripts/test_phx_release_esp32_core_compatibility.py"
      - ".github/scripts/test_release_artifact_action_pins.py"
      - ".github/PHX_RELEASE_HANDOVER.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phx-release-esp32-core-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "ESP32 core ${{ matrix.esp32_core }} / source 984ea8ff65a9"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        esp32_core: ["3.3.13", "4.0.0"]
    env:
      EXPECTED_SOURCE_SHA: "984ea8ff65a93b7da6e22fc2e1943acaf56100ca"
      EXPECTED_SKETCH_PATH: "experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/BlazePwifiVendo32.ino"
      EXPECTED_SKETCH_BLOB: "528187f68aaad7d76a690bbf1cbe338165ad3839"
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact PHX-HARDWARE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 984ea8ff65a93b7da6e22fc2e1943acaf56100ca
          path: hardware-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact hardware source and sketch blob
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git -C hardware-source rev-parse HEAD)"
          actual_sketch_blob="$(git -C hardware-source rev-parse "HEAD:${EXPECTED_SKETCH_PATH}")"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
          test "$actual_sketch_blob" = "$EXPECTED_SKETCH_BLOB"
          printf 'PHX-HARDWARE-SOURCE-PASS: commit=%s sketch_blob=%s\n' "$actual_source_sha" "$actual_sketch_blob"

      - name: Set up pinned Arduino CLI
        uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # verified Node24 action commit
        with:
          version: "1.6.0"

      - name: Verify Arduino CLI against pinned upstream archive
        run: python3 .github/scripts/verify_arduino_cli_archive.py --binary "$(command -v arduino-cli)"

      - name: Install and verify exact ESP32 core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${{ matrix.esp32_core }}"
          installed_core="$(arduino-cli core list | awk '$1 == "esp32:esp32" {print $2}')"
          test "$installed_core" = "${{ matrix.esp32_core }}"
          arduino-cli core list

      - name: Compile exact PHX-HARDWARE sketch
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/phx-esp32-${{ matrix.esp32_core }}"
          mkdir -p "$output_dir"
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir "$output_dir" "hardware-source/experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32"
          binary="$(find "$output_dir" -maxdepth 1 -type f -name '*.bin' -print -quit)"
          test -n "$binary"
          binary_sha256="$(sha256sum "$binary" | awk '{print $1}')"
          printf 'PHX-ESP32-COMPATIBILITY-PASS: core=%s source=%s sketch_blob=%s binary_sha256=%s\n' "${{ matrix.esp32_core }}" "$EXPECTED_SOURCE_SHA" "$EXPECTED_SKETCH_BLOB" "$binary_sha256"
