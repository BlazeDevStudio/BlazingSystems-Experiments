name: EasyMode R281 public candidate

on:
  push:
    branches: [easymode-v7-production]
    paths:
      - 'experiment/openwrt/easymode-project/releases/v10.2.0-r281-candidate/root/**'
      - 'experiment/openwrt/easymode-project/releases/v10.2.0-r281-candidate/SOURCE-MANIFEST.json'
      - 'experiment/openwrt/easymode-project/releases/v10.2.0-r281-candidate/openwrt/*app-update*.tar.gz'
      - 'experiment/openwrt/easymode-project/traffic/root/**'
      - 'experiment/openwrt/easymode-project/traffic/editions/**'
      - 'experiment/openwrt/easymode-project/traffic/tools/build.py'
      - 'experiment/openwrt/easymode-project/traffic/tools/install.sh'
      - 'experiment/openwrt/easymode-project/traffic/tools/Update-EasyMode.ps1'
      - 'experiment/openwrt/easymode-project/traffic/README.md'
      - 'experiment/openwrt/easymode-project/tools/build-r281-public-firmware.py'
      - 'experiment/openwrt/easymode-project/tools/build-r281-luci-restore.py'
      - 'experiment/openwrt/easymode-project/firmware/r281/**'
      - '.github/workflows/easymode-r281-public-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiment/openwrt/easymode-project
    steps:
      - uses: actions/checkout@v4
      - name: Install checked build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools build-essential
          python3 -m pip install --break-system-packages 'dissect.squashfs==1.12'
          git clone https://git.openwrt.org/project/fwtool.git /tmp/easymode-fwtool
          git -C /tmp/easymode-fwtool checkout 04cd252e4e9394ffacd51f56f1f124abc534f715
          cc -O2 -Wall -Wextra -o /tmp/easymode-fwtool/fwtool /tmp/easymode-fwtool/fwtool.c
      - name: Build and read back credential-free R281 filesystem
        run: |
          python3 tools/build-r281-public-firmware.py \
            --base-kernel firmware/r281/base/kernel.bin \
            --clean-root-tar firmware/r281/base/root.tar.gz \
            --mksquashfs /usr/bin/mksquashfs \
            --verify-squashfs \
            --output-dir /tmp/easymode-r281
          cp /tmp/easymode-r281/R281-EasyMode-v10.2.0-public-unsigned.bin /tmp/easymode-r281/R281-EasyMode-v10.2.0-public.bin
          /tmp/easymode-fwtool/fwtool -I /tmp/easymode-r281/metadata.json /tmp/easymode-r281/R281-EasyMode-v10.2.0-public.bin
          /tmp/easymode-fwtool/fwtool -i /tmp/easymode-r281/extracted-metadata.json /tmp/easymode-r281/R281-EasyMode-v10.2.0-public.bin
          cmp /tmp/easymode-r281/metadata.json /tmp/easymode-r281/extracted-metadata.json
      - name: Build matching LuCI restore and six Traffic editions
        run: |
          python3 tools/build-r281-luci-restore.py --output /tmp/easymode-r281/EasyMode-v10.2.0-R281-LuCI-restore.tar.gz
          python3 traffic/tools/build.py --output /tmp/easymode-r281/traffic
          tar -tzf /tmp/easymode-r281/EasyMode-v10.2.0-R281-LuCI-restore.tar.gz >/dev/null
          python3 -m py_compile tools/build-r281-public-firmware.py tools/build-r281-luci-restore.py
      - name: Stage candidate assets and checksums
        run: |
          mkdir -p /tmp/easymode-r281/assets
          cp /tmp/easymode-r281/R281-EasyMode-v10.2.0-public.bin /tmp/easymode-r281/assets/
          cp /tmp/easymode-r281/EasyMode-v10.2.0-R281-LuCI-restore.tar.gz /tmp/easymode-r281/assets/
          cp /tmp/easymode-r281/traffic/*-offline.tar.gz /tmp/easymode-r281/assets/
          cp releases/v10.2.0-r281-candidate/openwrt/EasyMode-v10.2.0-R281-app-update-candidate.tar.gz /tmp/easymode-r281/assets/
          cd /tmp/easymode-r281/assets
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish a candidate for this source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA:0:12}"
          tag="easymode-r281-v10.2.0-${short}"
          cat > /tmp/easymode-r281/RELEASE-NOTES.md <<'EOF'
          R281 candidate with EasyMode 10.2.0 and Traffic Intelligence 7.0.2.
          The public firmware contains a clean OpenWrt baseline, no device credentials, and watchdog reboot disabled by default.
          The R281 firmware was built and its packed filesystem read back in CI. The initial local candidate passed R281 sysupgrade compatibility testing without flashing; each CI build still requires device testing before installation.
          The LuCI restore is an overlay archive: it requires a reachable router and does not make factory reset persistence automatic.
          The private, device-specific R281 firmware and full restore archive are stored separately in the owner's Drive folder.
          EOF
          gh release create "$tag" /tmp/easymode-r281/assets/* --target "$GITHUB_SHA" --title "EasyMode R281 v10.2.0 candidate ${short}" --prerelease --notes-file /tmp/easymode-r281/RELEASE-NOTES.md
