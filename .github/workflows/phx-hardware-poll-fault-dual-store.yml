name: PHX-HARDWARE Poll Fault Dual-Store LAB
on:
  push:
    branches:
      - phoenix/hardware-poll-fault-dual-store-20261118
    paths:
      - "experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/BlazePwifiVendo32.ino"
      - "experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/BlazePwifiVendo.ino"
      - "experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_fault_dual_store_lab.py"
      - ".github/workflows/phx-hardware-poll-fault-dual-store.yml"
jobs:
  poll-fault-dual-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
      - name: Verify literal pushed SHA
        run: test "$(git rev-parse HEAD)" = "\${{ github.sha }}"
      - name: Compile exact firmware persistence helpers and inject storage failures
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_fault_dual_store_lab.py
      - name: Classify evidence without hardware promotion
        run: |
          echo "SIMULATED_ONLY=1"
          echo "LITTLEFS_SECONDARY_STORE_PHYSICAL_INDEPENDENCE=0"
          echo "PHYSICAL_POWER_CUT_VERIFIED=0"
          echo "PRODUCTION_FINANCIAL_AUTHORIZED=0"
