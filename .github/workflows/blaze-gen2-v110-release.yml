name: Blaze Gen2 Portable Studio v1.1.0 Windows build and release

on:
  push:
    branches: [main, blaze-gen2-roblox-station-isolation]
    paths:
      - 'expiremental/Blaze-Gen2-Portable-Studio/**'
      - '!expiremental/Blaze-Gen2-Portable-Studio/PROJECT_HANDOVER.md'
      - '.github/workflows/blaze-gen2-v110-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-test-and-release:
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: expiremental/Blaze-Gen2-Portable-Studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish real self-contained Win64 applications
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/PortableLauncher/PortableLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/launcher
          if ($LASTEXITCODE -ne 0) { throw 'PortableLauncher publish failed' }
          dotnet publish src/Studio/Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/studio
          if ($LASTEXITCODE -ne 0) { throw 'Studio publish failed' }
          dotnet publish tests/SyntheticApp/SyntheticApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/sample
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic app publish failed' }
          foreach ($file in @('out/studio/Create.exe', 'out/launcher/BlazePortableLauncher.exe', 'out/sample/SyntheticApp.exe')) {
            if (!(Test-Path $file)) { throw "Missing required real EXE: $file" }
          }
      - name: Run synthetic application integration tests
        run: |
          dotnet run --project tests/Integration/Integration.csproj -c Release -- 'out/sample/SyntheticApp.exe' 'out/launcher/BlazePortableLauncher.exe' 'out/studio/Create.exe'
          if ($LASTEXITCODE -ne 0) { throw "Integration tests failed with exit code $LASTEXITCODE" }
      - name: Verify v1.1 donation and safety sources
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Select-String -Path 'src/Studio/StudioWindow.cs' -Pattern 'case "DONATE"' -Quiet)) { throw 'Donation navigation missing' }
          if (!(Select-String -Path 'src/Studio/DonationQr.cs' -Pattern 'AEBWES36GX9K2' -Quiet)) { throw 'PayPal QR payload missing' }
          if (Select-String -Path 'src/Shared/DisklessSafety.cs','src/PortableLauncher/Program.cs','src/PackageBuilder/PackageBuilder.cs' -Pattern 'RejectUnverifiedRoblox|Roblox.*blocked|Roblox.*Unsupported' -Quiet) { throw 'Roblox must remain available' }
          if (!(Select-String -Path 'src/Shared/DisklessSafety.cs' -Pattern 'ProfileAppData' -Quiet)) { throw 'Station-private app-data roots missing' }
          if (!(Select-String -Path 'src/PortableLauncher/Program.cs' -Pattern 'ClientIsolation.Prepare' -Quiet)) { throw 'Client-local execution missing' }
      - name: Stage binaries documentation resources and integrity checks
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'out/release-stage/Blaze-Gen2-Portable-Studio'
          $release = 'out/release'
          $zipName = 'Blaze-Gen2-Portable-Studio-v1.1.0-win-x64.zip'
          New-Item -ItemType Directory -Force -Path $stage, $release, "$stage/Configs/Profiles", "$stage/Templates", "$stage/Runtime", "$stage/Docs" | Out-Null
          Copy-Item 'out/studio/*' $stage -Recurse -Force
          Copy-Item 'out/launcher/BlazePortableLauncher.exe' "$stage/BlazePortableLauncher.exe"
          Copy-Item 'configs/default.json' "$stage/Configs/default.json"
          Copy-Item 'configs/launcher-template.json' "$stage/Configs/launcher-template.json"
          Copy-Item 'configs/compatibility-profiles/*' "$stage/Configs/Profiles/" -Force
          Copy-Item 'README.md' "$stage/Docs/README.md"
          Copy-Item 'COMPATIBILITY.md' "$stage/Docs/COMPATIBILITY.md"
          Copy-Item 'LICENSE' "$stage/Docs/LICENSE"
          Copy-Item 'docs/*.md' "$stage/Docs/" -Force
          Copy-Item 'CHANGELOG.md' "$stage/Docs/CHANGELOG.md"
          '1.1.0-experimental' | Set-Content "$stage/VERSION" -Encoding utf8NoBOM
          foreach ($p in @("$stage/Create.exe","$stage/BlazePortableLauncher.exe","$stage/Configs/default.json","$stage/Docs/README.md")) {
            if (!(Test-Path $p)) { throw "Missing required staged file: $p" }
          }
          function Assert-PE($path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -lt 128 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Not an MZ executable: $path" }
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($pe -lt 64 -or ($pe+3) -ge $bytes.Length -or $bytes[$pe] -ne 80 -or $bytes[$pe+1] -ne 69 -or $bytes[$pe+2] -ne 0 -or $bytes[$pe+3] -ne 0) { throw "Not a valid PE signature: $path" }
          }
          Assert-PE "$stage/Create.exe"
          Assert-PE "$stage/BlazePortableLauncher.exe"
          Compress-Archive -Path $stage -DestinationPath "$release/$zipName" -CompressionLevel Optimal
          $outzip = "$release/$zipName"
          $sha = (Get-FileHash $outzip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $zipName" | Set-Content "$release/SHA256SUMS.txt" -Encoding ascii
          $unzipped = "$release/extracted"
          Expand-Archive $outzip -DestinationPath $unzipped -Force
          Assert-PE "$unzipped/Blaze-Gen2-Portable-Studio/Create.exe"
          Assert-PE "$unzipped/Blaze-Gen2-Portable-Studio/BlazePortableLauncher.exe"
          $actual = (Get-FileHash $outzip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $actual) { throw 'ZIP SHA256 mismatch' }
          if ((Get-Item $outzip).Length -lt 100000) { throw 'ZIP unexpectedly small' }
          Write-Host "Verified distribution zip $zipName SHA256=$sha"
      - name: Archive green-workflow distribution
        uses: actions/upload-artifact@v7
        with:
          name: Blaze-Gen2-v1.1.0-windows-verified
          path: |
            expiremental/Blaze-Gen2-Portable-Studio/out/release/*.zip
            expiremental/Blaze-Gen2-Portable-Studio/out/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish guarded GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.1.0-experimental'
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing silent overwrite" }
          gh release create $tag 'out/release/Blaze-Gen2-Portable-Studio-v1.1.0-win-x64.zip' 'out/release/SHA256SUMS.txt' --target "$env:GITHUB_SHA" --title 'Blaze Gen2 Portable Studio v1.1.0 (Experimental)' --notes 'Initial native WPF experimental converter. Windows 10/11 x64. Core synthetic application and per-client isolation tests pass in Actions; Roblox intentionally blocked because official same-account multi-device play can disconnect existing sessions. No real diskless SMB clients verified. Optional PayPal donation QR is in the native UI. Read COMPATIBILITY.md and test before production deployment.' --prerelease --verify-tag=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease creation failed' }
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release assets' }
          $names = @($assets.assets | ForEach-Object { $_.name })
          foreach ($expect in @('Blaze-Gen2-Portable-Studio-v1.1.0-win-x64.zip', 'SHA256SUMS.txt')) {
            if ($expect -notin $names) { throw "Missing published release asset: $expect" }
          }
          Write-Host ('Verified GitHub prerelease assets: ' + ($names -join ', '))
