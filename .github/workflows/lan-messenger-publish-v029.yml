name: LAN Messenger v0.2.9 - call repairs and groups preview
on:
  push:
    branches: [release/lan-messenger-v029-publisher]
    paths: [.github/workflows/lan-messenger-publish-v029.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  verify-compiled-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require successful cross-platform source build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            conclusion="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40066244240 --jq '.conclusion // ""')"
            commit="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40066244240 --jq '.head_sha')"
            test "$commit" = "7ae1f7e391ef5c532e882452f5ab3c5ac9d0c588" || { echo "Unrecognized source SHA"; exit 1; }
            if [ "$conclusion" = "success" ]; then
              echo "Verified successful full CI run 40066244240 for 7ae1f7e391ef5c532e882452f5ab3c5ac9d0c588"
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "Build concluded $conclusion, refusing release"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out verifying compiled cross-platform candidate"
          exit 1

  windows-installer:
    needs: verify-compiled-candidate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested Windows portable app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 40066244240 --repo "$env:GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
          New-Item -ItemType Directory -Force -Path windows-payload | Out-Null
          Expand-Archive artifacts/windows/LAN-Messenger-Windows-Optimized.zip -DestinationPath windows-payload -Force
          if (!(Test-Path windows-payload/lan_messenger.exe)) { throw "Missing Windows executable" }
      - name: Assemble user-level EXE installer (no administrative rights needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @'
          [Setup]
          AppId=BlazingSystems.LANMessenger
          AppName=LAN Messenger
          AppVersion=0.2.9
          DefaultDirName={localappdata}\Programs\LAN Messenger
          DefaultGroupName=LAN Messenger
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          OutputDir=dist
          OutputBaseFilename=LAN-Messenger-Windows-Setup-v0.2.9
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayName=LAN Messenger
          SetupIconFile=windows-payload\data\flutter_assets\assets\icons\lan_messenger.ico
          [Files]
          Source: "windows-payload\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\LAN Messenger"; Filename: "{app}\lan_messenger.exe"
          [Run]
          Filename: "{app}\lan_messenger.exe"; Description: "Launch LAN Messenger"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 100000) { throw "Installer missing or too small" }
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer bytes: $($setup.Length), SHA256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.9
          path: dist/LAN-Messenger-Windows-Setup-v0.2.9.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optimized compiled platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/android artifacts/windows dist
          gh run download 40066244240 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Optimized --dir artifacts/android
          gh run download 40066244240 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.9
          path: artifacts/installer
      - name: Check checksums, stage downloads and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile
          checks = [
            ('artifacts/android/app-arm64-v8a-release.apk','LAN-Messenger-Android-arm64-v0.2.9.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-armeabi-v7a-release.apk','LAN-Messenger-Android-arm32-v0.2.9.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-x86_64-release.apk','LAN-Messenger-Android-x86_64-v0.2.9.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/windows/LAN-Messenger-Windows-Optimized.zip','LAN-Messenger-Windows-Portable-v0.2.9.zip','artifacts/windows/SHA256SUMS.txt'),
          ]
          for src, dst, sums in checks:
            p=Path(src)
            expected={line.split()[1].removeprefix('*'):line.split()[0].lower() for line in Path(sums).read_text(encoding='utf-8-sig').splitlines()}
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            assert expected.get(p.name)==actual, f'CI hash mismatch: {src}'
            if p.suffix=='.zip':
              with zipfile.ZipFile(p) as z: assert z.testzip() is None
            shutil.copy2(p,Path('dist')/dst)
          setup=Path('artifacts/installer/LAN-Messenger-Windows-Setup-v0.2.9.exe')
          assert setup.stat().st_size>100000, 'Missing Windows installer'
          shutil.copy2(setup, Path('dist')/setup.name)
          PY
          (cd dist && sha256sum *.apk *.zip *.exe > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # LAN Messenger v0.2.9 — Call Lifecycle Repair and Group Features

          **Owner-test preview; group calling is experimental and not production certified.**

          ## Direct-call reliability and presentation
          - Windows: a minimized or tray-hidden Messenger shows a *separate native draggable incoming call notification*, with Answer/Decline. Answering audio continues through the call surface without restoring the full app. A video call uses a compact draggable video window. Opening Messenger shows an integrated Answer/Decline row instead of a floating popup.
          - Answered calls are not torn down if floating window operations fail. Closing the normal Windows Messenger window during an active call hides it in the tray instead of exiting.
          - Android: the in-app call is shown as an inline banner if Messenger is foreground. When backgrounded, Android shows a system call notification; if the device owner has separately enabled Display over other apps, the call can display a small draggable Answer/Decline overlay. An explicit Answer temporarily resumes the app for safe camera/microphone initialization on newer Android, then attempts system-managed picture-in-picture after the session is ready. PiP has End/Mute/Open Thread actions.
          - Android overlay permission is optional and must be granted manually by the device owner. Picture-in-picture availability depends on Android version and device. Do not confuse incoming-call overlay with a video PiP implementation.

          ## New group features
          - Encrypted peer-to-peer group chat with local history for 3–8 invited LAN users. Invitations must be approved; inbound group senders and message replay are validated.
          - Experimental voice/video group calls for 3–4 users (peer-to-peer WebRTC mesh, no external server). Members join explicitly. Per-peer hangup should not end other sessions.
          - Single-device automated protocol simulations exercise invitation, three-member group messaging, replay checks and capacity validation. Physical three/four-way WebRTC audio/video was NOT tested.

          ## Verification and testing
          - Build requires successful same-commit GitHub Actions Windows release, Flutter analyze/tests, Android APK signature/integrity verification and Android emulator installation/launch.
          - Live calling, background Android permissions on device-specific OEMs, floating HWND focus preservation and actual multiple-user video performance remain owner acceptance tests; CI cannot certify those.
          - Android APKs may use ephemeral preview signing and can require uninstall. Save any needed local files before changing installation. Windows installer is unsigned; portable ZIP must be fully extracted.
          - CI: https://github.com/BlazingSystems/BlazingSystems-Experiments/actions/runs/40066244240
          - Source: https://github.com/BlazingSystems/BlazingSystems-Experiments/commit/7ae1f7e391ef5c532e882452f5ab3c5ac9d0c588
          EOF
      - name: Publish immutable GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lan-messenger-v0.2.9-preview.1 dist/*.apk dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target 7ae1f7e391ef5c532e882452f5ab3c5ac9d0c588 \
            --title "LAN Messenger v0.2.9 - Call Repair and Group Preview" \
            --notes-file dist/RELEASE-NOTES.md --prerelease
