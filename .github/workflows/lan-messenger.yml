name: LAN Messenger - optimized release build and install checks
on:
  push:
    paths:
      - 'experiment/apps/LAN-Messenger/**'
      - '.github/scripts/lan-messenger/**'
      - '.github/workflows/lan-messenger.yml'
  workflow_dispatch:

# Avoid competing Android/Windows compilers from every intermediate commit.
concurrency:
  group: lan-messenger-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: experiment/apps/LAN-Messenger
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/generate_assets.py
      - run: flutter create --platforms=android --project-name lan_messenger .
      - run: python3 tool/prepare_platforms.py
      - run: flutter pub get
      - run: dart format --output=write lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Release AOT: no debug engine, validation layers or Dart kernel blob.
      # Standalone APK per CPU architecture: a user installs ONE matching file.
      - run: flutter build apk --release --split-per-abi --tree-shake-icons
      - name: Verify individual APK signing, APK structure and checksums
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            test -s "$apk"
            "$tools/apksigner" verify --verbose "$apk"
            "$tools/aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|native-code:)"
            unzip -t "$apk" | tail -1
          done
          (cd build/app/outputs/flutter-apk && sha256sum app-*-release.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Android-Optimized
          path: |
            experiment/apps/LAN-Messenger/build/app/outputs/flutter-apk/app-*-release.apk
            experiment/apps/LAN-Messenger/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  android-install-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Android-Optimized
          path: android-apk
      - name: Permit temporary KVM acceleration on this disposable runner
        shell: bash
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "No /dev/kvm device; emulator will use slower software mode"
          fi
      - name: Install and launch APK on Android emulator (no Internet required by app)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/experiment/apps/LAN-Messenger/tool/android_install_smoke.sh"
  android-pair-lan:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Android-Optimized
          path: android-apk
      - name: Install cloud emulator runtime libraries and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          if [ -c /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Two Android emulators — background incoming Answer and real WebRTC transport
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          # Voice tests must not disable virtual audio for the caller/callee.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-front emulated
          # Use THIS workflow's freshly built APK, not an older cached build:
          # source the LAN discovery stage and then exercise OS Answer, peer
          # transport readiness and hangup on two real emulator processes.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/lan-messenger/run_dual_android_voice_e2e.sh"
      - name: Upload dual-emulator network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Android-Peer-LAN-Evidence
          path: android-lan-evidence/
          if-no-files-found: ignore
          retention-days: 14

  android-pair-video:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Android-Optimized
          path: android-apk
      - name: Install cloud emulator runtime libraries and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          if [ -c /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Two real Android emulators — video frames, PiP expand, end while PiP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-front emulated
          script: bash "$GITHUB_WORKSPACE/.github/scripts/lan-messenger/run_dual_android_video_e2e.sh"
      - name: Upload independent video/PiP acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Android-Video-PiP-Evidence
          path: android-lan-evidence/
          if-no-files-found: ignore
          retention-days: 14

  android-peer-process-death:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Android-Optimized
          path: android-apk
      - name: Install emulator runtime libraries and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          if [ -c /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Two Android emulators — kill one live peer and require automatic orphan-call termination
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-front emulated
          script: bash "$GITHUB_WORKSPACE/.github/scripts/lan-messenger/run_dual_android_peer_death_e2e.sh"
      - name: Upload actual peer-process-death acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Android-Peer-Death-Evidence
          path: android-lan-evidence/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: experiment/apps/LAN-Messenger
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python tool/generate_assets.py
      - run: flutter create --platforms=windows --project-name lan_messenger .
      - run: python tool/prepare_platforms.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Validate privacy-limited Windows crash-report collector
        shell: pwsh
        run: ./tool/windows_crash_report.ps1 -SelfTest
      - run: flutter build windows --release --tree-shake-icons
      - name: Cloud Windows runtime, minimize, restore and close-to-tray smoke
        shell: pwsh
        run: ./tool/windows_runtime_smoke.ps1
      - name: Include application-local Microsoft VC++ runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$release/lan_messenger.exe")) { throw "Missing release executable" }
          foreach ($name in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $source = Join-Path $env:WINDIR "System32/$name"
            if (!(Test-Path $source)) { throw "Missing VC++ runtime DLL $source" }
            if ((Get-AuthenticodeSignature $source).Status -ne 'Valid') { throw "Unsigned MS runtime $source" }
            Copy-Item $source -Destination $release -Force
          }
          $size = (Get-ChildItem $release -Recurse -File | Measure-Object -Sum Length).Sum
          Write-Host "Optimized portable app bytes: $size"
          Compress-Archive -Path "$release/*" -DestinationPath build/LAN-Messenger-Windows-Optimized.zip -Force
          $h = (Get-FileHash build/LAN-Messenger-Windows-Optimized.zip -Algorithm SHA256).Hash.ToLower()
          "$h  LAN-Messenger-Windows-Optimized.zip" | Out-File -FilePath build/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows-Optimized
          path: |
            experiment/apps/LAN-Messenger/build/LAN-Messenger-Windows-Optimized.zip
            experiment/apps/LAN-Messenger/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
