name: Visualizer host stall diagnosis
on:
  push:
    branches: [blazing-visualizer-host-diagnostics]
    paths: ['.github/workflows/blazing-visualizer-host-diagnostics.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/Blazing-Visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Host suite with bounded JVM diagnostics
        run: timeout --signal=QUIT --kill-after=30s 7m ./gradlew clean :app:testDebugUnitTest --no-daemon --console=plain --stacktrace --info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualizer-host-diagnostics
          path: |
            experiments/Blazing-Visualizer/app/build/reports/
            experiments/Blazing-Visualizer/app/build/test-results/
