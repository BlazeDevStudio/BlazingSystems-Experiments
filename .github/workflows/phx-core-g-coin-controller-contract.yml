name: PHX-CORE-G ordinary coin and authenticated controller lab
on:
  push:
    branches:
      - fix/phx-core-g-coin-fixture-controller-auth-v1-20261029
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Historical handover freshness
        run: sh experiment/openwrt/BlazePwifi/tests/handover_gate.sh
      - name: Ordinary coin signed CGI ACK and quarantine
        run: sh experiment/openwrt/BlazePwifi/tests/v060_coin_false_ack.sh
      - name: PAY-0731 actual signed duplicate receipts and paid lock
        run: sh experiment/openwrt/BlazePwifi/tests/v060_vendo_coin_replay_lock.sh
      - name: Authenticated response nine adversarial host cases
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_controller_response_auth_v1.py
      - name: Controller compatibility plus signed CORE regression
        run: |
          sh experiment/openwrt/BlazePwifi/tests/v04_controller_compat.sh
          sh experiment/openwrt/BlazePwifi/tests/v053_members.sh
