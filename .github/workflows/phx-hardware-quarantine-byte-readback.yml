jobs:
  quarantine-source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify literal head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Compile exact ESP32 and ESP8266 quarantine source with fault-injected fake LittleFS
        run: |
          set -euo pipefail
          python3 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/quarantine_readback_lab.py
          python3 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/journal_mount_failclosed_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_fault_dual_store_runner_guard.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/cpp_fixture_runner_contract_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_fault_dual_store_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_fault_latch_edge_count_lab.py
          python3 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/pending_journal_recovery_lab.py
          python3 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/pending_attempt_marker_lab.py
          python3 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/pending_write_readback_lab.py
          python3 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/coin_post_gate_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_window_drain_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_loop_blocking_inhibit_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/cpp_token_normalizer_contract_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/bounded_http_response_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/request_digest_failure_lab.py
          python3 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/mbedtls_compat_guard_lab.py
          python3 experiment/openwrt/BlazePwifi/esp32/BlazePwifiVendo32/nvs_string_readback_lab.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/boot_polarity_workflow_wiring_lab.py
      - name: Verify ESP8266 EEPROM config-read failure and local config migration recovery
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/config_load_read_failure_lab.py
      - name: Enforce modular coin pulse lab boundaries
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/coin_pulse_capture_lab_structure_guard.py
      - name: Verify pulse capture after poll-drain abort (both board sketches)
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/coin_pulse_capture_lab.py
      - name: Verify strict JSON UTF-8 grammar on both board sketches
        run: |
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_json_array_primitive_lab_structure_guard.py
          python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/poll_json_array_primitive_lab.py
      - name: Verify ESP8266 cold-boot output polarity remains deny until locally configured
        run: python3 experiment/openwrt/BlazePwifi/esp8266/BlazePwifiVendo/esp8266_boot_polarity_lab.py
      - name: Assert real money and hardware are not certified
        run: |
          echo "SIMULATED_ONLY=1"
          echo "PHYSICAL_POWER_CUT_VERIFIED=0"
          echo "FINANCIAL_PRODUCTION_AUTHORIZED=0"
