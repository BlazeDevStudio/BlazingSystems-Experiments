name: BlazePwifi v0.5.2 release

on:
  push:
    branches: [blazepwifi-v0.5.2-implementation]
    paths:
      - '.github/blazepwifi-v052-release-request.json'
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful exact-candidate BlazePwifi build run"
        required: true
        type: string
      signing_run_id:
        description: "Locked production signing run ID, or 0 when unavailable"
        required: true
        default: "0"
        type: string
      candidate_sha:
        description: "Exact validated candidate SHA"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: blazepwifi-v052-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release request
        id: req
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUILD: ${{ inputs.build_run_id }}
          INPUT_SIGN: ${{ inputs.signing_run_id }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            BUILD_RUN="$INPUT_BUILD"; SIGN_RUN="$INPUT_SIGN"; SHA="$INPUT_SHA"
          else
            BUILD_RUN="$(jq -r '.build_run_id // empty' .github/blazepwifi-v052-release-request.json)"
            SIGN_RUN="$(jq -r '.signing_run_id // "0"' .github/blazepwifi-v052-release-request.json)"
            SHA="$(jq -r '.candidate_sha // empty' .github/blazepwifi-v052-release-request.json)"
          fi
          printf "%s" "$BUILD_RUN" | grep -Eq "^[0-9]+$"
          printf "%s" "$SIGN_RUN" | grep -Eq "^[0-9]+$"
          printf "%s" "$SHA" | grep -Eq "^[0-9a-f]{40}$"
          B="$(gh api "repos/${{ github.repository }}/actions/runs/$BUILD_RUN")"
          test "$(printf "%s" "$B" | jq -r .conclusion)" = success
          test "$(printf "%s" "$B" | jq -r .head_sha)" = "$SHA"
          if [ "$SIGN_RUN" != 0 ]; then
            S="$(gh api "repos/${{ github.repository }}/actions/runs/$SIGN_RUN")"
            test "$(printf "%s" "$S" | jq -r .conclusion)" = success
          fi
          echo "build=$BUILD_RUN" >> "$GITHUB_OUTPUT"
          echo "sign=$SIGN_RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Preserve v0.5.2 release notes
        run: cp experiment/openwrt/BlazePwifi/releases/0.5.2/README.md "$RUNNER_TEMP/v052-README.md"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.sha }}

      - name: Download exact build artifacts
        shell: bash
        env:
          BUILD_RUN: ${{ steps.req.outputs.build }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/build
          gh run download "$BUILD_RUN" --repo "${{ github.repository }}" --dir artifacts/build
          GATE="$(find artifacts/build -type f -name CANDIDATE-GATE.json -print -quit)"
          test -n "$GATE" -a -s "$GATE"
          test "$(jq -r .status "$GATE")" = passed
          test "$(jq -r .release "$GATE")" = 0.5.2
          test "$(jq -r .commit "$GATE")" = "${{ steps.req.outputs.sha }}"

      - name: Download locked production APK when available
        if: steps.req.outputs.sign != '0'
        shell: bash
        env:
          SIGN_RUN: ${{ steps.req.outputs.sign }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/signed
          gh run download "$SIGN_RUN" --repo "${{ github.repository }}" --name BlazeRental-v0.5.2-production-signed --dir artifacts/signed
          test -s artifacts/signed/BlazeRental.apk
          test "$(jq -r .release artifacts/signed/SIGNING-MANIFEST.json)" = 0.5.2
          test "$(jq -r .candidate_sha artifacts/signed/SIGNING-MANIFEST.json)" = "${{ steps.req.outputs.sha }}"

      - name: Assemble release assets
        shell: bash
        env:
          BUILD_RUN: ${{ steps.req.outputs.build }}
          SIGN_RUN: ${{ steps.req.outputs.sign }}
          SHA: ${{ steps.req.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          CI="$(find artifacts/build -type f -name BlazeRental-v0.5.2-ci.apk -print -quit)"
          UNSIGNED="$(find artifacts/build -type f -name BlazeRental-v0.5.2-release-unsigned.apk -print -quit)"
          test -n "$CI" -a -s "$CI" -a -n "$UNSIGNED" -a -s "$UNSIGNED"
          RESCUE_TEST="$(find artifacts/build -type f -name 'BlazeRental-v0.5.1-rescue-for-v0.5.2-TEST.apk' -print -quit)"
          RESCUE_UNSIGNED="$(find artifacts/build -type f -name 'BlazeRental-v0.5.1-rescue-for-v0.5.2-release-unsigned.apk' -print -quit)"
          test -n "$RESCUE_TEST" -a -s "$RESCUE_TEST" -a -n "$RESCUE_UNSIGNED" -a -s "$RESCUE_UNSIGNED"
          cp "$CI" release-out/BlazeRental-v0.5.2-TEST.apk
          cp "$UNSIGNED" release-out/BlazeRental-v0.5.2-release-unsigned.apk
          cp "$RESCUE_TEST" release-out/BlazeRental-v0.5.1-rescue-for-v0.5.2-TEST.apk
          cp "$RESCUE_UNSIGNED" release-out/BlazeRental-v0.5.1-rescue-for-v0.5.2-release-unsigned.apk
          if [ "$SIGN_RUN" != 0 ]; then
            cp artifacts/signed/BlazeRental.apk release-out/BlazeRental.apk
            cp artifacts/signed/BlazeRental-v0.5.1-rescue-for-v0.5.2.apk release-out/BlazeRental-v0.5.1-rescue-for-v0.5.2.apk
            cp artifacts/signed/SIGNING-MANIFEST.json release-out/BlazeRental-SIGNING-MANIFEST.json
            cp artifacts/signed/RECOVERY-MANIFEST.json release-out/BlazeRental-RECOVERY-MANIFEST.json
            cp artifacts/signed/BlazeRental-signing-fingerprint.txt release-out/BlazeRental-signing-fingerprint.txt
            cp artifacts/signed/BlazeRental-signing-cert.pem release-out/BlazeRental-signing-cert.pem
            cp artifacts/signed/BlazeRental-apksigner-verify.txt release-out/BlazeRental-apksigner-verify.txt
            cp artifacts/signed/BlazeRental-rescue-apksigner-verify.txt release-out/BlazeRental-rescue-apksigner-verify.txt
            cp artifacts/signed/BlazeRental-v0.5.2-lineage2-signing-backup.enc release-out/
            cp artifacts/signed/BlazeRental-v0.5.2-lineage2-signing-nonce.bin release-out/
            cp artifacts/signed/BlazeRental-v0.5.2-lineage2-key-recovery-A.enc release-out/
            cp artifacts/signed/BlazeRental-v0.5.2-lineage2-key-recovery-B.enc release-out/
            cp artifacts/signed/BlazeRental-v0.5.2-recovery-A-public.pem release-out/
            cp artifacts/signed/BlazeRental-v0.5.2-recovery-B-public.pem release-out/
            cp artifacts/signed/unseal-blazerental-lineage2.py release-out/

            python3 experiment/openwrt/BlazePwifi/tools/build-rental-qr-tool.py \
              --apk release-out/BlazeRental.apk \
              --apk-url "https://github.com/BlazingSystems/BlazingSystems-Experiments/releases/download/v0.5.2/BlazeRental.apk" \
              --template experiment/openwrt/BlazePwifi/tools/BlazeRental-QR-Setup.template.html \
              --qrcode-js experiment/openwrt/BlazePwifi/ui/vendor/qrcode/qrcode.js \
              --out release-out/BlazeRental-QR-Setup.html
            python3 experiment/openwrt/BlazePwifi/tools/make-provisioning.py \
              --apk release-out/BlazeRental.apk \
              --apk-url "https://github.com/BlazingSystems/BlazingSystems-Experiments/releases/download/v0.5.2/BlazeRental.apk" \
              --server-url "http://192.168.1.1:8080" \
              --enrollment-token "000000000000.000000000000000000000000000000000000" \
              --device-name "SAMPLE - generate a real token in admin" \
              --out release-out/BlazeRental-provisioning-SAMPLE.json
            python3 -m pip install --quiet "qrcode[pil]"
            python3 experiment/openwrt/BlazePwifi/tools/render-qr.py \
              --json release-out/BlazeRental-provisioning-SAMPLE.json \
              --out release-out/BlazeRental-provisioning-SAMPLE.png
          fi

          # Flatten deployable build outputs while keeping names stable. Duplicate
          # basenames are prefixed with their artifact directory.
          find artifacts/build -type f \( -name "*.bin" -o -name "*.img" -o -name "*.img.gz" -o -name "*.tar.gz" -o -name "*.ino" \) -print0 | while IFS= read -r -d "" f; do
            base="$(basename "$f")"
            dest="release-out/$base"
            if [ -e "$dest" ]; then
              parent="$(basename "$(dirname "$f")" | tr " /" "--")"
              dest="release-out/${parent}-${base}"
            fi
            cp "$f" "$dest"
          done

          BOOTSTRAP="$(find artifacts/build -type f -name 'BlazePwifi-v0.5.2-update-bootstrap.sh' -print -quit)"
          BOOTSTRAP_SHA="$(find artifacts/build -type f -name 'BlazePwifi-v0.5.2-update-bootstrap.sh.sha256' -print -quit)"
          test -n "$BOOTSTRAP" -a -s "$BOOTSTRAP" -a -n "$BOOTSTRAP_SHA" -a -s "$BOOTSTRAP_SHA"
          cp "$BOOTSTRAP" release-out/BlazePwifi-v0.5.2-update-bootstrap.sh
          cp "$BOOTSTRAP_SHA" release-out/BlazePwifi-v0.5.2-update-bootstrap.sh.sha256
          cp "$RUNNER_TEMP/v052-README.md" release-out/README.md
          GATE="$(find artifacts/build -type f -name CANDIDATE-GATE.json -print -quit)"
          cp "$GATE" release-out/CANDIDATE-GATE.json
          LINEAGE="unsigned"
          FINGERPRINT=""
          if [ "$SIGN_RUN" != 0 ]; then
            LINEAGE="$(jq -r .certificate_lineage artifacts/signed/SIGNING-MANIFEST.json)"
            FINGERPRINT="$(jq -r .signing_fingerprint artifacts/signed/SIGNING-MANIFEST.json)"
          fi
          jq -n --arg release "0.5.2" --arg sha "$SHA" --arg build "$BUILD_RUN" --arg sign "$SIGN_RUN" \
            --arg lineage "$LINEAGE" --arg fingerprint "$FINGERPRINT" \
            '{release:$release,commit:$sha,build_run_id:$build,signing_run_id:$sign,candidate_gate:"passed",production_signed:($sign!="0"),certificate_lineage:$lineage,signing_fingerprint:$fingerprint,transactional_update:"blazepwifi-overlay-v1",rollback_rescue:"0.5.1-rescue-for-0.5.2",android_package:"com.blazesystems.blazerental"}' \
            > release-out/RELEASE-MANIFEST.json
          (cd release-out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-v0.5.2-release-stage
          path: release-out/
          retention-days: 90
          if-no-files-found: error

      - name: Publish v0.5.2
        shell: bash
        env:
          SHA: ${{ steps.req.outputs.sha }}
          SIGN_RUN: ${{ steps.req.outputs.sign }}
        run: |
          set -euo pipefail
          TAG=v0.5.2
          NOTES="$RUNNER_TEMP/v052-README.md"
          EXTRA=()
          if [ "$SIGN_RUN" = 0 ]; then EXTRA+=(--prerelease); fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --target "$SHA" --title "BlazePwifi v0.5.2 — LCM Branding & Rental Time Alarms" --notes-file "$NOTES" "${EXTRA[@]}"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --target "$SHA" --title "BlazePwifi v0.5.2 — LCM Branding & Rental Time Alarms" --notes-file "$NOTES" "${EXTRA[@]}"
          fi
          find release-out -maxdepth 1 -type f -print0 | xargs -0 -r gh release upload "$TAG" --repo "${{ github.repository }}" --clobber
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" > release.json
          jq -e '.assets[] | select(.name=="BlazeRental-v0.5.2-TEST.apk")' release.json >/dev/null
          jq -e '.assets[] | select(.name=="BlazeRental-v0.5.1-rescue-for-v0.5.2-TEST.apk")' release.json >/dev/null
          jq -e '.assets[] | select(.name=="BlazePwifi-v0.5.2-update.tar.gz")' release.json >/dev/null
          jq -e '.assets[] | select(.name=="BlazePwifi-v0.5.2-update-bootstrap.sh")' release.json >/dev/null
          jq -e '.assets[] | select(.name=="RELEASE-MANIFEST.json")' release.json >/dev/null
          if [ "$SIGN_RUN" != 0 ]; then
            jq -e '.assets[] | select(.name=="BlazeRental.apk")' release.json >/dev/null
            jq -e '.assets[] | select(.name=="BlazeRental-v0.5.1-rescue-for-v0.5.2.apk")' release.json >/dev/null
            jq -e '.assets[] | select(.name=="BlazeRental-signing-cert.pem")' release.json >/dev/null
            jq -e '.assets[] | select(.name=="BlazeRental-v0.5.2-lineage2-signing-backup.enc")' release.json >/dev/null
            jq -e '.assets[] | select(.name=="BlazeRental-v0.5.2-lineage2-key-recovery-A.enc")' release.json >/dev/null
            jq -e '.assets[] | select(.name=="BlazeRental-v0.5.2-lineage2-key-recovery-B.enc")' release.json >/dev/null
            jq -e '.assets[] | select(.name=="BlazeRental-QR-Setup.html")' release.json >/dev/null
            RID="$(jq -r .id release.json)"
            gh api --method PATCH "repos/${{ github.repository }}/releases/$RID" -F prerelease=false >/dev/null
            gh api "repos/${{ github.repository }}/releases/$RID" | jq -e '.prerelease == false' >/dev/null
          fi
