name: LAN Messenger v0.2.2 - installer and release
on:
  push:
    branches: [fix/lan-messenger-v0.2.2-optimized-builds]
    paths: [.github/workflows/lan-messenger-publish-v022.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested Windows portable app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 39947923917 --repo "$env:GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
          New-Item -ItemType Directory -Force -Path windows-payload | Out-Null
          Expand-Archive artifacts/windows/LAN-Messenger-Windows-Optimized.zip -DestinationPath windows-payload -Force
          if (!(Test-Path windows-payload/lan_messenger.exe)) { throw "Missing Windows executable" }
      - name: Assemble user-level EXE installer (no administrative rights needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @'
          [Setup]
          AppId=BlazingSystems.LANMessenger
          AppName=LAN Messenger
          AppVersion=0.2.2
          DefaultDirName={localappdata}\Programs\LAN Messenger
          DefaultGroupName=LAN Messenger
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          OutputDir=dist
          OutputBaseFilename=LAN-Messenger-Windows-Setup-v0.2.2
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayName=LAN Messenger
          SetupIconFile=windows-payload\data\flutter_assets\assets\icons\lan_messenger.ico
          [Files]
          Source: "windows-payload\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\LAN Messenger"; Filename: "{app}\lan_messenger.exe"
          [Run]
          Filename: "{app}\lan_messenger.exe"; Description: "Launch LAN Messenger"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 100000) { throw "Installer missing or too small" }
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer bytes: $($setup.Length), SHA256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.2
          path: dist/LAN-Messenger-Windows-Setup-v0.2.2.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optimized compiled platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/android artifacts/windows dist
          gh run download 39947923917 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Optimized --dir artifacts/android
          gh run download 39947923917 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.2
          path: artifacts/installer
      - name: Check checksums, stage downloads and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile
          checks = [
            ('artifacts/android/app-arm64-v8a-release.apk','LAN-Messenger-Android-arm64-v0.2.2.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-armeabi-v7a-release.apk','LAN-Messenger-Android-arm32-v0.2.2.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-x86_64-release.apk','LAN-Messenger-Android-x86_64-v0.2.2.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/windows/LAN-Messenger-Windows-Optimized.zip','LAN-Messenger-Windows-Portable-v0.2.2.zip','artifacts/windows/SHA256SUMS.txt'),
          ]
          for src, dst, sums in checks:
            p=Path(src)
            expected={line.split()[1].removeprefix('*'):line.split()[0].lower() for line in Path(sums).read_text(encoding='utf-8-sig').splitlines()}
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            assert expected.get(p.name)==actual, f'CI hash mismatch: {src}'
            if p.suffix=='.zip':
              with zipfile.ZipFile(p) as z: assert z.testzip() is None
            shutil.copy2(p,Path('dist')/dst)
          setup=Path('artifacts/installer/LAN-Messenger-Windows-Setup-v0.2.2.exe')
          assert setup.stat().st_size>100000, 'Missing Windows installer'
          shutil.copy2(setup, Path('dist')/setup.name)
          PY
          (cd dist && sha256sum *.apk *.zip *.exe > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # LAN Messenger v0.2.2 — Optimized Compatibility Preview

          This replaces oversized debug packages with **release-optimized builds** while keeping offline chat, file transfers, voice/video calling, notifications, and tray/background options.

          **Android:** Install one APK matching your CPU (normally **ARM64** for modern Samsung/Android phones). ARM32 is for older phones, x86_64 for Intel-based Android. APK signing, manifest and checksum verification passed CI. They are signed with temporary CI debug keystores because permanent signing secrets have not yet been configured; updating an older preview may require uninstalling it, and uninstalling removes app-private histories.

          **Windows:** Use the one-click user-level Setup EXE (no admin rights required) or extract the portable ZIP and launch lan_messenger.exe. Includes application-local Microsoft Visual C++ dependencies for machines without the redistributable installed.

          **Improvements:** Flutter AOT release compilation, architecture-specific APKs, deferred optional initialization, lazy sound player, coalesced transfer progress UI, reduced icons/assets. No protocol or encrypted transfer semantics removed.

          **Caution:** Real low-spec Windows/PisoNet and Samsung ARM64 installation are not yet verified. The Windows WebRTC call crash and Flutter red-screen assertion from prior builds require physical re-test. Motorcycle helmet audio and screen-off call reliability are not certified. This remains a preview, not a safety-critical intercom.

          Build evidence: https://github.com/BlazingSystems/BlazingSystems-Experiments/actions/runs/39947923917
          EOF
      - name: Publish immutable GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lan-messenger-v0.2.2-preview.1 dist/*.apk dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "LAN Messenger v0.2.2 - Optimized Compatibility Preview" \
            --notes-file dist/RELEASE-NOTES.md --prerelease
