name: BlazeNetMonitor Android Emulator Smoke
on:
  push:
    branches: [feature/blazenetmonitor-android-v0.1.0]
    paths: ['.github/workflows/blazenetmonitor-android-emulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK for emulator
        working-directory: expiremental/BlazeNetMonitorAndroid
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Boot Android 35 emulator and smoke test launch, monitor and QR
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            APK="expiremental/BlazeNetMonitorAndroid/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell am start -W -n com.blazesystems.blazenetmonitor/.MainActivity
            sleep 5
            adb shell input keyevent KEYCODE_BACK || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb exec-out cat /sdcard/window.xml > /tmp/blaze-android-ui.xml
            python3 - <<'PY'
            import xml.etree.ElementTree as E,re,subprocess
            root=E.parse('/tmp/blaze-android-ui.xml').getroot()
            nodes=[n for n in root.iter('node') if 'Start monitoring' in n.attrib.get('text','')]
            if not nodes: raise SystemExit('Start monitoring button not found in native Android view')
            coords=list(map(int,re.findall(r'\d+',nodes[0].attrib['bounds'])))
            subprocess.run(['adb','shell','input','tap',str((coords[0]+coords[2])//2),str((coords[1]+coords[3])//2)],check=True)
            PY
            sleep 8
            adb shell dumpsys activity services | grep -q 'com.blazesystems.blazenetmonitor'
            adb logcat -d -v brief | tee /tmp/blaze-android-logcat.txt >/dev/null
            if grep -E 'FATAL EXCEPTION|AndroidRuntime.*Process: com\.blazesystems\.blazenetmonitor' /tmp/blaze-android-logcat.txt; then
              echo 'Potential Android fatal exception: inspect logcat'
              exit 1
            fi
            echo 'PASS Android emulator native UI launch, monitoring service and no fatal process exception'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlazeNetMonitor-Android35-emulator-log
          path: /tmp/blaze-android-logcat.txt
          if-no-files-found: ignore
