name: BlazeNetMonitor Android Emulator Smoke
on:
  push:
    branches: [feature/blazenetmonitor-android-v0.1.0]
    paths:
      - '.github/workflows/blazenetmonitor-android-emulator.yml'
      - 'expiremental/BlazeNetMonitorAndroid/app/src/main/java/com/blazesystems/blazenetmonitor/MonitorService.java'
      - 'expiremental/BlazeNetMonitorAndroid/ci/emulator-smoke.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK for emulator
        working-directory: expiremental/BlazeNetMonitorAndroid
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator KVM acceleration where available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot Android 35 emulator and verify real Start monitoring click
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash expiremental/BlazeNetMonitorAndroid/ci/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlazeNetMonitor-Android35-emulator-log
          path: |
            /tmp/blaze-android-logcat.txt
            /tmp/blaze-android-notification-after.txt
            /tmp/blaze-android-expanded-shade.png
          if-no-files-found: ignore
