name: BlazeNetMonitor Preview Download
on:
  push:
    branches:
      - feature/blazenetmonitor-v0.1.0
    paths:
      - .github/workflows/blazenetmonitor-preview-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-preview:
    if: github.repository == 'BlazingSystems/BlazingSystems-Experiments' && github.ref == 'refs/heads/feature/blazenetmonitor-v0.1.0'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: expiremental/BlazeNetMonitor
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: blazenetmonitor-v0.3.0-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check core behavior
        run: dotnet run --project tests/BlazeNetMonitor.Tests/BlazeNetMonitor.Tests.csproj -c Release
      - name: Build downloadable x64, x86, and ARM64 packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($rid in @('win-x64', 'win-x86', 'win-arm64')) {
            dotnet publish src/BlazeNetMonitor/BlazeNetMonitor.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "dist/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid" }
            $exe = "dist/$rid/BlazeNetMonitor.exe"
            if (-not (Test-Path $exe)) { throw "Missing $exe" }
            $zip = "artifacts/BlazeNetMonitor-v0.3.0-$rid.zip"
            Compress-Archive -Path $exe -DestinationPath $zip -CompressionLevel Optimal -Force
            if (-not (Test-Path $zip)) { throw "Missing $zip" }
            Get-FileHash $zip -Algorithm SHA256 | Format-List
          }
      - name: Build small framework-dependent Windows x64 package
        shell: pwsh
        run: |
          dotnet publish src/BlazeNetMonitor/BlazeNetMonitor.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o dist/win-x64-lite
          if ($LASTEXITCODE -ne 0) { throw 'Lite framework-dependent publish failed' }
          if (-not (Test-Path 'dist/win-x64-lite/BlazeNetMonitor.exe')) { throw 'Lite EXE missing' }
          Compress-Archive -Path 'dist/win-x64-lite/*' -DestinationPath 'artifacts/BlazeNetMonitor-v0.3.0-win-x64-lite.zip' -CompressionLevel Optimal -Force
          Get-FileHash 'artifacts/BlazeNetMonitor-v0.3.0-win-x64-lite.zip' -Algorithm SHA256 | Format-List
      - name: Windows QR visibility and uncropped About image check
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/win-x64/BlazeNetMonitor.exe').Path
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-qr-render' -PassThru -Wait
          if ($check.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP 'BlazeNetMonitor-QR-render-failure.txt'
            if (Test-Path $failure) { Get-Content $failure }
            throw "Windows QR render and UI geometry self-test failed with exit code $($check.ExitCode)"
          }
          Write-Host 'PASS Windows GDI+ QR image exact sizes, opaque splash, uncropped About QR, settings removed'
      - name: Windows Network Connections enumeration regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/win-x64/BlazeNetMonitor.exe').Path
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-network-connections' -PassThru -Wait
          $summary = Join-Path $env:TEMP 'BlazeNetMonitor-adapter-check.txt'
          if (Test-Path $summary) { Get-Content $summary }
          if ($check.ExitCode -ne 0) {
            throw "Network Connections adapter listing failed exit $($check.ExitCode)"
          }
          Write-Host 'PASS default adapters match native Network Connections when available'
      - name: Windows top-apps hover and historical ranking check
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/win-x64/BlazeNetMonitor.exe').Path
          $check = Start-Process -FilePath $exe -ArgumentList '--verify-top-apps' -PassThru -Wait
          $trace = Join-Path $env:TEMP 'BlazeNetMonitor-top-apps-check.txt'
          if (Test-Path $trace) { Get-Content $trace }
          if ($check.ExitCode -ne 0) {
            throw "Top-apps layout failed with exit code $($check.ExitCode)"
          }
          Write-Host 'PASS top five historical apps with icons and compact hover fallback'
      - name: Windows x64 GUI process launch smoke check
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/win-x64/BlazeNetMonitor.exe").Path
          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 7
            $app.Refresh()
            if ($app.HasExited) { throw "BlazeNetMonitor exited during launch smoke test (code $($app.ExitCode))" }
            Write-Host "PASS GUI process remained alive for 7 seconds on Windows runner"
          }
          finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Publish GitHub pre-release (not production-certified)
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Preview release tag already exists; refusing to overwrite a published build.' }
          gh release create $env:RELEASE_TAG artifacts/BlazeNetMonitor-v0.3.0-win-x64.zip artifacts/BlazeNetMonitor-v0.3.0-win-x86.zip artifacts/BlazeNetMonitor-v0.3.0-win-arm64.zip artifacts/BlazeNetMonitor-v0.3.0-win-x64-lite.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'BlazeNetMonitor v0.3.0 Preview 1' --prerelease --notes 'BlazeNetMonitor v0.3.0 PREVIEW: adds Top 5 Apps by cumulative Windows network data since restart to the compact at-a-glance hover, using SRUM hourly history rather than currently active connections. Shows icons extracted from app executables or registered app paths, app names, and combined up/down bytes; retains past apps that are no longer running. The historical source is optional: operator-supplied NetworkUsageView.exe beside the app (not redistributed), or Import app network history (CSV) from the tray. Without a trusted source, the UI explicitly states history is unavailable rather than fabricating per-app bytes. SRUM aggregation is delayed; the reboot-boundary partial hour is excluded. This is not exact per-packet accounting. Existing dots, traffic graphs, QR and adapter options remain intact. Windows CI verifies source-level ranking, the five-row visual layout and native GUI launch; elevation and actual SRUM access remain to be tested on end-user Windows hardware.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub pre-release creation failed' }
