name: BlazeNetMonitor Preview Download
on:
  push:
    branches:
      - feature/blazenetmonitor-v0.1.0
    paths:
      - .github/workflows/blazenetmonitor-preview-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-preview:
    if: github.repository == 'BlazingSystems/BlazingSystems-Experiments' && github.ref == 'refs/heads/feature/blazenetmonitor-v0.1.0'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: expiremental/BlazeNetMonitor
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: blazenetmonitor-v0.2.7-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check core behavior
        run: dotnet run --project tests/BlazeNetMonitor.Tests/BlazeNetMonitor.Tests.csproj -c Release
      - name: Build downloadable x64, x86, and ARM64 packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($rid in @('win-x64', 'win-x86', 'win-arm64')) {
            dotnet publish src/BlazeNetMonitor/BlazeNetMonitor.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "dist/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid" }
            $exe = "dist/$rid/BlazeNetMonitor.exe"
            if (-not (Test-Path $exe)) { throw "Missing $exe" }
            $zip = "artifacts/BlazeNetMonitor-v0.2.7-$rid.zip"
            Compress-Archive -Path $exe -DestinationPath $zip -CompressionLevel Optimal -Force
            if (-not (Test-Path $zip)) { throw "Missing $zip" }
            Get-FileHash $zip -Algorithm SHA256 | Format-List
          }
      - name: Build small framework-dependent Windows x64 package
        shell: pwsh
        run: |
          dotnet publish src/BlazeNetMonitor/BlazeNetMonitor.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o dist/win-x64-lite
          if ($LASTEXITCODE -ne 0) { throw 'Lite framework-dependent publish failed' }
          if (-not (Test-Path 'dist/win-x64-lite/BlazeNetMonitor.exe')) { throw 'Lite EXE missing' }
          Compress-Archive -Path 'dist/win-x64-lite/*' -DestinationPath 'artifacts/BlazeNetMonitor-v0.2.7-win-x64-lite.zip' -CompressionLevel Optimal -Force
          Get-FileHash 'artifacts/BlazeNetMonitor-v0.2.7-win-x64-lite.zip' -Algorithm SHA256 | Format-List
      - name: Windows x64 GUI process launch smoke check
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/win-x64/BlazeNetMonitor.exe").Path
          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 7
            $app.Refresh()
            if ($app.HasExited) { throw "BlazeNetMonitor exited during launch smoke test (code $($app.ExitCode))" }
            Write-Host "PASS GUI process remained alive for 7 seconds on Windows runner"
          }
          finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Publish GitHub pre-release (not production-certified)
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Preview release tag already exists; refusing to overwrite a published build.' }
          gh release create $env:RELEASE_TAG artifacts/BlazeNetMonitor-v0.2.7-win-x64.zip artifacts/BlazeNetMonitor-v0.2.7-win-x86.zip artifacts/BlazeNetMonitor-v0.2.7-win-arm64.zip artifacts/BlazeNetMonitor-v0.2.7-win-x64-lite.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'BlazeNetMonitor v0.2.7 Preview 1' --prerelease --notes 'BlazeNetMonitor v0.2.7 PREVIEW: the Blaze Systems owner PayPal QR is now permanently embedded with the exact donation destination decoded from the supplied image. All installed copies display the same owner QR; users cannot import a replacement. Polished centered startup donation card (7-second fade and dismiss), optional Every launch/First launch/Never setting, and always-available manual PayPal QR card from About and tray. Updated About includes creator Facebook link and Open PayPal button. Monitoring continues normally. The QR is rendered from an embedded 41x41 ECC-H matrix, not as the original uploaded screenshot pixels. Build and automated tests are validated in GitHub CI; visual device testing and actual payment checkout are not performed. Windows 10 native DeskBand remains unshipped.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub pre-release creation failed' }
