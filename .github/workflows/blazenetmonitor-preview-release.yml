name: BlazeNetMonitor Preview Download
on:
  push:
    branches:
      - feature/blazenetmonitor-v0.1.0
    paths:
      - .github/workflows/blazenetmonitor-preview-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-preview:
    if: github.repository == 'BlazingSystems/BlazingSystems-Experiments' && github.ref == 'refs/heads/feature/blazenetmonitor-v0.1.0'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: expiremental/BlazeNetMonitor
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: blazenetmonitor-v0.2.5-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check core behavior
        run: dotnet run --project tests/BlazeNetMonitor.Tests/BlazeNetMonitor.Tests.csproj -c Release
      - name: Build downloadable x64, x86, and ARM64 packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($rid in @('win-x64', 'win-x86', 'win-arm64')) {
            dotnet publish src/BlazeNetMonitor/BlazeNetMonitor.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "dist/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid" }
            $exe = "dist/$rid/BlazeNetMonitor.exe"
            if (-not (Test-Path $exe)) { throw "Missing $exe" }
            $zip = "artifacts/BlazeNetMonitor-v0.2.5-$rid.zip"
            Compress-Archive -Path $exe -DestinationPath $zip -CompressionLevel Optimal -Force
            if (-not (Test-Path $zip)) { throw "Missing $zip" }
            Get-FileHash $zip -Algorithm SHA256 | Format-List
          }
      - name: Windows x64 GUI process launch smoke check
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/win-x64/BlazeNetMonitor.exe").Path
          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 7
            $app.Refresh()
            if ($app.HasExited) { throw "BlazeNetMonitor exited during launch smoke test (code $($app.ExitCode))" }
            Write-Host "PASS GUI process remained alive for 7 seconds on Windows runner"
          }
          finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Publish GitHub pre-release (not production-certified)
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Preview release tag already exists; refusing to overwrite a published build.' }
          gh release create $env:RELEASE_TAG artifacts/BlazeNetMonitor-v0.2.5-win-x64.zip artifacts/BlazeNetMonitor-v0.2.5-win-x86.zip artifacts/BlazeNetMonitor-v0.2.5-win-arm64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'BlazeNetMonitor v0.2.5 Preview 1' --prerelease --notes 'BlazeNetMonitor v0.2.5 Preview: website favicon support for arbitrary public hostnames including www.facebook.com, not only Cloudflare or Google. Secure HTTPS /favicon.ico lookup follows up to four public HTTPS CDN redirects and falls back to official HTML rel=icon links; no arbitrary private-IP redirects, no third-party icon lookup service. Adds in-widget favicon refresh control and supports tighter compact layouts. Existing independent colored health dots remain visible beside circular logos. CI build/tests and a Windows x64 process smoke check pass before publishing; actual website access and interactive UI behavior remain to be confirmed on the users Windows desktop.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub pre-release creation failed' }
