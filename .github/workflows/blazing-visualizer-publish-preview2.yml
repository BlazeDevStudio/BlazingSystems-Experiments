name: Publish Blazing Visualizer Preview 4

on:
  push:
    branches: [blazing-visualizer]
    paths:
      - '.github/workflows/blazing-visualizer-publish-preview2.yml'
      - 'experiments/Blazing-Visualizer/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: blazing-visualizer-preview-4-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 'blazing-visualizer-v1.0.0-preview.4'
      EXPECTED_CERT: '64f9fbd13d72bb5ef88bccdc4602a487fea21fb73a13298b93a0f2b1f6c2109c'
    steps:
      - name: Require full successful JDK17 / SDK36 / API26 / API36 on this exact source
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for attempt in $(seq 1 105); do
            gh api "repos/$GH_REPO/actions/workflows/blazing-visualizer.yml/runs?branch=blazing-visualizer&per_page=50" > runs.json
            RUN_ID=$(python3 - <<'PY'
          import json, os
          runs=json.load(open('runs.json'))['workflow_runs']
          matching=[r for r in runs if r['head_sha']==os.environ['GITHUB_SHA'] and r['event']=='push']
          print(matching[0]['id'] if matching else '')
          PY
            )
            if [[ -n "$RUN_ID" ]]; then
              gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > validation.json
              status=$(python3 -c 'import json; print(json.load(open("validation.json"))["status"])')
              if [[ "$status" == "completed" ]]; then break; fi
              echo "Source build $RUN_ID still $status ($attempt/105)"
            else
              echo "Matching source validation not started yet ($attempt/105)"
            fi
            sleep 20
          done
          test -n "$RUN_ID"
          python3 - <<'PY'
          import json, os
          run=json.load(open('validation.json'))
          assert run['head_sha']==os.environ['GITHUB_SHA'], 'Wrong source SHA'
          assert run['head_branch']=='blazing-visualizer', 'Wrong branch'
          assert run['status']=='completed' and run['conclusion']=='success', (
              f"Not publishable: {run['status']}, {run['conclusion']}")
          print('Validated source:', run['head_sha'], 'run:', run['id'])
          PY
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          VALIDATION_RUN="$RUN_ID"
          echo "VALIDATION_RUN=$RUN_ID" >> "$GITHUB_ENV"
          echo "VALIDATED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/actions/runs/$VALIDATION_RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json
          jobs=json.load(open('jobs.json'))['jobs']
          names=['build','device (26, default)','device (36, google_apis)']
          for name in names:
              matches=[j for j in jobs if j['name']==name]
              assert len(matches)==1, f'Missing or duplicate {name}'
              assert matches[0]['conclusion']=='success', f'{name} failed'
          print('Source build, API26 and API36 device jobs passed')
          PY

      - uses: actions/download-artifact@v4
        with:
          name: Blazing-Visualizer-preview-APK
          run-id: ${{ steps.validation.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Verify APK content, version and retained debug-only signer
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          test -f candidate/app-debug.apk
          mkdir -p dist
          cp candidate/app-debug.apk dist/Blazing-Visualizer-preview-4.apk
          python3 - <<'PY'
          import pathlib, zipfile
          p=pathlib.Path('dist/Blazing-Visualizer-preview-4.apk')
          assert p.stat().st_size >= 20_000_000, 'unexpected APK size'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, 'invalid archive'
              names=set(z.namelist())
              assert {'classes.dex','AndroidManifest.xml'} <= names
              assert any(x.startswith('lib/arm64-v8a/') for x in names)
              assert any(x.startswith('lib/x86_64/') for x in names)
          print('APK byte structure and ABIs verified')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs             dist/Blazing-Visualizer-preview-4.apk | tee signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging             dist/Blazing-Visualizer-preview-4.apk > badging.txt
          python3 - <<'PY'
          import os,re
          certs=open('signature.txt').read()
          match=re.search(r'certificate SHA-256 digest:\s*([0-9a-fA-F:]+)',certs)
          assert match, 'no signing-certificate SHA256'
          assert match.group(1).replace(':','').lower()==os.environ['EXPECTED_CERT'], 'unexpected signing certificate'
          package=open('badging.txt').read()
          assert "name='com.blazingsystems.visualizer'" in package, 'wrong app package'
          assert "versionCode='4'" in package, 'wrong version code'
          assert "versionName='1.0.0-preview.4'" in package, 'wrong preview version'
          print('APK signing identity, app ID, version verified')
          PY
          (cd dist && sha256sum Blazing-Visualizer-preview-4.apk > SHA256SUMS.txt)

      - name: Publish separately versioned direct-download preview 4
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Preview 4 release tag already exists. Refusing overwrite."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Blazing Visualizer 1.0.0-preview.4 — owner-requested Android preview update.

          Select multiple audio and video files together. Video plays at the deepest visualizer layer using the existing Media3 session, follows pause/seek/Practice speed, and is included in MP4 export at source time. Silent videos have silent audio and no invented notes. Video aspect is contained without stretching.

          A bounded FFT/YIN quick preview now shows temporary note estimates while the full Basic Pitch analysis and cache finish independently. Quick estimates do not replace saved corrections, MIDI or export analysis. Full-file hashing/decoding and precise analysis still take time on uncached files.

          Existing native presets, Avee subset import, queue/repeat/shuffle, microphone mode, editing and export layouts remain included. Avee compatibility remains partial; arbitrary shaders, all modern presets and exact effects are not reproduced. Actual instrument stem separation is researched but not included; video-to-graph tracing is deferred.

          Android 8.0+, arm64-v8a and x86_64. Offline core, no account. Live estimates can confuse overlapping harmonics and dense/noisy music. Physical-phone note accuracy, thermal performance and latency remain unverified. Video export backgrounds support source frames up to 4096px/8.8MP and decode a bounded output frame; long-GOP seeking can be slow. This is a development preview.

          INSTALLATION: Preview 4 can update Preview 2 or Preview 3 in place using the retained public debug-only signing identity. Preview 1 used a different key: export wanted presets, uninstall Preview 1, then install this APK. This public preview signer must never be used for production.

          This exact APK was built from the validated GitHub source commit linked by this release and verified using JDK17 / SDK36 host/lint/assemble + Android API26/API36. Its SHA256SUMS.txt is included.
          NOTES
          gh release create "$RELEASE_TAG"             dist/Blazing-Visualizer-preview-4.apk dist/SHA256SUMS.txt             --target "$VALIDATED_SHA"             --title 'Blazing Visualizer 1.0.0-preview.4'             --prerelease --notes-file release-notes.md

      - name: Verify published release and exact downloadable APK bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified
          gh release download "$RELEASE_TAG" --dir verified             --pattern 'Blazing-Visualizer-preview-4.apk' --pattern SHA256SUMS.txt
          cmp dist/Blazing-Visualizer-preview-4.apk verified/Blazing-Visualizer-preview-4.apk
          cmp dist/SHA256SUMS.txt verified/SHA256SUMS.txt
          echo "Verified direct APK download: https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/Blazing-Visualizer-preview-4.apk"
          cat dist/SHA256SUMS.txt
