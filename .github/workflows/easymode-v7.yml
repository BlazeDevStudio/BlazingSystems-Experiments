name: EasyMode v7 validation
on:
  push:
    branches: [easymode-v7-production]
    paths:
      - 'experiment/openwrt/easymode-project/**'
      - '.github/workflows/easymode-v7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiment/openwrt/easymode-project
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ucode test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libjson-c-dev ninja-build
          git clone https://github.com/jow-/ucode.git /tmp/ucode
          git -C /tmp/ucode checkout 82e19a501eb5a66ba747969c31ac86b6adf78fd7
          cmake -S /tmp/ucode -B /tmp/ucode/build -G Ninja
          cmake --build /tmp/ucode/build
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig
      - name: Execute release checks
        run: |
          sh traffic/tests/run.sh
      - name: Build real edition packages
        run: python3 traffic/tools/build.py
      - name: Build current R281 application updater
        run: python3 tools/build-r281-app.py
      - name: Prepare image and virtual integration tools
        run: |
          sudo apt-get install -y build-essential zstd libncurses-dev rsync unzip wget qemu-system-x86 ovmf python3-paramiko python3-pexpect
          npm install --prefix /tmp/emti-browser playwright@1.56.1
          /tmp/emti-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build verified-profile x86 BIOS and UEFI images
        run: sh traffic/tools/image.sh
      - name: Boot and integration tests on disposable image copy
        run: |
          python3 traffic/tests/vm.py
          python3 traffic/tests/vm.py --uefi
      - name: Final manifests and checksums
        run: python3 traffic/tools/build.py
      - name: Store successful build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyMode-v7-validated-build
          path: |
            experiment/openwrt/easymode-project/dist-v7/
            experiment/openwrt/easymode-project/releases/v10.2.0-r281-candidate/openwrt/EasyMode-v10.2.0-R281-app-update-candidate.tar.gz
            experiment/openwrt/easymode-project/releases/v10.2.0-r281-candidate/openwrt/EasyMode-v10.2.0-R281-app-update-candidate.tar.gz.sha256
          retention-days: 14
