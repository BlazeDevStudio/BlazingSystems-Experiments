name: Blaze Gen2 Windows concurrency regression

on:
  pull_request:
    paths:
      - 'expiremental/Blaze-Gen2-Portable-Studio/**'
      - '.github/workflows/blaze-gen2-concurrency-ci.yml'

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: expiremental/Blaze-Gen2-Portable-Studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish launcher, Studio, and synthetic fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/PortableLauncher/PortableLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/launcher
          if ($LASTEXITCODE -ne 0) { throw 'PortableLauncher publish failed' }
          dotnet publish src/Studio/Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/studio
          if ($LASTEXITCODE -ne 0) { throw 'Studio publish failed' }
          dotnet publish tests/SyntheticApp/SyntheticApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/sample
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic app publish failed' }
      - name: Run concurrent station integration tests
        run: |
          dotnet run --project tests/Integration/Integration.csproj -c Release -- 'out/sample/SyntheticApp.exe' 'out/launcher/BlazePortableLauncher.exe' 'out/studio/Create.exe'
          if ($LASTEXITCODE -ne 0) { throw "Integration tests failed with exit code $LASTEXITCODE" }
