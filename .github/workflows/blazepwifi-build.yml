  android:
    needs: ci_decision
    if: needs.ci_decision.outputs.run_heavy == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Android SDK 27 and isolate legacy SDK root
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-27" "build-tools;27.0.3" "build-tools;36.0.0"
          rm -rf /tmp/android-sdk-27
          mkdir -p /tmp/android-sdk-27/platforms /tmp/android-sdk-27/build-tools
          cp -a "${ANDROID_SDK_ROOT}/platforms/android-27" /tmp/android-sdk-27/platforms/
          cp -a "${ANDROID_SDK_ROOT}/build-tools/27.0.3" /tmp/android-sdk-27/build-tools/
          printf 'sdk.dir=/tmp/android-sdk-27\n' > experiment/openwrt/BlazePwifi/android/BlazeRentalLauncher/local.properties
      - name: Set up JDK 8 for Launcher3
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-4.4.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-4.4.1/bin >> "$GITHUB_PATH"
      - name: Build current BlazeRental APK and frozen v0.5.2 rollback rescue
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/experiment/openwrt/BlazePwifi"
          VERSION="$(cat "$ROOT/VERSION")"
          CUR="$ROOT/android/BlazeRentalLauncher"
          DIST="$ROOT/dist/android"
          mkdir -p "$DIST"

          (
            cd "$CUR"
            ANDROID_HOME=/tmp/android-sdk-27 ANDROID_SDK_ROOT=/tmp/android-sdk-27 \
              gradle --no-daemon --stacktrace testAospDebugUnitTest assembleAospDebug assembleAospRelease assembleAospDebugAndroidTest
          )
          DEBUG_APK="$(find "$CUR/build/outputs/apk/aosp/debug" -type f -name '*.apk' | head -n1)"
          RELEASE_APK="$(find "$CUR/build/outputs/apk/aosp/release" -type f -name '*.apk' | head -n1)"
          test -n "$DEBUG_APK" -a -s "$DEBUG_APK"
          test -n "$RELEASE_APK" -a -s "$RELEASE_APK"
          cp "$DEBUG_APK" "$DIST/BlazeRental-$VERSION-ci.apk"
          cp "$RELEASE_APK" "$DIST/BlazeRental-$VERSION-release-unsigned.apk"
          cp "$CUR/BLAZE_UPSTREAM.md" "$DIST/Launcher3-UPSTREAM.txt"

          # Rollback rescue uses the exact frozen v0.5.2 production application
          # candidate. Only Android version metadata is raised so Android can
          # accept it as a forward install while behavior returns to v0.5.2.
          RESCUE_ROOT=/tmp/blazerental-v052-rescue
          rm -rf "$RESCUE_ROOT"
          git worktree add --detach "$RESCUE_ROOT" bf2992977fe8504d21b107df02826032c31d3a62
          RESCUE="$RESCUE_ROOT/experiment/openwrt/BlazePwifi/android/BlazeRentalLauncher"
          if [ "$VERSION" = "0.5.3" ]; then
            RESCUE_VERSION_CODE=50301
          else
            RESCUE_VERSION_CODE=50299
          fi
          sed -i "s/versionCode 50200/versionCode $RESCUE_VERSION_CODE/" "$RESCUE/build.gradle"
          sed -i "s/versionName \"0.5.2\"/versionName \"0.5.2-rescue-for-$VERSION\"/" "$RESCUE/build.gradle"
          printf 'sdk.dir=/tmp/android-sdk-27\n' > "$RESCUE/local.properties"
          (
            cd "$RESCUE"
            ANDROID_HOME=/tmp/android-sdk-27 ANDROID_SDK_ROOT=/tmp/android-sdk-27 \
              gradle --no-daemon --stacktrace assembleAospDebug assembleAospRelease
          )
          RESCUE_DEBUG="$(find "$RESCUE/build/outputs/apk/aosp/debug" -type f -name '*.apk' | head -n1)"
          RESCUE_RELEASE="$(find "$RESCUE/build/outputs/apk/aosp/release" -type f -name '*.apk' | head -n1)"
          test -n "$RESCUE_DEBUG" -a -s "$RESCUE_DEBUG"
          test -n "$RESCUE_RELEASE" -a -s "$RESCUE_RELEASE"
          cp "$RESCUE_DEBUG" "$DIST/BlazeRental-v0.5.2-rescue-for-$VERSION-TEST.apk"
          cp "$RESCUE_RELEASE" "$DIST/BlazeRental-v0.5.2-rescue-for-$VERSION-release-unsigned.apk"
          git worktree remove --force "$RESCUE_ROOT"

          (
            cd "$DIST"
            sha256sum \
              "BlazeRental-$VERSION-ci.apk" \
              "BlazeRental-$VERSION-release-unsigned.apk" \
              "BlazeRental-v0.5.2-rescue-for-$VERSION-TEST.apk" \
              "BlazeRental-v0.5.2-rescue-for-$VERSION-release-unsigned.apk" > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-android-current
          path: experiment/openwrt/BlazePwifi/dist/android/

