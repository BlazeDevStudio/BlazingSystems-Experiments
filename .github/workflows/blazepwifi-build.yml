  production_sign_handoff:
    if: github.ref == 'refs/heads/blazepwifi-v0.3.0-production' && contains(github.event.head_commit.message, '[sign]')
    needs: [validate, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BlazePwifi-android-BlazeRental
          path: android-artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0"
      - name: Create private signing identity and sign release APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/blazerental-sign"
          SECRET="$RUNNER_TEMP/blazerental-secret"
          mkdir -p "$OUT" "$SECRET"
          PASS="$(openssl rand -base64 36 | tr -d '\n')"
          keytool -genkeypair -noprompt \
            -keystore "$OUT/BlazeRental-production.p12" -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" -alias blazerental \
            -keyalg RSA -keysize 3072 -validity 36500 \
            -dname "CN=BlazeRental,O=BlazingSystems,C=PH"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$ZIPALIGN" -p -f 4 android-artifact/BlazeRental-release-unsigned.apk "$OUT/BlazeRental-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$OUT/BlazeRental-production.p12" \
            --ks-key-alias blazerental \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT/BlazeRental.apk" "$OUT/BlazeRental-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OUT/BlazeRental.apk" > "$OUT/BlazeRental-apksigner-verify.txt"
          keytool -exportcert -rfc -alias blazerental -keystore "$OUT/BlazeRental-production.p12" \
            -storepass "$PASS" -file "$OUT/BlazeRental-signing-cert.pem"
          keytool -list -v -alias blazerental -keystore "$OUT/BlazeRental-production.p12" \
            -storepass "$PASS" | sed -n '/SHA256:/p' > "$OUT/BlazeRental-signing-fingerprint.txt"
          cp "$OUT/BlazeRental-production.p12" "$SECRET/"
          printf '%s\n' "$PASS" > "$SECRET/keystore-password.txt"
          printf '%s\n' \
            'BlazeRental production signing key backup.' \
            'Keep this archive private and offline. Future APK updates must use this exact signing identity.' \
            > "$SECRET/README.txt"
          tar -czf "$RUNNER_TEMP/BlazeRental-signing-backup.tar.gz" -C "$SECRET" .
          openssl rand 32 > "$RUNNER_TEMP/aes.key"
          openssl rand 16 > "$RUNNER_TEMP/aes.iv"
          KEYHEX="$(xxd -p -c 256 "$RUNNER_TEMP/aes.key")"
          IVHEX="$(xxd -p -c 256 "$RUNNER_TEMP/aes.iv")"
          openssl enc -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" \
            -in "$RUNNER_TEMP/BlazeRental-signing-backup.tar.gz" \
            -out "$OUT/BlazeRental-signing-backup.enc"
          openssl pkeyutl -encrypt -pubin -inkey .github/blazerental-transfer-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/aes.key" -out "$OUT/BlazeRental-signing-aes-key.enc"
          cp "$RUNNER_TEMP/aes.iv" "$OUT/BlazeRental-signing-aes-iv.bin"
          sha256sum "$OUT/BlazeRental.apk" "$OUT/BlazeRental-signing-cert.pem" > "$OUT/SHA256SUMS"
          rm -f "$OUT/BlazeRental-production.p12" "$OUT/BlazeRental-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BlazeRental-production-signing-handoff
          path: ${{ runner.temp }}/blazerental-sign/
          retention-days: 1
          if-no-files-found: error


  production_import_signed_apk:
    if: github.ref == 'refs/heads/blazepwifi-v0.3.0-production' && contains(github.event.head_commit.message, '[import-sign]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SIGN_RUN: '37210720716'
      APK_SHA256: '2062c0ad1245b1a5dbfec8fea1cfef4286906f943ba54c6a7005ca7ca872bac0'
      CERT_SHA256: '49b2f1ad1c8214b35935fa266f6afdd5db12f9739dee0eef0b31c69848dcd09e'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blazepwifi-v0.3.0-production
      - name: Download verified production signing handoff
        run: |
          set -euo pipefail
          mkdir -p signed
          gh run download "$SIGN_RUN" -n BlazeRental-production-signing-handoff -D signed
          echo "$APK_SHA256  signed/BlazeRental.apk" | sha256sum -c -
          echo "$CERT_SHA256  signed/BlazeRental-signing-cert.pem" | sha256sum -c -
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signed/BlazeRental-apksigner-verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' signed/BlazeRental-apksigner-verify.txt
      - name: Commit public production APK and certificate metadata
        run: |
          set -euo pipefail
          DEST=experiment/openwrt/BlazePwifi/releases/0.3.0
          cp signed/BlazeRental.apk "$DEST/BlazeRental.apk"
          cp signed/BlazeRental-signing-cert.pem "$DEST/BlazeRental-signing-cert.pem"
          cp signed/BlazeRental-signing-fingerprint.txt "$DEST/BlazeRental-signing-fingerprint.txt"
          cp signed/BlazeRental-apksigner-verify.txt "$DEST/BlazeRental-apksigner-verify.txt"
          printf '%s  %s\n' "$APK_SHA256" BlazeRental.apk > "$DEST/BlazeRental.apk.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "release(blazepwifi): add signed BlazeRental.apk [skip ci]"
          git push origin HEAD:blazepwifi-v0.3.0-production

  publish_prerelease:
    if: github.ref == 'refs/heads/blazepwifi-v0.3.0-design' && contains(github.event.head_commit.message, '[release]')
    needs: [validate, esp8266, esp32, android, firmware, firmware_optional]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.3.0-rc.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BlazePwifi-*
          path: downloaded
      - name: Assemble permanent release assets
        run: |
          set -eu
          mkdir -p release-out
          find downloaded -mindepth 1 -maxdepth 1 -type d | while read d; do
            n=$(basename "$d")
            if [ "$n" != "BlazePwifi-android-BlazeRental" ]; then
              (cd "$d" && zip -qr "../../release-out/${n}.zip" .)
            fi
            find "$d" -type f | while read f; do
              b=$(basename "$f")
              case "$b" in
                *.apk|*.bin|*.img.gz|*.ino|*.tar.gz|*.json|*.png)
                  if [ ! -e "release-out/$b" ]; then cp "$f" "release-out/$b"; fi
                  ;;
              esac
            done
          done
          tar -czf release-out/BlazePwifi-portal-templates.tar.gz -C experiment/openwrt/BlazePwifi portal-templates
          cp experiment/openwrt/BlazePwifi/releases/0.3.0-rc.1/RELEASE_NOTES.md release-out/RELEASE_NOTES.md
          (
            cd release-out
            sha256sum * | grep -v ' SHA256SUMS$' > SHA256SUMS
            python3 -c 'import hashlib,json,pathlib; r=pathlib.Path("."); a=[{"name":p.name,"size":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(r.iterdir()) if p.is_file() and p.name!="manifest.json"]; pathlib.Path("manifest.json").write_text(json.dumps({"version":"0.3.0-rc.1","assets":a},indent=2)+"\\n")'
          )
      - name: Create or update GitHub prerelease
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "BlazePwifi 0.3.0-rc.1" --notes-file experiment/openwrt/BlazePwifi/releases/0.3.0-rc.1/RELEASE_NOTES.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "BlazePwifi 0.3.0-rc.1" --notes-file experiment/openwrt/BlazePwifi/releases/0.3.0-rc.1/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" release-out/* --clobber


