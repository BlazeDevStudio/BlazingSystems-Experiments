          [ ! -f experiment/openwrt/BlazePwifi/releases/0.3.0/BlazeRental-signing-fingerprint.txt ] || cp experiment/openwrt/BlazePwifi/releases/0.3.0/BlazeRental-signing-fingerprint.txt release-out/
          python3 experiment/openwrt/BlazePwifi/tools/build-rental-qr-tool.py \
