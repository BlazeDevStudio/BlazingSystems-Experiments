  v04_android_emulator:
    needs: [validate, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BlazePwifi-android-current
          path: candidate/android
      - name: Select exact built APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find candidate/android -type f -name 'BlazeRental-*-ci.apk' -print -quit)"
          test -n "$APK" -a -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          mkdir -p simulation-out/android
          sha256sum "$APK" > simulation-out/android/AUDITED_APK_SHA256
      - name: Enable Android emulator KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm -a -w /dev/kvm
          fi
      - uses: reactivecircus/android-emulator-runner@v2
