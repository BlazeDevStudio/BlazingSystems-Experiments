          python3 experiment/openwrt/BlazePwifi/tools/make-provisioning.py \
            --apk release-out/BlazeRental.apk \
            --apk-url "https://github.com/BlazingSystems/BlazingSystems-Experiments/releases/download/v0.3.0/BlazeRental.apk" \
            --server-url "http://192.168.1.1:8080" \
            --enrollment-token "000000000000.000000000000000000000000000000000000" \
            --device-name "SAMPLE - generate a real token in admin" \
            --out release-out/BlazeRental-provisioning-SAMPLE.json
          python3 experiment/openwrt/BlazePwifi/tools/render-qr.py \
            --json release-out/BlazeRental-provisioning-SAMPLE.json \
            --out release-out/BlazeRental-provisioning-SAMPLE.png
