              BlazeRental.apk BlazeRental-QR-Setup.html \
              BlazeRental-provisioning-SAMPLE.json BlazeRental-provisioning-SAMPLE.png \
              BlazeRental-signing-cert.pem BlazeRental-signing-fingerprint.txt
          )
          tar -czf release-out/BlazePwifi-portal-templates.tar.gz -C experiment/openwrt/BlazePwifi portal-templates
          (
            cd release-out
            sha256sum * | grep -v ' SHA256SUMS$' > SHA256SUMS
            python3 -c 'import hashlib,json,pathlib; r=pathlib.Path("."); a=[{"name":p.name,"size":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(r.iterdir()) if p.is_file() and p.name!="manifest.json"]; pathlib.Path("manifest.json").write_text(json.dumps({"version":"0.3.0","type":"production","assets":a},indent=2)+"\\n")'
          )
      - name: Create or update GitHub production release
        run: |
          set -eu
          NOTES=experiment/openwrt/BlazePwifi/releases/0.3.0/RELEASE_NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest --title "BlazePwifi 0.3.0" --notes-file "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --latest --title "BlazePwifi 0.3.0" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" release-out/* --clobber


  # Executable lab-only release, never a production v0.6.0.
  publish_v060_lab_preview:
    if: github.ref == 'refs/heads/blazepwifi-v0.6.0-audit-foundation' && contains(github.event.head_commit.message, '[v060-lab-release]')
    needs: [v04_candidate_gate, firmware_optional]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      LAB_TAG: v0.6.0-alpha.4
      NOTES: experiment/openwrt/BlazePwifi/releases/0.6.0-alpha.4/RELEASE_NOTES.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify full candidate and same-SHA Windows completed successfully
        shell: bash
        run: |
          set -euo pipefail
          test -f "$NOTES"
          test "$(cat experiment/openwrt/BlazePwifi/VERSION)" = "0.5.3" || { echo "Preview notes/source version mismatch"; exit 1; }
          test "$GITHUB_REF_NAME" = "blazepwifi-v0.6.0-audit-foundation"
          if gh release view "$LAB_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing lab release"; exit 1
          fi
          gh run download "$GITHUB_RUN_ID" -n BlazePwifi-current-candidate-gate -D gate
          python3 - <<'PY'
          import json,os
          x=json.load(open("gate/CANDIDATE-GATE.json",encoding="utf-8"))
          assert x.get("status")=="passed" and x.get("commit")==os.environ["GITHUB_SHA"], "Wrong SHA/failed full gate"
          assert x.get("release")=="0.5.3", "Unexpected artifact source revision"
          PY
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/blazepisonet-softtimer-release.yml/runs?branch=$GITHUB_REF_NAME&per_page=50" --jq '.workflow_runs[] | [.id,.head_sha,.conclusion] | @tsv')"
          WINDOWS_RUN="$(printf '%s\n' "$RUNS" | awk -F '\t' -v sha="$GITHUB_SHA" '$2==sha && $3=="success" {print $1; exit}')"
          [ -n "$WINDOWS_RUN" ] || { echo "Same-SHA Windows installer not green; NO release"; exit 1; }
          echo "WINDOWS_RUN=$WINDOWS_RUN" >> "$GITHUB_ENV"
      - name: Download exact CI-built lab artifacts from this run and Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage lab-release
          for a in BlazePwifi-bundle BlazePwifi-android-current BlazePwifi-esp8266-firmware BlazePwifi-esp32-firmware BlazePwifi-ruijie-firmware BlazePwifi-x86_64-firmware BlazePwifi-orangepi_zero3-firmware BlazePwifi-current-update; do
            mkdir -p "stage/$a"
            gh run download "$GITHUB_RUN_ID" -n "$a" -D "stage/$a"
            find "stage/$a" -type f -size +0c | grep -q . || { echo "Empty/missing artifact $a"; exit 1; }
            (cd stage && zip -qr "../lab-release/$a-LAB-ONLY.zip" "$a")
          done
          win="BlazePisonet-SoftTimer-v0.4.0-win-x64"
          mkdir -p "stage/$win"
          gh run download "$WINDOWS_RUN" -n "$win" -D "stage/$win"
          find "stage/$win" -type f -size +0c | grep -q . || { echo "Windows artifact missing"; exit 1; }
          (cd stage && zip -qr "../lab-release/$win-LAB-ONLY.zip" "$win")
          cp "$NOTES" lab-release/RELEASE_NOTES.md
          (cd lab-release && sha256sum *-LAB-ONLY.zip > SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("lab-release")
          assets=[dict(name=p.name,bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.glob("*-LAB-ONLY.zip"))]
          assert len(assets)==9 and all(a["bytes"]>0 for a in assets),"Incomplete lab assets"
          (root/"MANIFEST.json").write_text(json.dumps(dict(
              tag=os.environ["LAB_TAG"],purpose="DISPOSABLE-LAB-ONLY-NOT-PRODUCTION",
              commit=os.environ["GITHUB_SHA"],build_run_id=os.environ["GITHUB_RUN_ID"],
              windows_run_id=os.environ["WINDOWS_RUN"],source_version="0.5.3",
              production_signed=False,hardware_powercut_verified=False,
              migration_verified=False,customer_install_authorized=False,
              assets=assets),indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload and verify draft lab artifacts before publication
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WINDOWS_RUN"
          test -s lab-release/MANIFEST.json && test -s lab-release/SHA256SUMS
          # A partial asset upload must remain unpublished as a draft, never
          # appear as a successful lab release with missing checksum evidence.
          gh release create "$LAB_TAG" lab-release/* \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "BlazePwifi v0.6.0-alpha.4 — LAB ONLY, NOT PRODUCTION" \
            --notes-file "$NOTES"
          # GitHub draft releases intentionally have an untagged public URL;
          # /releases/tags/TAG can return HTTP 404 while the draft exists.
          # Resolve the private draft through authenticated releases listing.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > created-releases.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          releases=json.load(open("created-releases.json",encoding="utf-8"))
          matches=[r for r in releases if r.get("tag_name")==os.environ["LAB_TAG"]]
          assert len(matches)==1,"Expected exactly one new private lab release"
          release=matches[0]
          assert isinstance(release.get("id"),int),"Missing new release ID"
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write(f'LAB_DRAFT_RELEASE_ID={release["id"]}\n')
          manifest=json.load(open("lab-release/MANIFEST.json",encoding="utf-8"))
          assert release["draft"] is True and release["prerelease"] is True,"Expected draft prerelease"
          assert release["tag_name"]==os.environ["LAB_TAG"],"Wrong release tag"
          assert release["target_commitish"]==os.environ["GITHUB_SHA"],"Release source SHA mismatch"
          assert manifest["tag"]==os.environ["LAB_TAG"] and manifest["commit"]==os.environ["GITHUB_SHA"]
          assert not manifest["customer_install_authorized"] and not manifest["production_signed"]
          remote={a["name"]:a for a in release["assets"]}
          local={p.name:p for p in pathlib.Path("lab-release").iterdir() if p.is_file()}
          assert len(local)==12 and set(remote)==set(local),"Missing or additional uploaded assets"
          for name,p in local.items():
              a=remote[name]
              assert a["state"]=="uploaded" and a["size"]==p.stat().st_size and a["size"]>0,name
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              digest=a.get("digest")
              assert isinstance(digest,str) and digest=="sha256:"+actual,"Missing or mismatched upload SHA-256 for "+name
          print("LAB DRAFT REMOTE VERIFIED: 12 full-size assets, exact source, sha256 where exposed.")
          PY
      - name: Publish verified lab-only prerelease and verify visibility
        shell: bash
        run: |
          set -euo pipefail
          # PATCH by numeric draft ID; publish only after asset/digest checks.
          test -n "${LAB_DRAFT_RELEASE_ID:-}"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$LAB_DRAFT_RELEASE_ID" -F draft=false -F prerelease=true > publish-by-id.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$LAB_TAG" > published-final.json
          python3 - <<'PY'
          import json,os
          r=json.load(open("published-final.json",encoding="utf-8"))
          assert r["id"]==int(os.environ["LAB_DRAFT_RELEASE_ID"])
          assert r["tag_name"]==os.environ["LAB_TAG"] and r["target_commitish"]==os.environ["GITHUB_SHA"]
          assert r["draft"] is False and r["prerelease"] is True
          assert len(r["assets"])==12 and all(a["state"]=="uploaded" for a in r["assets"])
          print("VERIFIED ACTUAL LAB PRERELEASE",r["html_url"],len(r["assets"]),"assets")
          PY
          gh release view "$LAB_TAG" --json tagName,isPrerelease,assets \
            --jq '{tag:.tagName,prerelease:.isPrerelease,asset_count:(.assets|length)}'
