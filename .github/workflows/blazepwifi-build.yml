name: BlazePwifi build
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiment/openwrt/BlazePwifi/**'
      # Docs-only commits must not rebuild OpenWrt, Windows or Android.
      # Source + docs still matches the positive rule; only doc files excluded.
      - '!experiment/openwrt/BlazePwifi/docs/**'
      - '!experiment/openwrt/BlazePwifi/PROJECT_HANDOVER.md'
      - '!experiment/openwrt/BlazePwifi/AUDIT.md'
      - '!experiment/openwrt/BlazePwifi/README.md'
      - '.github/workflows/blazepwifi-build.yml'
      - '.github/workflows/blazepwifi-v053-release.yml'
      - '.github/workflows/blazerental-v053-lineage2-sign.yml'
  pull_request:
    paths:
      - 'experiment/openwrt/BlazePwifi/**'
      # Docs-only commits must not rebuild OpenWrt, Windows or Android.
      # Source + docs still matches the positive rule; only doc files excluded.
      - '!experiment/openwrt/BlazePwifi/docs/**'
      - '!experiment/openwrt/BlazePwifi/PROJECT_HANDOVER.md'
      - '!experiment/openwrt/BlazePwifi/AUDIT.md'
      - '!experiment/openwrt/BlazePwifi/README.md'
      - '.github/workflows/blazepwifi-build.yml'
      - '.github/workflows/blazepwifi-v053-release.yml'
      - '.github/workflows/blazerental-v053-lineage2-sign.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci_decision:
    name: CI-0701 docs-only PR sync proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_heavy: ${{ steps.filter.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: CI-0701 negative classifier contract (no API, no hardware)
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_ci_docs_classifier.py
      - name: Verify previous exact Full success before suppressing expensive jobs
        id: filter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 experiment/openwrt/BlazePwifi/tools/v060_ci_docs_classifier.py

  validate:
    needs: ci_decision
    if: needs.ci_decision.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mandatory handover freshness gate
        run: sh experiment/openwrt/BlazePwifi/tests/handover_gate.sh
      - name: Handover gate fail-closed regression
        run: sh experiment/openwrt/BlazePwifi/tests/handover_gate_regression.sh
      - name: HND-0700 guard source-vs-docs GitHub Actions path selection
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_ci_doc_only_filter.py
      - name: CI-0701 guard never bypasses Full for unverified source
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_ci_docs_classifier.py
      - name: Static validation
        run: sh experiment/openwrt/BlazePwifi/tests/static.sh
      - name: v0.3 foundation validation
        run: sh experiment/openwrt/BlazePwifi/tests/v03_foundation.sh
      - name: Admin security validation
        run: sh experiment/openwrt/BlazePwifi/tests/security.sh
      - name: Config API validation
        run: sh experiment/openwrt/BlazePwifi/tests/config.sh
      - name: Template gallery validation
        run: sh experiment/openwrt/BlazePwifi/tests/template_gallery.sh
      - name: Controller protocol parity
        run: sh experiment/openwrt/BlazePwifi/tests/controllers.sh
      - name: Verify Vendo firmware source bundles include their build dependencies
        run: python3 experiment/openwrt/BlazePwifi/tests/test_vendo_source_bundle.py
      - name: Verify durable Vendo sequence contract and packaged compile paths
        run: sh experiment/openwrt/BlazePwifi/tests/v060_vendo_pending_sequence.sh
      - name: BlazePwifi v0.4 controller compatibility
        run: sh experiment/openwrt/BlazePwifi/tests/v04_controller_compat.sh
      - name: Linux GPIO agent validation
        run: sh experiment/openwrt/BlazePwifi/tests/linux_agent.sh
      - name: BlazeRental source validation
        run: sh experiment/openwrt/BlazePwifi/tests/android.sh
      - name: BlazeRental v0.4 compatibility source validation
        run: sh experiment/openwrt/BlazePwifi/tests/v04_android_source.sh
      - name: BlazeRental v0.5 launcher source validation
        run: sh experiment/openwrt/BlazePwifi/tests/v05_android_source.sh
      - name: BlazeRental PC QR tool validation
        run: sh experiment/openwrt/BlazePwifi/tests/qr_setup.sh
      - name: BlazeRental server validation
        run: sh experiment/openwrt/BlazePwifi/tests/rental.sh
      - name: BlazeRental v0.4 policy validation
        run: sh experiment/openwrt/BlazePwifi/tests/v04_rental_policy.sh
      - name: BlazeRental v0.4 device API validation
        run: sh experiment/openwrt/BlazePwifi/tests/v04_rental_api.sh
      - name: BlazeRental v0.4 admin API validation
        run: sh experiment/openwrt/BlazePwifi/tests/v04_rental_admin.sh
      - name: BlazePwifi v0.4 admin UI validation
        run: sh experiment/openwrt/BlazePwifi/tests/v04_admin_ui.sh
      - name: BlazePwifi v0.5 console and portal validation
        run: sh experiment/openwrt/BlazePwifi/tests/v05_console.sh
      - name: BlazePwifi v0.5.1 transactional update compatibility validation
        run: sh experiment/openwrt/BlazePwifi/tests/v051_update.sh
      - name: BlazePwifi v0.5.2 transactional update validation
        run: sh experiment/openwrt/BlazePwifi/tests/v052_update.sh
      - name: Verify update bundle and installed runtime version identity
        run: python3 experiment/openwrt/BlazePwifi/tests/test_update_version_identity.py
      - name: BlazePwifi v0.6 migration preflight and 0.5 rollback safety
        run: sh experiment/openwrt/BlazePwifi/tests/v060_migration_guard.sh
      - name: Verify safe tar extraction and manifest target policy
        run: sh experiment/openwrt/BlazePwifi/tests/v060_update_archive_security.sh
      - name: BlazePwifi v0.6 synthetic state backup/restore integrity prototype
        run: sh experiment/openwrt/BlazePwifi/tests/v060_state_fixture.sh
      - name: Verify ordinary coin ACK refusal and persistent paid quarantine
        run: sh experiment/openwrt/BlazePwifi/tests/v060_coin_false_ack.sh
      - name: PAY-0731 guard both signed ordinary coin duplicate receipt ACK shortcuts
        run: sh experiment/openwrt/BlazePwifi/tests/v060_vendo_coin_replay_lock.sh
      - name: PAY-0732/0733 signed coin original pulses, device ownership and corrupt-account fail-closed
        run: sh experiment/openwrt/BlazePwifi/tests/v060_vendo_coin_pulse_replay.sh
      - name: PAY-0737 refuse signed member balance snapshot during financial uncertainty
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_signed_read_guard.sh
      - name: Retain paid coin replay IDs throughout the full live target window
        run: sh experiment/openwrt/BlazePwifi/tests/v060_coin_replay_window.sh
      - name: Reject member paid replay ACK during global uncertainty quarantine
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_quarantine_replay.sh
      - name: BlazePwifi v0.6 legacy prepaid receipt replay retention
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_replay_repro.sh
      - name: BlazePwifi v0.6 receipt store full rejects payment
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_receipt_quota.sh
      - name: PAY-0720 real Vendo public ACK signer unavailable and Ruijie target crypto gap
        run: sh experiment/openwrt/BlazePwifi/tests/v060_v2_public_ack_runtime_boundary.sh
      - name: PAY-0721 host EVP P256 ephemeral sign/public verify and unshipped signer boundary
        run: sh experiment/openwrt/BlazePwifi/tests/v060_p256_target_capability_probe.sh
      - name: PAY-0722 target runtime operator-only preflight refuses production signing claims
        run: sh experiment/openwrt/BlazePwifi/tests/v060_p256_physical_runtime_probe_policy.sh
      - name: PAY-0713 synthetic member atomic authority bridge (not production)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_v2_atomic_bridge.sh
      - name: PAY-0729 refuse corrupted paid member revisions and failed revision allocation
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_revision_integrity.sh
      - name: PAY-0730 block v1 financial writes and paid replay during v2 cutover
        run: sh experiment/openwrt/BlazePwifi/tests/v060_paid_v2_cutover_interlock.sh
      - name: BlazePwifi v0.6 member receipt EIO quarantine
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_receipt_failure_repro.sh
      - name: BlazePwifi v0.6 rental receipt EIO before mutation
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_failure_repro.sh
      - name: PAY-0780 installed v1 rental receipt quota before paid lease mutation
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_paid_receipt_capacity.sh
      - name: RENT-0723 serialize rental paid replay and recheck lease after writer lock
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_paid_lock_race.sh
      - name: RENT-0724 prevent stale admin rental add and unauthorized forfeit across writer lock
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_admin_paid_race.sh
      - name: RENT-0725 synthetic rental lease and coin receipt single-authority bridge (not production)
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_rental_v2_atomic_bridge.py
      - name: RENT-0726 reject signed rental-v2 protocol downgrade before heartbeat or credit
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_v2_no_downgrade.sh
      - name: RENT-0727 synthetic rental controller HMAC journal and independent ACKV2 contract (not production)
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_rental_native_ack_contract.py
      - name: BlazePwifi v0.6 rental receipt EIO after lease rename
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_midwrite.sh
      - name: RENT-20261022-HASH reject unavailable or malformed rental paid receipt digest
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_digest_guard.sh
      - name: RENT-20261022-FLOOR refuse stale paid lease with retained signed receipt
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_replay_floor_guard.sh
      - name: Refuse altered-pulse and cross-device rental coin receipt duplicate ACKs
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_receipt_identity.sh
      - name: PAY-0740 reject unrelated malformed or duplicate v1 member and rental receipt corpus before ACK
        run: sh experiment/openwrt/BlazePwifi/tests/v060_paid_receipt_corpus_integrity.sh
      - name: BlazePwifi v0.6 synthetic crash-atomic member transfer
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_transfer_crash_repro.sh
      - name: P0-0710 reject malformed or overflowing paid balances and rental leases
        run: sh experiment/openwrt/BlazePwifi/tests/v060_paid_numeric_guard.sh
      - name: BlazePwifi v0.6 synthetic transactional ledger oracle (model only)
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_ledger_model.py
      - name: BlazePwifi v0.6 synthetic POSIX receipt and balance journal
        run: sh experiment/openwrt/BlazePwifi/tests/v060_journal_native_fixture.sh
      - name: MIG-0736 verify paid account, member, rental, revision and receipts under readonly global lock
        run: sh experiment/openwrt/BlazePwifi/tests/v060_v2_shadow_readonly.sh
      - name: BlazePwifi v0.6 synthetic HMAC authenticated controller journal
        run: sh experiment/openwrt/BlazePwifi/tests/v060_journal_auth_fixture.sh
      - name: Ensure LAB-only OpenWrt SDK fixture is excluded from production rootfs
        run: sh experiment/openwrt/BlazePwifi/tests/v060_sdk_lab_guard.sh
      - name: BlazePwifi v0.6 native fsync and renameat transaction boundary
        run: sh experiment/openwrt/BlazePwifi/tests/v060_durable_replace_native.sh
      - name: BlazePwifi v0.6 signed native durable journal end-to-end fault tests
        run: sh experiment/openwrt/BlazePwifi/tests/v060_journal_native_auth_endtoend.sh
      - name: BlazePwifi v0.6 physical scratch mount fail-closed preflight (synthetic only)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_lab_storage_preflight.sh
      - name: HWPRE-0683 refuse unsafe physical pretrial sources (negative-only, no hardware)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_physical_pretrial_readonly.sh
      - name: PEVID-0679 verify mocked power-cut evidence never authorizes hardware acceptance
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_physical_evidence_contract.py
      - name: BlazePwifi v0.6 native private HMAC and fsync synthetic journal authority
        run: sh experiment/openwrt/BlazePwifi/tests/v060_native_v2_authority.sh
      - name: WITNESS-0734 strict native P-256 nonce-bound external ledger proof (read-only, no ACK)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_witness_proof_native.sh
      - name: WITNESS-0738 SQLite FULL-sync off-device witness candidate crash/replay (NO PAID ACK)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_offdevice_witness_candidate.sh
      - name: WITNESS-0740 sign INIT PREPARE FINALIZE and STATUS candidate responses (NO PAID ACK)
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_offdevice_witness_reply_auth.py
      - name: ROLLBACK-0691 EXPECTED UNSAFE old-ledger replay repro (NOT production approval)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_v2_snapshot_rollback_repro.sh
      - name: WITNESS-0692 hypothetical off-device trusted freshness protocol model (LAB ONLY)
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_trusted_witness_model.py
      - name: WITNESS-0693 hypothetical two-stage independent witness recovery (LAB ONLY)
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_witness_two_stage_recovery.py
      - name: TRUST-0694 candidate root-of-trust discovery remains fail-closed (synthetic only)
        run: sh experiment/openwrt/BlazePwifi/tests/v060_trust_capability_inventory.sh
      - name: Verify sealed synthetic-only backup code compiles and remains uninstalled
        run: |
          python3 -m py_compile experiment/openwrt/BlazePwifi/tools/v060_v1_sealed_fixture.py
          python3 -m py_compile experiment/openwrt/BlazePwifi/tests/v060_v1_sealed_fixture.py
          test ! -e experiment/openwrt/BlazePwifi/openwrt/rootfs/usr/lib/blazepwifi/v060_v1_sealed_fixture.py
      - name: EBACK-0677 authenticated AES-GCM synthetic recovery negative tests
        run: |
          python3 -m venv "$RUNNER_TEMP/blaze-v1-sealed-venv"
          "$RUNNER_TEMP/blaze-v1-sealed-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==50.0.2'
          "$RUNNER_TEMP/blaze-v1-sealed-venv/bin/python" experiment/openwrt/BlazePwifi/tests/v060_v1_sealed_fixture.py
      - name: Read-only redacted v1 financial migration preflight fixture
        run: python3 experiment/openwrt/BlazePwifi/tests/v060_v1_inventory_fixture.py
      - name: Reject malformed and duplicate paid Wi-Fi account snapshots
        run: sh experiment/openwrt/BlazePwifi/tests/v060_account_write_integrity.sh
      - name: Reject malformed and duplicate paid rental lease snapshots
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_db_integrity.sh
      - name: Reject destructive paid rental revocation and audit failure
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_revoke_safety.sh
      - name: Refuse paid rental lease storage and audit false ACK and implicit forfeiture
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_lease_mutation_safety.sh
      - name: Require explicit confirmation for shortening an existing paid rental lease
        run: sh experiment/openwrt/BlazePwifi/tests/v060_admin_rental_lease_set.sh
      - name: Prevent signed Android status from rewriting authoritative paid rental lease
        run: sh experiment/openwrt/BlazePwifi/tests/v060_rental_status_heartbeat.sh
      - name: Protect paid rental time in standalone R281 signed heartbeats
        run: sh experiment/openwrt/BlazePwifi/tests/v060_standalone_rental_heartbeat.sh
      - name: Reject false-ACK signed R281 rental coin after paid lease/audit faults
        run: sh experiment/openwrt/BlazePwifi/tests/v060_standalone_rental_coin_ack.sh
      - name: Keep standalone R281 Android coin-start target idempotent and storage checked
        run: sh experiment/openwrt/BlazePwifi/tests/v060_standalone_rental_coin_start.sh
      - name: Reject partial and weak R281 cryptographic rental enrollment secrets
        run: sh experiment/openwrt/BlazePwifi/tests/v060_r281_random_hex.sh
      - name: Refuse full/R281 admin login, password or CSRF when RNG unavailable
        run: sh experiment/openwrt/BlazePwifi/tests/v060_auth_rng_failclosed.sh
      - name: Preserve full/R281 privileged password verifier database on copy/storage failure
        run: sh experiment/openwrt/BlazePwifi/tests/v060_admin_password_write_integrity.sh
      - name: Require durable old-session logout and password-change revoke on both admin portals
        run: sh experiment/openwrt/BlazePwifi/tests/v060_auth_session_revocation.sh
      - name: Revoke old admin tokens before any new credential commit or false reset ACK
        run: sh experiment/openwrt/BlazePwifi/tests/v060_auth_password_rotation_order.sh
      - name: Refuse signed R281 Android enrollment false ACK and reusable setup QR
        run: sh experiment/openwrt/BlazePwifi/tests/v060_standalone_rental_enroll_safety.sh
      - name: Keep ordinary binding and Device Owner QR issuance storage-authoritative
        run: sh experiment/openwrt/BlazePwifi/tests/v060_enrollment_qr_issuance.sh
      - name: Preserve R281 signed hotspot coin receipts and refuse storage false ACK
        run: sh experiment/openwrt/BlazePwifi/tests/v060_standalone_hotspot_coin_safety.sh
      - name: Refuse legacy MAC credit loss before account persistence in both source profiles
        run: sh experiment/openwrt/BlazePwifi/tests/v060_legacy_bind_zero_loss.sh
      - name: Refuse deleting existing paid member seconds and false admin ACK
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_delete_safety.sh
      - name: Prevent partial member ledger replacement and false password/admin ACK
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_write_fault.sh
      - name: Protect paid member deletion in BlazeFusion management UI
        run: sh experiment/openwrt/BlazePwifi/tests/v060_member_ui_delete.sh
      - name: BlazePwifi v0.6 OpenWrt sysupgrade preservation safety
        run: sh experiment/openwrt/BlazePwifi/tests/v060_sysupgrade_preservation.sh
      - name: BlazeFusion offline and authenticated UI integration smoke
        run: sh experiment/openwrt/BlazePwifi/tests/v060_ui_fusion.sh
      - name: Verify managed Android Device Owner TLS pin contract
        run: sh experiment/openwrt/BlazePwifi/tests/v060_managed_tls_pin.sh
      - name: Verify native BlazeRental binding security dashboard
        run: sh experiment/openwrt/BlazePwifi/tests/v060_android_trust_panel.sh
      - name: Verify rental browser QR lifecycle and pin requirements
        run: node experiment/openwrt/BlazePwifi/tests/v060_rental_qr_browser.cjs
      - name: Verify offline rental QR templates clear failed generation output
        run: node experiment/openwrt/BlazePwifi/tests/v060_rental_qr_templates.cjs
      - name: Standalone Rental BlazeFusion self-contained UI and original secure routes
        run: sh experiment/openwrt/BlazePwifi/tests/v060_standalone_fusion.sh
      - name: EasyMode R281 BlazeFusion opt-in staging and frozen-source verification
        run: sh experiment/openwrt/BlazePwifi/tests/v060_easymode_fusion.sh
      - name: BlazeRental v0.5.1 update compatibility validation
        run: sh experiment/openwrt/BlazePwifi/tests/v051_android_source.sh
      - name: BlazeRental v0.5.2 branding and alarm validation
        run: sh experiment/openwrt/BlazePwifi/tests/v052_android_source.sh
      - name: Post-v0.5.2 CSRF, QR and coin-window hardening
        run: sh experiment/openwrt/BlazePwifi/tests/post_v052_hardening.sh
      - name: BlazePwifi v0.5.3 identity validation
        run: sh experiment/openwrt/BlazePwifi/tests/v053_development.sh
      - name: BlazePwifi v0.5.3 production-candidate validation
        run: |
          if [ "$(cat experiment/openwrt/BlazePwifi/VERSION)" = "0.5.3" ]; then
            sh experiment/openwrt/BlazePwifi/tests/v053_release_candidate.sh
          fi
      - name: BlazePwifi v0.5.3 console operations security
        run: sh experiment/openwrt/BlazePwifi/tests/v053_console_ops.sh
      - name: BlazePwifi v0.5.3 WireGuard network-survival validation
        run: sh experiment/openwrt/BlazePwifi/tests/v053_wireguard_apply.sh
      - name: BlazePwifi v0.5.3-dev.5 ZeroTier network-survival validation
        run: sh experiment/openwrt/BlazePwifi/tests/v053_zerotier_apply.sh
      - name: BlazePwifi v0.5.3 centralized SoftTimer members
        run: sh experiment/openwrt/BlazePwifi/tests/v053_members.sh
      - name: BlazePwifi v0.5.3-dev.4 member metadata migration
        run: sh experiment/openwrt/BlazePwifi/tests/v054_member_migration.sh
      - name: BlazePwifi v0.4 build matrix validation
        run: sh experiment/openwrt/BlazePwifi/tests/v04_build_matrix.sh
      - name: FWIMG-20261020 OpenWrt compressed-image and fwtool trailer regression
        run: python3 experiment/openwrt/BlazePwifi/tests/test_firmware_gzip.py
      - name: Portal validation
        run: sh experiment/openwrt/BlazePwifi/tests/portal.sh
      - name: Admin UI validation
        run: sh experiment/openwrt/BlazePwifi/tests/admin_ui.sh
      - name: Accounting integration test x3
        run: |
          for i in 1 2 3; do
            echo "Integration pass $i"
            sh experiment/openwrt/BlazePwifi/tests/integration.sh
          done
      - name: Persistence and replay stress test x3
        run: |
          for i in 1 2 3; do
            echo "Stress pass $i"
            sh experiment/openwrt/BlazePwifi/tests/stress.sh
          done
      - name: Build release bundle
        run: |
          VERSION=$(cat experiment/openwrt/BlazePwifi/VERSION)
          tar -czf "BlazePwifi-${VERSION}.tar.gz" experiment/openwrt/BlazePwifi
          sha256sum "BlazePwifi-${VERSION}.tar.gz" > "BlazePwifi-${VERSION}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-bundle
          path: |
            BlazePwifi-*.tar.gz
            BlazePwifi-*.sha256

      # Evidence is emitted even when a validation test fails. This record
      # is not a release gate and is never a substitute for the Actions result.
      - name: Record exact-SHA handover CI evidence
        if: always()
        shell: bash
        env:
          BLAZE_VALIDATE_RESULT: ${{ job.status }}
        run: |
          mkdir -p handover-ci
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('experiment/openwrt/BlazePwifi')
          payload = {
              "schema": "blazepwifi-handover-evidence-v1",
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "job": "validate",
              "job_status": os.environ.get("BLAZE_VALIDATE_RESULT", "unknown"),
              "source_version": (root / "VERSION").read_text().strip() if (root / "VERSION").exists() else "unavailable",
              "production_signed": False,
              "production_released": False,
              "handover_root": str(root / "PROJECT_HANDOVER.md"),
              "live_state": str(root / "docs/handover/CURRENT_STATE.md"),
              "change_ledger": str(root / "docs/handover/CHANGE_LEDGER.md"),
          }
          pathlib.Path("handover-ci/CI_HANDOVER.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          echo "BlazePwifi validate status: $BLAZE_VALIDATE_RESULT at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Authoritative repo handover: experiment/openwrt/BlazePwifi/docs/handover/CURRENT_STATE.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive handover state and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlazePwifi-ci-handover-evidence
          path: |
            handover-ci/CI_HANDOVER.json
            experiment/openwrt/BlazePwifi/PROJECT_HANDOVER.md
            experiment/openwrt/BlazePwifi/docs/handover/CURRENT_STATE.md
            experiment/openwrt/BlazePwifi/docs/handover/CHANGE_LEDGER.md
