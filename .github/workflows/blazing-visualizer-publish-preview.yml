name: Publish Blazing Visualizer preview
on:
  push:
    branches: [blazing-visualizer]
    paths: ['.github/workflows/blazing-visualizer-publish-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: blazing-visualizer-preview-1-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_REVISION: 590150cc672007a3951b7d6f5366a532297be5ae
      RELEASE_TAG: blazing-visualizer-v1.0.0-preview.1
    steps:
      - name: Confirm successful source validation
        run: |
          gh api repos/"$GH_REPO"/actions/runs/39717064004 > validation.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('validation.json'))
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Blazing-Visualizer-preview-APK
          run-id: 39717064004
          github-token: ${{ github.token }}
          path: artifact
      - name: Prepare verified CI APK
        run: |
          mkdir -p dist
          test -f artifact/app-debug.apk
          cp artifact/app-debug.apk dist/Blazing-Visualizer-preview-1.apk
          python3 - <<'PY'
          import pathlib, zipfile
          path = pathlib.Path('dist/Blazing-Visualizer-preview-1.apk')
          assert path.stat().st_size > 20_000_000
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert 'AndroidManifest.xml' in archive.namelist()
              assert 'classes.dex' in archive.namelist()
          PY
          cd dist
          sha256sum Blazing-Visualizer-preview-1.apk > SHA256SUMS.txt
      - name: Publish direct APK download
        run: |
          cat > notes.md <<'NOTES'
          Blazing Visualizer Android preview with offline note detection, instrument practice guides, editable visualizers, preset import/export, and H.264/AAC MP4 export.

          Download Blazing-Visualizer-preview-1.apk below. Android 8.0 or newer; 64-bit ARM phones and x86_64 emulators. Debug-signed preview.

          This APK is the GitHub Actions build from source commit 590150cc672007a3951b7d6f5366a532297be5ae. Its host checks and full Android API 26 / API 36 device matrix passed in run 39717064004. SHA256SUMS.txt identifies this CI-built APK.

          Note detection is an estimate, and Avee preset conversion is partial.
          NOTES
          gh release create "$RELEASE_TAG" dist/Blazing-Visualizer-preview-1.apk dist/SHA256SUMS.txt --target "$SOURCE_REVISION" --title "Blazing Visualizer 1.0.0-preview.1" --prerelease --notes-file notes.md
