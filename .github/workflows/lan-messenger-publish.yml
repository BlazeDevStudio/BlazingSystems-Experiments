name: LAN Messenger - publish preview downloads

on:
  push:
    branches:
      - feature/lan-messenger-v0.2.1-conversations
    paths:
      - .github/workflows/lan-messenger-publish.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch successful Android and Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/android dist/windows
          gh run download 39943674895 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Preview --dir dist/android
          gh run download 39943674895 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Preview --dir dist/windows

      - name: Prepare standalone public downloads and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/android/app-debug.apk
          test -s dist/windows/LAN-Messenger-Windows-Preview.zip
          mv dist/android/app-debug.apk dist/LAN-Messenger-Android-v0.2.1-preview.apk
          mv dist/windows/LAN-Messenger-Windows-Preview.zip dist/LAN-Messenger-Windows-v0.2.1-preview.zip
          printf '%s  %s\n' \
            '25e285ebb91cffdb53d18f1dba0470666be542e68b40420d10ca48e269f3bbe1' 'dist/LAN-Messenger-Android-v0.2.1-preview.apk' \
            'ce2ce831b90d7c06e26c3e09e498574e4a973821c7a97f177a495b067710783b' 'dist/LAN-Messenger-Windows-v0.2.1-preview.zip' | sha256sum --check
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # LAN Messenger v0.2.1 — Preview (not production ready)

          Stability preview: durable known-peer identities across UDP dropouts, authenticated reachability probes, automatic file reception with bounds, guarded voice-call teardown and new video-call controls. Both Android and Windows compiled and passed real-loopback file/messaging regression tests.

          - **Android**: debug APK (unsigned for public distribution; development signing only).
          - **Windows**: portable ZIP containing the executable, DLLs and data directory; extract all files before running.

          These files passed GitHub Actions compilation, Flutter analysis and automated tests in [run 39943674895](https://github.com/BlazingSystems/BlazingSystems-Experiments/actions/runs/39943674895).
          Physical two-device testing, proof of Windows native call-crash resolution, Flutter red-screen reproduction, video camera/audio routing, Android background calling, Bluetooth helmet headset support, Windows tray reception and firewall/VLAN cases remain unverified. File auto-receive is for trusted LANs; received files are not automatically opened or executed.

          This release contains original LAN Messenger code, not SHAREit proprietary code or assets.
          EOF

      - name: Publish prerelease with durable asset URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lan-messenger-v0.2.1-preview.1 \
            "dist/LAN-Messenger-Android-v0.2.1-preview.apk" \
            "dist/LAN-Messenger-Windows-v0.2.1-preview.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LAN Messenger v0.2.1 Preview" \
            --notes-file dist/RELEASE-NOTES.md \
            --prerelease
