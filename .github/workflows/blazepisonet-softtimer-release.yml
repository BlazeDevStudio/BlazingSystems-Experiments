name: BlazePisonet SoftTimer Windows Release

on:
  pull_request:
    paths:
      - 'experiment/windows/BlazePisonet-SoftTimer/**'
      - '.github/workflows/blazepisonet-softtimer-release.yml'
      - '.github/workflows/blazepwifi-build.yml'
  push:
    branches: [main]
    paths:
      - 'experiment/windows/BlazePisonet-SoftTimer/**'
      - '.github/workflows/blazepisonet-softtimer-release.yml'
      - '.github/workflows/blazepwifi-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blazepisonet-softtimer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_DIR: experiment/windows/BlazePisonet-SoftTimer
  VERSION: 0.4.0

jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify shared BlazePwifi and SoftTimer handover freshness
        run: sh experiment/openwrt/BlazePwifi/tests/handover_gate.sh
      - name: Verify stale and partial handovers are rejected
        run: sh experiment/openwrt/BlazePwifi/tests/handover_gate_regression.sh

  build-windows:
    needs: handover
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      future_release_eligible: ${{ steps.release_version_gate.outputs.future_release_eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.425'

      - name: Pin .NET 8 SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "8.0.425",
              "rollForward": "disable"
            }
          }
          '@ | Set-Content -Encoding utf8 global.json
          $sdkVersion = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sdkVersion -ne '8.0.425') {
            throw "Pinned .NET SDK mismatch: expected 8.0.425, selected $sdkVersion"
          }
          Write-Output "RELEASE-DOTNET-SDK-PASS: $sdkVersion"


      - name: RELEASE-PARITY reject altered installed and archive members in isolated fixtures
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:PROJECT_DIR/tests/ReleaseSigning/PackageParity.ps1" -Mode Selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: RELEASE-SIGN test fail-closed negative controls
        shell: pwsh
        run: |
          $buildWorkflowPath = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/blazepwifi-build.yml'
          if (-not (Test-Path -LiteralPath $buildWorkflowPath -PathType Leaf)) {
            throw 'RELEASE-SIGN: shared BlazePwifi build workflow is missing'
          }
          $buildWorkflow = Get-Content -LiteralPath $buildWorkflowPath -Raw
          if ([string]::IsNullOrWhiteSpace($buildWorkflow)) {
            throw 'RELEASE-SIGN: shared BlazePwifi build workflow is empty'
          }
          . "$env:PROJECT_DIR/tests/ReleaseSigning/negative-selftest.ps1"

      - name: RELEASE-PUBLISHER-MOCK execute complete publication command path without credentials
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:PROJECT_DIR/tests/ReleaseSigning/PublisherMockCli.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify local build stops after each failed dotnet command
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:PROJECT_DIR/tests/BuildLocalExitCode/selftest.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PAY-0717 signed request and domain-separated response MAC contract (lab only)
        shell: pwsh
        run: |
          dotnet run --project "$env:PROJECT_DIR/tests/V2NativeEnvelopeContract/V2NativeEnvelopeContract.csproj" -c Release -- --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PAY-0718 Windows pending sequence clears only on trusted independent ACKV2 server key
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:PROJECT_DIR/tests/V2PendingSequenceLab/windows-selftest.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore win-x64
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj" -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj" -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with warnings as errors
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cnotmatch '^[0-9a-f]{40}$') { throw 'Exact Git source required for compiled version' }
          $versionArgs=@(
            "-p:Version=$env:VERSION",
            "-p:FileVersion=$($env:VERSION).0",
            "-p:AssemblyVersion=$($env:VERSION).0",
            "-p:InformationalVersion=$env:VERSION+$source",
            '-p:IncludeSourceRevisionInInformationalVersion=false'
          )
          dotnet build "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj" -c Release -r win-x64 --no-restore -warnaserror @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj" -c Release -r win-x64 --no-restore -warnaserror @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PAY-0719 compiled SoftTimer V2-required protocol no-downgrade (no network)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $binary=Join-Path $env:PROJECT_DIR 'src/BlazePisonet.SoftTimer/bin/Release/net8.0-windows/win-x64/BlazePisonet.SoftTimer.exe'
          if (-not (Test-Path $binary)) { throw 'Compiled SoftTimer EXE missing for V2 policy test' }
          $p=Start-Process -FilePath (Resolve-Path $binary).Path -ArgumentList @('--verify-v2-member-protocol-gate') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "V2-required member protocol downgrade guard failed: $($p.ExitCode)" }

      - name: PAY-0720 compiled SoftTimer verifies pinned P-256 public server ACK, no private key
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $binary=Join-Path $env:PROJECT_DIR 'src/BlazePisonet.SoftTimer/bin/Release/net8.0-windows/win-x64/BlazePisonet.SoftTimer.exe'
          if (-not (Test-Path $binary)) { throw 'PAY-0720 compiled SoftTimer EXE not found' }
          dotnet run --project "$env:PROJECT_DIR/tests/V2PublicAckProbe/V2PublicAckProbe.csproj" -c Release -- (Resolve-Path $binary).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify monotonic billing timer (60-minute simulation)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $binary=Join-Path $env:PROJECT_DIR 'src/BlazePisonet.SoftTimer/bin/Release/net8.0-windows/win-x64/BlazePisonet.SoftTimer.exe'
          if (-not (Test-Path $binary)) { throw 'Compiled SoftTimer EXE missing' }
          # This is a WinExe GUI-subsystem binary; PowerShell's '&' may
          # return before it exits and leave LASTEXITCODE unset.
          $p=Start-Process -FilePath (Resolve-Path $binary).Path -ArgumentList @('--verify-timer-math') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Timer cadence self-check failed with exit code $($p.ExitCode)" }

      - name: Publish self-contained Windows x64 EXEs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force out/app,out/watchdog,out/bundle,portable,release | Out-Null
          $source=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cnotmatch '^[0-9a-f]{40}$') { throw 'Exact Git source required for compiled version' }
          $versionArgs=@(
            "-p:Version=$env:VERSION",
            "-p:FileVersion=$($env:VERSION).0",
            "-p:AssemblyVersion=$($env:VERSION).0",
            "-p:InformationalVersion=$env:VERSION+$source",
            '-p:IncludeSourceRevisionInInformationalVersion=false'
          )

          dotnet publish "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj" -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/app @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj" -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/watchdog @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item out/app/BlazePisonet.SoftTimer.exe out/bundle/ -Force
          Copy-Item out/watchdog/BlazePisonet.SoftTimer.Watchdog.exe out/bundle/ -Force
          if (-not (Test-Path out/bundle/BlazePisonet.SoftTimer.exe)) { throw 'SoftTimer EXE missing' }
          if (-not (Test-Path out/bundle/BlazePisonet.SoftTimer.Watchdog.exe)) { throw 'Watchdog EXE missing' }


      - name: RELEASE-SIGN sign portable executables before NSIS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && env.VERSION != '0.4.0' && vars.SOFTTIMER_RELEASE_APPROVED == 'true'
        shell: pwsh
        env:
          SOFTTIMER_SIGNING_PFX_B64: ${{ secrets.SOFTTIMER_SIGNING_PFX_B64 }}
          SOFTTIMER_SIGNING_PFX_PASSWORD: ${{ secrets.SOFTTIMER_SIGNING_PFX_PASSWORD }}
          SOFTTIMER_SIGNER_CERT_SHA256: ${{ secrets.SOFTTIMER_WINDOWS_SIGNER_CERT_SHA256 }}
          SOFTTIMER_TIMESTAMP_URL: ${{ vars.SOFTTIMER_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference='Stop'
          $params=@{
            Mode='Sign'
            InputPaths=@('out/bundle/BlazePisonet.SoftTimer.exe','out/bundle/BlazePisonet.SoftTimer.Watchdog.exe')
            PinnedCertSha256=$env:SOFTTIMER_SIGNER_CERT_SHA256
            PfxBase64=$env:SOFTTIMER_SIGNING_PFX_B64
            PfxPassword=$env:SOFTTIMER_SIGNING_PFX_PASSWORD
            TimestampUrl=$env:SOFTTIMER_TIMESTAMP_URL
          }
          & "$env:PROJECT_DIR/tests/ReleaseSigning/Release-Authenticode.ps1" @params

      - name: Install NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidates=@(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw 'makensis.exe was not found after NSIS installation' }
          "NSIS_EXE=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: RELEASE-VERSION compile isolated future 0.4.1 native metadata probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          pwsh -NoProfile -File "$env:PROJECT_DIR/tests/ReleaseSigning/Version-MetadataProbe.ps1" -CurrentVersion "$env:VERSION" -FutureVersion '0.4.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native Setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          Push-Location "$env:PROJECT_DIR/installer"
          try {
            & "$env:NSIS_EXE" "/DSOFTTIMER_VERSION=$env:VERSION" /V3 "BlazePisonet-SoftTimer.nsi"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $setup="release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw 'Native Setup EXE was not produced' }
          Get-Item $setup | Format-Table Name,Length

      - name: Verify compiled Setup preserves exact Unicode owner text
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:PROJECT_DIR/tests/InstallerMetadata/verify-copyright.ps1" -SetupPath "release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: RELEASE-SIGN sign native Setup after metadata verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && env.VERSION != '0.4.0' && vars.SOFTTIMER_RELEASE_APPROVED == 'true'
        shell: pwsh
        env:
          SOFTTIMER_SIGNING_PFX_B64: ${{ secrets.SOFTTIMER_SIGNING_PFX_B64 }}
          SOFTTIMER_SIGNING_PFX_PASSWORD: ${{ secrets.SOFTTIMER_SIGNING_PFX_PASSWORD }}
          SOFTTIMER_SIGNER_CERT_SHA256: ${{ secrets.SOFTTIMER_WINDOWS_SIGNER_CERT_SHA256 }}
          SOFTTIMER_TIMESTAMP_URL: ${{ vars.SOFTTIMER_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference='Stop'
          $params=@{
            Mode='Sign'
            InputPaths=@("release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe")
            PinnedCertSha256=$env:SOFTTIMER_SIGNER_CERT_SHA256
            PfxBase64=$env:SOFTTIMER_SIGNING_PFX_B64
            PfxPassword=$env:SOFTTIMER_SIGNING_PFX_PASSWORD
            TimestampUrl=$env:SOFTTIMER_TIMESTAMP_URL
          }
          & "$env:PROJECT_DIR/tests/ReleaseSigning/Release-Authenticode.ps1" @params

      - name: RELEASE-SIGN reject actual unsigned Setup in PR
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $buildWorkflowPath = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/blazepwifi-build.yml'
          if (-not (Test-Path -LiteralPath $buildWorkflowPath -PathType Leaf)) {
            throw 'RELEASE-SIGN: shared BlazePwifi build workflow is missing'
          }
          $buildWorkflow = Get-Content -LiteralPath $buildWorkflowPath -Raw
          if ([string]::IsNullOrWhiteSpace($buildWorkflow)) {
            throw 'RELEASE-SIGN: shared BlazePwifi build workflow is empty'
          }
          . "$env:PROJECT_DIR/tests/ReleaseSigning/negative-selftest.ps1" -ActualUnsignedSetup "release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"

      - name: Smoke-test Setup EXE install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          function Test-ScheduledTaskExists([string]$TaskName) {
            $service=New-Object -ComObject 'Schedule.Service'
            $service.Connect()
            $root=$service.GetFolder('\')
            try {
              $null=$root.GetTask($TaskName)
              return $true
            } catch {
              return $false
            }
          }

          $setup=(Resolve-Path "release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe").Path
          $p=Start-Process -FilePath $setup -ArgumentList @('/S') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup EXE failed with exit code $($p.ExitCode)" }

          $install=Join-Path $env:ProgramFiles 'BlazeSystems\BlazePisonet SoftTimer'
          $app=Join-Path $install 'BlazePisonet.SoftTimer.exe'
          $watchdog=Join-Path $install 'BlazePisonet.SoftTimer.Watchdog.exe'
          if (-not (Test-Path $app)) { throw 'Installed SoftTimer EXE missing' }
          if (-not (Test-Path $watchdog)) { throw 'Installed watchdog EXE missing' }

          # Compare the real installed executables with the exact signed or
          # unsigned bundle bytes BEFORE running the installed application.
          pwsh -NoProfile -File "$env:PROJECT_DIR/tests/ReleaseSigning/PackageParity.ps1" -Mode Installed -BundlePath 'out/bundle' -InstallPath $install
          if ($LASTEXITCODE -ne 0) { throw 'Native installed executable bytes differ from staged package' }

          $verify=Start-Process -FilePath $app -ArgumentList @('--verify-system-integration') -Wait -PassThru
          if ($verify.ExitCode -ne 0) { throw "SoftTimer native system-integration verification failed with exit code $($verify.ExitCode)" }

          if (-not (Test-ScheduledTaskExists 'BlazePisonet SoftTimer')) { throw 'SoftTimer startup task was not created' }
          if (-not (Test-ScheduledTaskExists 'BlazePisonet SoftTimer Watchdog')) { throw 'Watchdog startup task was not created' }

          $uninstaller=Join-Path $install 'Uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Native uninstaller EXE missing' }
          $u=Start-Process -FilePath $uninstaller -ArgumentList @('/S') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($u.ExitCode)" }

          if (Test-ScheduledTaskExists 'BlazePisonet SoftTimer') { throw 'SoftTimer startup task remained after uninstall' }
          if (Test-ScheduledTaskExists 'BlazePisonet SoftTimer Watchdog') { throw 'Watchdog startup task remained after uninstall' }
          if (Test-Path $app) { throw 'SoftTimer executable remained after uninstall' }
          if (Test-Path $watchdog) { throw 'Watchdog executable remained after uninstall' }

      - name: Build portable EXE-only package and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item out/bundle/BlazePisonet.SoftTimer.exe portable/ -Force
          Copy-Item out/bundle/BlazePisonet.SoftTimer.Watchdog.exe portable/ -Force
          Copy-Item "$env:PROJECT_DIR/README.md" portable/README.md -Force
          $releaseNotes="$env:PROJECT_DIR/RELEASE_NOTES_v$env:VERSION.md"
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw "Version-specific release notes missing: $releaseNotes"
          }
          Copy-Item -LiteralPath $releaseNotes -Destination portable/RELEASE_NOTES.md -Force
          New-Item -ItemType Directory -Force portable/docs | Out-Null
          Copy-Item "$env:PROJECT_DIR/docs/*" portable/docs/ -Recurse -Force

          $zip="BlazePisonet-SoftTimer-v$env:VERSION-portable-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path portable/* -DestinationPath $zip -CompressionLevel Optimal

          $setup="release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"
          $setupHash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$setupHash  BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe",
            "$zipHash  $zip"
          ) | Set-Content -Encoding ascii SHA256SUMS

          Get-Item $setup,$zip,out/bundle/BlazePisonet.SoftTimer.exe,out/bundle/BlazePisonet.SoftTimer.Watchdog.exe | Format-Table Name,Length
          Get-Content SHA256SUMS


      - name: RELEASE-PARITY check staged executable, exact portable ZIP membership and final SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup="release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"
          $zip="BlazePisonet-SoftTimer-v$env:VERSION-portable-win-x64.zip"
          pwsh -NoProfile -File "$env:PROJECT_DIR/tests/ReleaseSigning/PackageParity.ps1" -Mode Portable -BundlePath 'out/bundle' -PortablePath portable -ZipPath $zip -SetupPath $setup -SumsPath SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: RELEASE-SIGN verify final signed packages before upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && env.VERSION != '0.4.0' && vars.SOFTTIMER_RELEASE_APPROVED == 'true'
        shell: pwsh
        env:
          SOFTTIMER_SIGNER_CERT_SHA256: ${{ secrets.SOFTTIMER_WINDOWS_SIGNER_CERT_SHA256 }}
        run: |
          $ErrorActionPreference='Stop'
          $source=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $params=@{
            Mode='Verify'
            InputPaths=@("release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe",'out/bundle/BlazePisonet.SoftTimer.exe','out/bundle/BlazePisonet.SoftTimer.Watchdog.exe')
            PinnedCertSha256=$env:SOFTTIMER_SIGNER_CERT_SHA256
            PortableZipPath="BlazePisonet-SoftTimer-v$env:VERSION-portable-win-x64.zip"
            Sha256SumsPath='SHA256SUMS'
            ExpectedVersion=$env:VERSION
            ExpectedSourceCommit=$source
          }
          & "$env:PROJECT_DIR/tests/ReleaseSigning/Release-Authenticode.ps1" @params

      - name: Upload validated release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BlazePisonet-SoftTimer-v${{ env.VERSION }}-win-x64
          path: |
            release/BlazePisonet-SoftTimer-Setup-v${{ env.VERSION }}.exe
            BlazePisonet-SoftTimer-v${{ env.VERSION }}-portable-win-x64.zip
            SHA256SUMS
            out/bundle/BlazePisonet.SoftTimer.exe
            out/bundle/BlazePisonet.SoftTimer.Watchdog.exe
          if-no-files-found: error

      # This step runs only after parity and unsigned/real-signature controls.
      # 'env' is unavailable in jobs.<id>.if: export the result via needs.
      - name: RELEASE-ADMISSION prevent frozen version from spawning privileged job
        id: release_version_gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:VERSION -eq '0.4.0') {
            "future_release_eligible=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output 'RELEASE-ADMISSION: frozen v0.4.0 is not eligible for a write-token publisher'
          } elseif ($env:VERSION -match '^[0-9]+\.[0-9]+\.[0-9]+$') {
            "future_release_eligible=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output 'RELEASE-ADMISSION: future version eligible for separately approved publisher, not production accepted'
          } else {
            throw 'RELEASE-ADMISSION: invalid version, no publisher authorization'
          }

  # A PR/build checkout never receives a writable repository token.
  # The sole write scope is a separate approved main-push publication job.
  publish-release:
    needs: build-windows
    # Job-level if cannot reference env.VERSION. Only the already validated
    # build job may prove a non-frozen future candidate before granting write.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && vars.SOFTTIMER_RELEASE_APPROVED == 'true' && needs.build-windows.outputs.future_release_eligible == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BlazePisonet-SoftTimer-v${{ env.VERSION }}-win-x64
      # The downloaded final artifact must be re-admitted using the owner-pinned
      # DER cert SHA256, trusted timestamp, version, source SHA and ZIP bytes.
      - name: Publish GitHub Release
        # Never mutate the frozen v0.4.0 release from later development code.
        # A version/tag bump and explicit new candidate are mandatory first.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true && env.VERSION != '0.4.0' && vars.SOFTTIMER_RELEASE_APPROVED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOFTTIMER_SIGNER_CERT_SHA256: ${{ secrets.SOFTTIMER_WINDOWS_SIGNER_CERT_SHA256 }}
        run: |
          $ErrorActionPreference='Stop'
          $setup="release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"
          $zip="BlazePisonet-SoftTimer-v$env:VERSION-portable-win-x64.zip"
          $releaseTarget=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTag="softtimer-v$env:VERSION"
          $releaseNotes="$env:PROJECT_DIR/RELEASE_NOTES_v$env:VERSION.md"
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw "Version-specific release notes missing: $releaseNotes"
          }
          # A generic gh release view failure is NOT proof of a missing release:
          # token, transport, rate-limit and server errors must fail closed.
          $lookupOutput = gh api -i "repos/$env:GITHUB_REPOSITORY/releases/tags/$releaseTag" 2>&1 | Out-String
          $lookupExit = $LASTEXITCODE
          if ($lookupExit -eq 0) {
            throw "Immutable release tag $releaseTag already exists. Refusing asset replacement; select an approved new version."
          }
          # Accept exactly one HTTP response status. Multiple status lines (proxy,
          # redirect or ambiguous transport output) cannot establish tag absence.
          $httpStatuses = @([regex]::Matches($lookupOutput, '(?m)^HTTP/[0-9.]+ ([0-9]{3})(?:\s|$)'))
          if ($httpStatuses.Count -ne 1 -or $httpStatuses[0].Groups[1].Value -ne '404') {
            throw "Release lookup failed without an unambiguous HTTP 404 (exit $lookupExit); refusing publication"
          }

          # A missing Release object does not prove that the Git tag itself is
          # absent. gh release create may reuse an existing tag; never attach a
          # new release to an unreviewed or differently-targeted ref.
          $tagLookupOutput = gh api -i "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$releaseTag" 2>&1 | Out-String
          $tagLookupExit = $LASTEXITCODE
          if ($tagLookupExit -eq 0) {
            throw "Git tag $releaseTag already exists. Refusing to reuse or retarget it; select an approved new version."
          }
          $tagHttpStatuses = @([regex]::Matches($tagLookupOutput, '(?m)^HTTP/[0-9.]+ ([0-9]{3})(?:\s|$)'))
          if ($tagHttpStatuses.Count -ne 1 -or $tagHttpStatuses[0].Groups[1].Value -ne '404') {
            throw "Git tag lookup failed without an unambiguous HTTP 404 (exit $tagLookupExit); refusing publication"
          }

          # Re-admit the FINAL shipped bytes in the publisher step, even if
          # a prior signing job was skipped, and fail closed on any mismatch.
          $gate="$env:PROJECT_DIR/tests/ReleaseSigning/Release-Authenticode.ps1"
          # The GitHub API just returned a confirmed HTTP 404 for a missing release.
          # Clear that EXPECTED stale status so only this verifier can deny publish.
          $global:LASTEXITCODE = 0
          & $gate -Mode Verify -InputPaths @($setup,'out/bundle/BlazePisonet.SoftTimer.exe','out/bundle/BlazePisonet.SoftTimer.Watchdog.exe') -PinnedCertSha256 "$env:SOFTTIMER_SIGNER_CERT_SHA256" -PortableZipPath $zip -Sha256SumsPath 'SHA256SUMS' -ExpectedVersion $env:VERSION -ExpectedSourceCommit $releaseTarget
          if ($LASTEXITCODE -ne 0) { throw "Publisher final artifact verification failed (exit $LASTEXITCODE); refusing release" }
          gh release create $releaseTag $setup $zip SHA256SUMS --title "BlazePisonet SoftTimer v$env:VERSION" --notes-file $releaseNotes --target $releaseTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
