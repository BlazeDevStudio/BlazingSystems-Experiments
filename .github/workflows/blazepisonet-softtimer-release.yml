name: BlazePisonet SoftTimer Windows Release

on:
  pull_request:
    paths:
      - 'experiment/windows/BlazePisonet-SoftTimer/**'
      - '.github/workflows/blazepisonet-softtimer-release.yml'
  push:
    branches: [main]
    paths:
      - 'experiment/windows/BlazePisonet-SoftTimer/**'
      - '.github/workflows/blazepisonet-softtimer-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blazepisonet-softtimer-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: experiment/windows/BlazePisonet-SoftTimer
  VERSION: 0.4.0
  TAG: softtimer-v0.4.0

jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify shared BlazePwifi and SoftTimer handover freshness
        run: sh experiment/openwrt/BlazePwifi/tests/handover_gate.sh
      - name: Verify stale and partial handovers are rejected
        run: sh experiment/openwrt/BlazePwifi/tests/handover_gate_regression.sh

  build-windows:
    needs: handover
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'

      - name: Pin .NET 8 SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "8.0.425",
              "rollForward": "latestPatch"
            }
          }
          '@ | Set-Content -Encoding utf8 global.json
          dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify local build stops after each failed dotnet command
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:PROJECT_DIR/tests/BuildLocalExitCode/selftest.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PAY-0717 signed request and domain-separated response MAC contract (lab only)
        shell: pwsh
        run: |
          dotnet run --project "$env:PROJECT_DIR/tests/V2NativeEnvelopeContract/V2NativeEnvelopeContract.csproj" -c Release -- --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PAY-0718 Windows pending sequence clears only on trusted independent ACKV2 server key
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:PROJECT_DIR/tests/V2PendingSequenceLab/windows-selftest.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PHX-L-APPS #164 source-linked failed-COM-Open resource ownership safety gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lab = "$env:PROJECT_DIR/tests/NativeSerialPinFaultLab/NativeSerialPinFaultLab.csproj"
          # Test the actual app SerialHardware.cs with injected fake SerialPort.Open
          # failure. Keep this isolated from #197's five separate opened-HANDLE REDs.
          dotnet run --project $lab -c Release -- --open-failure-safety-gate
          if ($LASTEXITCODE -ne 0) {
            throw "FAILED_OPEN_RESOURCE_GATE: exit=$LASTEXITCODE (2=leaked candidate, 3=invalid setup, 1=unexpected); DO NOT PROMOTE"
          }
          Write-Host 'FAILED_OPEN_RESOURCE_GATE_GREEN: C# failed-open candidate disposed, no lingering PinChanged, valid retry positive.'

      - name: PHX-L-APPS #164 native C# active-low status-failure no-false-coin gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lab = "$env:PROJECT_DIR/tests/NativeSerialPinFaultLab/NativeSerialPinFaultLab.csproj"
          # Compiles actual SerialHardware.cs against fake serial/WMI APIs.
          # A source/API behavioral gate only, NOT production coin safety proof.
          dotnet run --project $lab -c Release -- --diagnostic
          if ($LASTEXITCODE -ne 0) { throw "Native C# source-linked diagnostic failed: $LASTEXITCODE" }
          dotnet run --project $lab -c Release --no-restore -- --safety-gate
          if ($LASTEXITCODE -ne 0) { throw "READ_ERROR_SAFETY_GATE_RED: false credit or test failure, exit=$LASTEXITCODE" }
          Write-Host 'ACTIVE_LOW_READ_ERROR_GATE_GREEN: 4/4 status-fault/detach cases denied in the fake OS harness. Other coin risks not cleared.'

      - name: Restore win-x64
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj" -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj" -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with warnings as errors
        shell: pwsh
        run: |
          dotnet build "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj" -c Release -r win-x64 --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj" -c Release -r win-x64 --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PAY-0719 compiled SoftTimer V2-required protocol no-downgrade (no network)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $binary=Join-Path $env:PROJECT_DIR 'src/BlazePisonet.SoftTimer/bin/Release/net8.0-windows/win-x64/BlazePisonet.SoftTimer.exe'
          if (-not (Test-Path $binary)) { throw 'Compiled SoftTimer EXE missing for V2 policy test' }
          $p=Start-Process -FilePath (Resolve-Path $binary).Path -ArgumentList @('--verify-v2-member-protocol-gate') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "V2-required member protocol downgrade guard failed: $($p.ExitCode)" }

      - name: PAY-0720 compiled SoftTimer verifies pinned P-256 public server ACK, no private key
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $binary=Join-Path $env:PROJECT_DIR 'src/BlazePisonet.SoftTimer/bin/Release/net8.0-windows/win-x64/BlazePisonet.SoftTimer.exe'
          if (-not (Test-Path $binary)) { throw 'PAY-0720 compiled SoftTimer EXE not found' }
          dotnet run --project "$env:PROJECT_DIR/tests/V2PublicAckProbe/V2PublicAckProbe.csproj" -c Release -- (Resolve-Path $binary).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify monotonic billing timer (60-minute simulation)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $binary=Join-Path $env:PROJECT_DIR 'src/BlazePisonet.SoftTimer/bin/Release/net8.0-windows/win-x64/BlazePisonet.SoftTimer.exe'
          if (-not (Test-Path $binary)) { throw 'Compiled SoftTimer EXE missing' }
          # This is a WinExe GUI-subsystem binary; PowerShell's '&' may
          # return before it exits and leave LASTEXITCODE unset.
          $p=Start-Process -FilePath (Resolve-Path $binary).Path -ArgumentList @('--verify-timer-math') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Timer cadence self-check failed with exit code $($p.ExitCode)" }

      - name: Publish self-contained Windows x64 EXEs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force out/app,out/watchdog,out/bundle,portable,release | Out-Null

          dotnet publish "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer/BlazePisonet.SoftTimer.csproj" -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish "$env:PROJECT_DIR/src/BlazePisonet.SoftTimer.Watchdog/BlazePisonet.SoftTimer.Watchdog.csproj" -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o out/watchdog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item out/app/BlazePisonet.SoftTimer.exe out/bundle/ -Force
          Copy-Item out/watchdog/BlazePisonet.SoftTimer.Watchdog.exe out/bundle/ -Force
          if (-not (Test-Path out/bundle/BlazePisonet.SoftTimer.exe)) { throw 'SoftTimer EXE missing' }
          if (-not (Test-Path out/bundle/BlazePisonet.SoftTimer.Watchdog.exe)) { throw 'Watchdog EXE missing' }

      - name: Install NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidates=@(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw 'makensis.exe was not found after NSIS installation' }
          "NSIS_EXE=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build native Setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          Push-Location "$env:PROJECT_DIR/installer"
          try {
            & "$env:NSIS_EXE" /V3 "BlazePisonet-SoftTimer.nsi"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $setup="release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw 'Native Setup EXE was not produced' }
          Get-Item $setup | Format-Table Name,Length

      - name: Smoke-test Setup EXE install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          function Test-ScheduledTaskExists([string]$TaskName) {
            $service=New-Object -ComObject 'Schedule.Service'
            $service.Connect()
            $root=$service.GetFolder('\')
            try {
              $null=$root.GetTask($TaskName)
              return $true
            } catch {
              return $false
            }
          }

          $setup=(Resolve-Path "release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe").Path
          $p=Start-Process -FilePath $setup -ArgumentList @('/S') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup EXE failed with exit code $($p.ExitCode)" }

          $install=Join-Path $env:ProgramFiles 'BlazeSystems\BlazePisonet SoftTimer'
          $app=Join-Path $install 'BlazePisonet.SoftTimer.exe'
          $watchdog=Join-Path $install 'BlazePisonet.SoftTimer.Watchdog.exe'
          if (-not (Test-Path $app)) { throw 'Installed SoftTimer EXE missing' }
          if (-not (Test-Path $watchdog)) { throw 'Installed watchdog EXE missing' }

          $verify=Start-Process -FilePath $app -ArgumentList @('--verify-system-integration') -Wait -PassThru
          if ($verify.ExitCode -ne 0) { throw "SoftTimer native system-integration verification failed with exit code $($verify.ExitCode)" }

          if (-not (Test-ScheduledTaskExists 'BlazePisonet SoftTimer')) { throw 'SoftTimer startup task was not created' }
          if (-not (Test-ScheduledTaskExists 'BlazePisonet SoftTimer Watchdog')) { throw 'Watchdog startup task was not created' }

          $uninstaller=Join-Path $install 'Uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Native uninstaller EXE missing' }
          $u=Start-Process -FilePath $uninstaller -ArgumentList @('/S') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($u.ExitCode)" }

          if (Test-ScheduledTaskExists 'BlazePisonet SoftTimer') { throw 'SoftTimer startup task remained after uninstall' }
          if (Test-ScheduledTaskExists 'BlazePisonet SoftTimer Watchdog') { throw 'Watchdog startup task remained after uninstall' }
          if (Test-Path $app) { throw 'SoftTimer executable remained after uninstall' }
          if (Test-Path $watchdog) { throw 'Watchdog executable remained after uninstall' }

      - name: Build portable EXE-only package and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item out/bundle/BlazePisonet.SoftTimer.exe portable/ -Force
          Copy-Item out/bundle/BlazePisonet.SoftTimer.Watchdog.exe portable/ -Force
          Copy-Item "$env:PROJECT_DIR/README.md" portable/README.md -Force
          Copy-Item "$env:PROJECT_DIR/RELEASE_NOTES_v0.4.0.md" portable/RELEASE_NOTES.md -Force
          New-Item -ItemType Directory -Force portable/docs | Out-Null
          Copy-Item "$env:PROJECT_DIR/docs/*" portable/docs/ -Recurse -Force

          $zip="BlazePisonet-SoftTimer-v$env:VERSION-portable-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path portable/* -DestinationPath $zip -CompressionLevel Optimal

          $setup="release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"
          $setupHash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$setupHash  BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe",
            "$zipHash  $zip"
          ) | Set-Content -Encoding ascii SHA256SUMS

          Get-Item $setup,$zip,out/bundle/BlazePisonet.SoftTimer.exe,out/bundle/BlazePisonet.SoftTimer.Watchdog.exe | Format-Table Name,Length
          Get-Content SHA256SUMS

      - name: Upload validated release candidates
        # DRAFT/PR regressions may compile/build locally but must NOT
        # publish candidate artifacts or imply release readiness.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: BlazePisonet-SoftTimer-v0.4.0-win-x64
          path: |
            release/BlazePisonet-SoftTimer-Setup-v0.4.0.exe
            BlazePisonet-SoftTimer-v0.4.0-portable-win-x64.zip
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        # Never mutate the frozen v0.4.0 release from later development code.
        # A version/tag bump and explicit new candidate are mandatory first.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.VERSION != '0.4.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $setup="release/BlazePisonet-SoftTimer-Setup-v$env:VERSION.exe"
          $zip="BlazePisonet-SoftTimer-v$env:VERSION-portable-win-x64.zip"
          $releaseTarget=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (gh release view $env:TAG *> $null) {
            throw "Immutable release tag $env:TAG already exists. Refusing asset replacement; bump version and TAG with a new candidate."
          }
          gh release create $env:TAG $setup $zip SHA256SUMS --title "BlazePisonet SoftTimer v$env:VERSION" --notes-file "$env:PROJECT_DIR/RELEASE_NOTES_v0.4.0.md" --target $releaseTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
