name: LAN Messenger v0.2.5 - installer and release
on:
  push:
    branches: [feature/lan-messenger-v0.2.5-call-tools]
    paths: [.github/workflows/lan-messenger-publish-v025.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested Windows portable app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 39972000386 --repo "$env:GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
          New-Item -ItemType Directory -Force -Path windows-payload | Out-Null
          Expand-Archive artifacts/windows/LAN-Messenger-Windows-Optimized.zip -DestinationPath windows-payload -Force
          if (!(Test-Path windows-payload/lan_messenger.exe)) { throw "Missing Windows executable" }
      - name: Assemble user-level EXE installer (no administrative rights needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @'
          [Setup]
          AppId=BlazingSystems.LANMessenger
          AppName=LAN Messenger
          AppVersion=0.2.5
          DefaultDirName={localappdata}\Programs\LAN Messenger
          DefaultGroupName=LAN Messenger
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          OutputDir=dist
          OutputBaseFilename=LAN-Messenger-Windows-Setup-v0.2.5
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayName=LAN Messenger
          SetupIconFile=windows-payload\data\flutter_assets\assets\icons\lan_messenger.ico
          [Files]
          Source: "windows-payload\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\LAN Messenger"; Filename: "{app}\lan_messenger.exe"
          [Run]
          Filename: "{app}\lan_messenger.exe"; Description: "Launch LAN Messenger"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 100000) { throw "Installer missing or too small" }
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer bytes: $($setup.Length), SHA256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.5
          path: dist/LAN-Messenger-Windows-Setup-v0.2.5.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optimized compiled platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/android artifacts/windows dist
          gh run download 39972000386 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Optimized --dir artifacts/android
          gh run download 39972000386 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.5
          path: artifacts/installer
      - name: Check checksums, stage downloads and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile
          checks = [
            ('artifacts/android/app-arm64-v8a-release.apk','LAN-Messenger-Android-arm64-v0.2.5.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-armeabi-v7a-release.apk','LAN-Messenger-Android-arm32-v0.2.5.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-x86_64-release.apk','LAN-Messenger-Android-x86_64-v0.2.5.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/windows/LAN-Messenger-Windows-Optimized.zip','LAN-Messenger-Windows-Portable-v0.2.5.zip','artifacts/windows/SHA256SUMS.txt'),
          ]
          for src, dst, sums in checks:
            p=Path(src)
            expected={line.split()[1].removeprefix('*'):line.split()[0].lower() for line in Path(sums).read_text(encoding='utf-8-sig').splitlines()}
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            assert expected.get(p.name)==actual, f'CI hash mismatch: {src}'
            if p.suffix=='.zip':
              with zipfile.ZipFile(p) as z: assert z.testzip() is None
            shutil.copy2(p,Path('dist')/dst)
          setup=Path('artifacts/installer/LAN-Messenger-Windows-Setup-v0.2.5.exe')
          assert setup.stat().st_size>100000, 'Missing Windows installer'
          shutil.copy2(setup, Path('dist')/setup.name)
          PY
          (cd dist && sha256sum *.apk *.zip *.exe > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # LAN Messenger v0.2.5 — Camera and Screen Sharing Test Preview

          This is an Android/Windows developer preview for real-device testing, not a production-ready intercom.

          ## Features
          - Detect multiple cameras and switch between them via a button or double tap on the local video preview.
          - Portrait/landscape remote video aspect adapts to decoded video dimensions without cropping.
          - Move local video overlay by dragging. Minimize calls to a draggable floating window without ending audio or video.
          - Share a chosen screen in an ongoing video call using a system consent prompt and WebRTC video-track replacement. Keep microphone capture unchanged.
          - On Android, every capture requires MediaProjection consent and a visible foreground service. Some Android versions or vendors restrict background capture.
          - Experimental Windows-only screen click control: viewer requests, owner explicitly approves, access limited to one active authenticated LAN call and screen share, automatically expires after five minutes, and can be revoked.
          - Remote control supports only mouse clicks on a single-monitor Windows desktop; no keyboard, Android remote touch, unattended access, or administrator elevation.

          ## Compatibility
          - Android: choose only the APK matching your processor. ARM64 is typical for recent phones. Temporarily generated CI signing keys can prevent upgrading an older preview; uninstalling clears app-private history and received files.
          - Windows: the Setup EXE installs for the current user; alternatively extract the complete portable ZIP. The unsigned installer can trigger publisher warnings.
          - Camera capture, orientation, Wi-Fi switching, screen-share consent, Windows call tray reception, microphone release and approved screen control have **not** been physically verified.
          - Avoid relying on this preview for critical communications while riding.

          ## Verified build evidence
          Android Flutter analysis/tests, APK release compilation, APK signature/integrity verification, Android emulator install/launch, and Windows Flutter analysis/tests/release compilation all PASSED:
          https://github.com/BlazingSystems/BlazingSystems-Experiments/actions/runs/39972000386

          The standalone release remains in Experiments. Migration to BlazingSystems-Projects requires physical acceptance, security review and stable signing:
          https://github.com/BlazingSystems/BlazingSystems-Experiments/blob/feature/lan-messenger-v0.2.5-call-tools/experiment/apps/LAN-Messenger/RELEASE-READINESS.md
          EOF
      - name: Publish immutable GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lan-messenger-v0.2.5-preview.1 dist/*.apk dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target 7ce035afa1d1faf3808df771ad653aef796c3a88 \
            --title "LAN Messenger v0.2.5 - Screen Sharing Test Preview" \
            --notes-file dist/RELEASE-NOTES.md --prerelease
