name: BlazeHackintosh experimental foundation

on:
  push:
    branches: [blazehackintosh-v0.1.0-foundation]
    paths:
      - 'experiments/BlazeHackintosh/**'
      - '.github/workflows/blazehackintosh-foundation.yml'
  pull_request:
    paths:
      - 'experiments/BlazeHackintosh/**'
      - '.github/workflows/blazehackintosh-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s experiments/BlazeHackintosh/Tests -v
      - name: CLI smoke test and report evaluation
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/BlazeHackintosh
          python blazehackintosh.py catalog > /tmp/blazehackintosh-catalog.json
          python blazehackintosh.py scan --output /tmp/blazehackintosh-ci-scan.json
          python blazehackintosh.py evaluate --report /tmp/blazehackintosh-ci-scan.json > /tmp/blazehackintosh-evaluation.json
          python -c 'import json; p=json.load(open("/tmp/blazehackintosh-evaluation.json")); assert not p["boot_verified"] and not p["can_generate_efi"]'

  windows-console-scanner:
    runs-on: windows-latest
    needs: linux-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Windows Python
        shell: pwsh
        run: |
          python -m unittest discover -s experiments/BlazeHackintosh/Tests -v
      - name: Package experimental read-only scanner
        working-directory: experiments/BlazeHackintosh
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --name BlazeHackintosh-Toolkit --add-data "Hardware-Database/families.json;Hardware-Database" blazehackintosh.py
          if (!(Test-Path dist/BlazeHackintosh-Toolkit.exe)) { throw 'Executable missing' }
          if ((Get-Item dist/BlazeHackintosh-Toolkit.exe).Length -lt 100000) { throw 'Executable too small' }
          ./dist/BlazeHackintosh-Toolkit.exe catalog --output dist/families-export.json
          ./dist/BlazeHackintosh-Toolkit.exe evaluate --output dist/evaluation.json
          $r = Get-Content dist/evaluation.json -Raw | ConvertFrom-Json
          if ($r.boot_verified -or $r.can_generate_efi) { throw 'Invalid boot claim' }
          python -c "import subprocess,json; from pathlib import Path; p=subprocess.run(['dist/BlazeHackintosh-Toolkit.exe','validate-efi','--efi','.','--output','dist/efi-inspection.json'],capture_output=True,text=True,timeout=60); assert p.returncode==2, (p.returncode,p.stderr); r=json.loads(Path('dist/efi-inspection.json').read_text()); assert not any(r[k] for k in ('structural_checks_passed','boot_verified','ocvalidate_passed')), r"
          Get-FileHash dist/BlazeHackintosh-Toolkit.exe -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BlazeHackintosh-v0.1.2-experimental-windows-toolkit
          path: |
            experiments/BlazeHackintosh/dist/BlazeHackintosh-Toolkit.exe
            experiments/BlazeHackintosh/dist/SHA256.txt
          if-no-files-found: error

  scanner-preview-prerelease:
    name: Publish scanner-only alpha preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/blazehackintosh-v0.1.0-foundation'
    runs-on: ubuntu-latest
    needs: [linux-tests, windows-console-scanner]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: BlazeHackintosh-v0.1.2-experimental-windows-toolkit
          path: downloaded
      - name: Verify deliverables and create offline UI archive
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded/BlazeHackintosh-Toolkit.exe
          test -s experiments/BlazeHackintosh/Setup-Assistant/index.html
          mkdir -p packaging/BlazeHackintosh-Offline-UI
          cp -r experiments/BlazeHackintosh/Setup-Assistant packaging/BlazeHackintosh-Offline-UI/
          cp -r experiments/BlazeHackintosh/LICENSES packaging/BlazeHackintosh-Offline-UI/
          cp experiments/BlazeHackintosh/README.md packaging/BlazeHackintosh-Offline-UI/
          (cd packaging && zip -qr ../BlazeHackintosh-Offline-UI.zip BlazeHackintosh-Offline-UI)
          sha256sum downloaded/BlazeHackintosh-Toolkit.exe BlazeHackintosh-Offline-UI.zip > SHA256SUMS.txt
      - name: Publish explicitly-scoped alpha prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='blazehackintosh-toolkit-v0.1.2-alpha.1'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing scanner preview release preserved; refusing to overwrite assets."
            exit 0
          fi
          cat > RELEASE-NOTES.md <<'EOF'
          # BlazeHackintosh scanner-only alpha preview

          This preview includes read-only CPU/GPU/network/storage discovery and a local OpenCore EFI structural inspector (not official ocvalidate), plus an
          **offline manual-reference browser UI**. The scanner and UI are different
          interfaces. The expanded source-unit tests run on Linux and Windows; the scanner
          executable is smoke-tested on the Windows CI runner.

          **NOT INCLUDED:** automatic OpenCore EFI generator, Apple macOS installer, bootable IMG,
          USB flashing, disk migration, GPU compatibility verification, or physical
          Hackintosh boot testing. CPU taxonomy records are Research Only.

          The Windows EXE is a console toolkit: 'scan', 'evaluate', 'catalog', and 'validate-efi'. The UI ZIP is a separate browser preview. The structural inspector does not verify real EFI executables or boot success.
          Assets include Lucide ISC icon notices. Check Apple licensing before
          any macOS installation. No Apple software or boot images are distributed.
          EOF
          gh release create "$TAG" \
            downloaded/BlazeHackintosh-Toolkit.exe \
            BlazeHackintosh-Offline-UI.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'BlazeHackintosh v0.1.2-alpha.1 — Scanner and Read-Only EFI Inspector' \
            --notes-file RELEASE-NOTES.md --prerelease
