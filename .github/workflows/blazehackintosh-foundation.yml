name: BlazeHackintosh experimental foundation

on:
  push:
    branches: [blazehackintosh-v0.1.0-foundation]
    paths:
      - 'experiments/BlazeHackintosh/**'
      - '.github/workflows/blazehackintosh-foundation.yml'
  pull_request:
    paths:
      - 'experiments/BlazeHackintosh/**'
      - '.github/workflows/blazehackintosh-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s experiments/BlazeHackintosh/Tests -v
      - name: CLI smoke test and report evaluation
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/BlazeHackintosh
          python blazehackintosh.py catalog > /tmp/blazehackintosh-catalog.json
          python blazehackintosh.py scan --output /tmp/blazehackintosh-ci-scan.json
          python blazehackintosh.py evaluate --report /tmp/blazehackintosh-ci-scan.json > /tmp/blazehackintosh-evaluation.json
          python -c 'import json; p=json.load(open("/tmp/blazehackintosh-evaluation.json")); assert not p["boot_verified"] and not p["can_generate_efi"]'

  windows-console-scanner:
    runs-on: windows-latest
    needs: linux-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Windows Python
        shell: pwsh
        run: |
          python -m unittest discover -s experiments/BlazeHackintosh/Tests -v
      - name: Package experimental read-only scanner
        working-directory: experiments/BlazeHackintosh
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --name BlazeHackintosh-Scanner --add-data "Hardware-Database/families.json;Hardware-Database" blazehackintosh.py
          if (!(Test-Path dist/BlazeHackintosh-Scanner.exe)) { throw 'Executable missing' }
          if ((Get-Item dist/BlazeHackintosh-Scanner.exe).Length -lt 100000) { throw 'Executable too small' }
          ./dist/BlazeHackintosh-Scanner.exe catalog --output dist/families-export.json
          ./dist/BlazeHackintosh-Scanner.exe evaluate --output dist/evaluation.json
          $r = Get-Content dist/evaluation.json -Raw | ConvertFrom-Json
          if ($r.boot_verified -or $r.can_generate_efi) { throw 'Invalid boot claim' }
          Get-FileHash dist/BlazeHackintosh-Scanner.exe -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BlazeHackintosh-v0.1.0-experimental-windows-cli
          path: |
            experiments/BlazeHackintosh/dist/BlazeHackintosh-Scanner.exe
            experiments/BlazeHackintosh/dist/SHA256.txt
          if-no-files-found: error

  scanner-preview-prerelease:
    name: Publish scanner-only alpha preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/blazehackintosh-v0.1.0-foundation'
    runs-on: ubuntu-latest
    needs: [linux-tests, windows-console-scanner]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BlazeHackintosh-v0.1.0-experimental-windows-cli
          path: downloaded
      - name: Verify deliverables and create offline UI archive
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded/BlazeHackintosh-Scanner.exe
          test -s experiments/BlazeHackintosh/Setup-Assistant/index.html
          mkdir -p packaging/BlazeHackintosh-Offline-UI
          cp -r experiments/BlazeHackintosh/Setup-Assistant packaging/BlazeHackintosh-Offline-UI/
          cp -r experiments/BlazeHackintosh/LICENSES packaging/BlazeHackintosh-Offline-UI/
          cp experiments/BlazeHackintosh/README.md packaging/BlazeHackintosh-Offline-UI/
          (cd packaging && zip -qr ../BlazeHackintosh-Offline-UI.zip BlazeHackintosh-Offline-UI)
          sha256sum downloaded/BlazeHackintosh-Scanner.exe BlazeHackintosh-Offline-UI.zip > SHA256SUMS.txt
      - name: Publish explicitly-scoped alpha prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='blazehackintosh-scanner-v0.1.1-alpha.1'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing scanner preview release preserved; refusing to overwrite assets."
            exit 0
          fi
          cat > RELEASE-NOTES.md <<'EOF'
          # BlazeHackintosh scanner-only alpha preview

          This preview adds GPU and network PCI IDs, storage models, memory and UEFI detection to a **read-only Windows console scanner**, plus an
          **offline manual-reference browser UI**. The scanner and UI are different
          interfaces. The expanded source-unit tests run on Linux and Windows; the scanner
          executable is smoke-tested on the Windows CI runner.

          **NOT INCLUDED:** OpenCore EFI generator, Mac installer, bootable IMG,
          USB flashing, disk migration, GPU compatibility verification, or physical
          Hackintosh boot testing. CPU taxonomy records are Research Only.

          Use the standalone UI ZIP offline; the Windows EXE is a console program.
          Assets include Lucide ISC icon notices. Check Apple licensing before
          any macOS installation. No Apple software or boot images are distributed.
          EOF
          gh release create "$TAG" \
            downloaded/BlazeHackintosh-Scanner.exe \
            BlazeHackintosh-Offline-UI.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'BlazeHackintosh v0.1.1-alpha.1 — Hardware Inventory Preview' \
            --notes-file RELEASE-NOTES.md --prerelease
