name: LAN Messenger v0.2.6 - installer and release
on:
  push:
    branches: [fix/lan-messenger-v0.2.6-call-interop]
    paths: [.github/workflows/lan-messenger-publish-v025.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve tested Windows portable app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 40022484121 --repo "$env:GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
          New-Item -ItemType Directory -Force -Path windows-payload | Out-Null
          Expand-Archive artifacts/windows/LAN-Messenger-Windows-Optimized.zip -DestinationPath windows-payload -Force
          if (!(Test-Path windows-payload/lan_messenger.exe)) { throw "Missing Windows executable" }
      - name: Assemble user-level EXE installer (no administrative rights needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @'
          [Setup]
          AppId=BlazingSystems.LANMessenger
          AppName=LAN Messenger
          AppVersion=0.2.6
          DefaultDirName={localappdata}\Programs\LAN Messenger
          DefaultGroupName=LAN Messenger
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          OutputDir=dist
          OutputBaseFilename=LAN-Messenger-Windows-Setup-v0.2.6
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayName=LAN Messenger
          SetupIconFile=windows-payload\data\flutter_assets\assets\icons\lan_messenger.ico
          [Files]
          Source: "windows-payload\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\LAN Messenger"; Filename: "{app}\lan_messenger.exe"
          [Run]
          Filename: "{app}\lan_messenger.exe"; Description: "Launch LAN Messenger"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 100000) { throw "Installer missing or too small" }
          $h = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer bytes: $($setup.Length), SHA256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.6
          path: dist/LAN-Messenger-Windows-Setup-v0.2.6.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optimized compiled platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/android artifacts/windows dist
          gh run download 40022484121 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Optimized --dir artifacts/android
          gh run download 40022484121 --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Windows-Installer-v0.2.6
          path: artifacts/installer
      - name: Check checksums, stage downloads and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile
          checks = [
            ('artifacts/android/app-arm64-v8a-release.apk','LAN-Messenger-Android-arm64-v0.2.6.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-armeabi-v7a-release.apk','LAN-Messenger-Android-arm32-v0.2.6.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/android/app-x86_64-release.apk','LAN-Messenger-Android-x86_64-v0.2.6.apk','artifacts/android/SHA256SUMS.txt'),
            ('artifacts/windows/LAN-Messenger-Windows-Optimized.zip','LAN-Messenger-Windows-Portable-v0.2.6.zip','artifacts/windows/SHA256SUMS.txt'),
          ]
          for src, dst, sums in checks:
            p=Path(src)
            expected={line.split()[1].removeprefix('*'):line.split()[0].lower() for line in Path(sums).read_text(encoding='utf-8-sig').splitlines()}
            actual=hashlib.sha256(p.read_bytes()).hexdigest()
            assert expected.get(p.name)==actual, f'CI hash mismatch: {src}'
            if p.suffix=='.zip':
              with zipfile.ZipFile(p) as z: assert z.testzip() is None
            shutil.copy2(p,Path('dist')/dst)
          setup=Path('artifacts/installer/LAN-Messenger-Windows-Setup-v0.2.6.exe')
          assert setup.stat().st_size>100000, 'Missing Windows installer'
          shutil.copy2(setup, Path('dist')/setup.name)
          PY
          (cd dist && sha256sum *.apk *.zip *.exe > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # LAN Messenger v0.2.6 — Intercom Recovery Test Preview

          This build is for physical device testing, not yet a production intercom.

          ## Repairs since v0.2.5
          - Windows: await microphone/camera track stop and dispose tracks, streams and WebRTC peers independently, reducing the possibility of a lingering active microphone.
          - Windows: pick a full desktop display and pass its DesktopCapturer source ID to WebRTC screen capture.
          - Android: new incoming-call notification channel and full-screen call intent where the OS permits it; notification settings may affect the Answer/Decline banner.
          - Android: optional remote-touch Accessibility service. Phone owner must manually enable the service and explicitly approve control in the live LAN call. Only rate-limited taps, no keyboard, no unattended control; approval expires within five minutes and can be revoked.
          - Preserve WebRTC screen video-track replacement for Android→Android, Windows→Android, Android→Windows and Windows→Windows.
          - To prevent wrong desktop clicks, prefer full-display capture instead of individual window capture.

          ## Installation and limitations
          - For typical modern Samsung/Android, install only the ARM64 APK; ARM32 and x86_64 files are also included.
          - The CI signing identity may change between previews. An older preview may require uninstalling, which removes app-private history and files.
          - Windows installer is currently unsigned. Portable ZIP must be fully extracted.
          - Native Android remote tapping requires manual Accessibility permission and may be restricted by Android security settings. Allow only for trusted peers.
          - Mic indicator release, call notifications, camera switching, and screen-sharing/control across the four OS pairs STILL REQUIRE REAL DEVICE TESTS.
          - This is not a safety-certified motorcycle intercom.

          ## Evidence
          Android and Windows analysis/tests/release builds, signature and archive checks, Android emulator install and startup PASSED:
          https://github.com/BlazingSystems/BlazingSystems-Experiments/actions/runs/40022484121
          Exact compiled source commit: d3918819ec884f6c76844fb1c0a9d7cfa50e4734

          Remains in BlazingSystems-Experiments until physical acceptance and security review, before any handover to BlazingSystems-Projects.
          EOF
      - name: Publish immutable GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lan-messenger-v0.2.6-preview.1 dist/*.apk dist/*.zip dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target d3918819ec884f6c76844fb1c0a9d7cfa50e4734 \
            --title "LAN Messenger v0.2.6 - Intercom Recovery Test Preview" \
            --notes-file dist/RELEASE-NOTES.md --prerelease
