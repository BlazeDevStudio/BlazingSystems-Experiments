name: Blazing Visualizer Android
on:
  push:
    branches: [blazing-visualizer, main]
    paths: ['experiments/Blazing-Visualizer/**', '.github/workflows/blazing-visualizer.yml']
  pull_request:
    paths: ['experiments/Blazing-Visualizer/**', '.github/workflows/blazing-visualizer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blazing-visualizer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/Blazing-Visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Host regression suite
        timeout-minutes: 15
        run: |
          diagnostic_dir=app/build/reports/host-diagnostics
          init_script="$RUNNER_TEMP/visualizer-test-events.init.gradle"
          cat > "$init_script" <<'GROOVY'
          import org.gradle.api.tasks.testing.Test
          gradle.beforeProject { project ->
              project.tasks.withType(Test).configureEach { task ->
                  task.beforeTest { descriptor ->
                      task.logger.lifecycle("HOST_TEST_START ${descriptor.className}#${descriptor.name}")
                  }
                  task.afterTest { descriptor, result ->
                      task.logger.lifecycle("HOST_TEST_END ${descriptor.className}#${descriptor.name}: ${result.resultType}")
                  }
              }
          }
          GROOVY
          (
            sleeper_pid=''
            trap 'if [[ -n "$sleeper_pid" ]]; then kill "$sleeper_pid" 2>/dev/null || true; fi; exit' TERM
            for snapshot in 1 2; do
              sleep 300 &
              sleeper_pid=$!
              wait "$sleeper_pid"
              sleeper_pid=''
              mkdir -p "$diagnostic_dir"
              date -u > "$diagnostic_dir/snapshot-$snapshot-time.txt"
              jcmd -l > "$diagnostic_dir/snapshot-$snapshot-jvms.txt" 2>&1 || true
              while read -r pid main; do
                case "$main" in
                  *GradleWorkerMain*|*GradleDaemon*|*GradleWrapperMain*)
                    timeout 15s jcmd "$pid" Thread.print -l > "$diagnostic_dir/snapshot-$snapshot-$pid-threads.txt" 2>&1 || true
                    timeout 15s jcmd "$pid" VM.system_properties 2>&1 |
                      awk -F= '$1=="java.version" || $1=="java.home" || $1=="robolectric.dependency.repo.url" || $1=="robolectric.dependency.repo.id" || $1=="robolectric.dependency.dir" || $1=="robolectric.offline" || $1=="robolectric.logging.enabled"' > "$diagnostic_dir/snapshot-$snapshot-$pid-sdk-properties.txt" || true
                    ;;
                esac
              done < "$diagnostic_dir/snapshot-$snapshot-jvms.txt"
              find "$HOME/.m2/repository/org/robolectric" "$HOME/.robolectric" -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' > "$diagnostic_dir/snapshot-$snapshot-sdk-files.txt" 2>&1 || true
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=30s 12m ./gradlew --init-script "$init_script" clean :app:testDebugUnitTest --no-daemon --console=plain --stacktrace --info
      - name: Lint and Android APK assemblies
        timeout-minutes: 12
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --stacktrace
      - name: Package production DSP probe for private local music tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          output=Path('local-pcm-probe'); output.mkdir()
          roots=[Path('app/build/tmp/kotlin-classes/debug'),Path('app/build/tmp/kotlin-classes/debugUnitTest'),Path('app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes')]
          with zipfile.ZipFile(output/'production-classes.jar','w',zipfile.ZIP_DEFLATED) as archive:
              for root in roots:
                  assert root.is_dir(), root
                  for file in root.rglob('*.class'): archive.write(file,file.relative_to(root))
          cache=Path.home()/'.gradle/caches/modules-2/files-2.1'
          for name in ['kotlin-stdlib-2.3.20.jar','kotlinx-serialization-core-jvm-1.9.0.jar','kotlinx-serialization-json-jvm-1.9.0.jar']:
              matches=list(cache.rglob(name)); assert matches, name
              shutil.copyfile(matches[0],output/name)
          (output/'README.txt').write_text('Local-only float32 PCM probe. No network calls.\njava -Xmx192m -cp "*" com.blazingsystems.visualizer.LocalPcmProbe file.f32 44100 2 15\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Blazing-Visualizer-local-PCM-probe
          path: experiments/Blazing-Visualizer/local-pcm-probe/
      - uses: actions/upload-artifact@v4
        with:
          name: Blazing-Visualizer-preview-APK
          path: experiments/Blazing-Visualizer/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blazing-Visualizer-host-reports
          path: |
            experiments/Blazing-Visualizer/app/build/reports/
            experiments/Blazing-Visualizer/app/build/test-results/
  device:
    timeout-minutes: 25
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          working-directory: experiments/Blazing-Visualizer
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.blazingsystems.visualizer.MusicPermissionTest -Pandroid.testInstrumentationRunnerArguments.freshAudioPermission=true --no-daemon
            mv app/build/reports/androidTests/connected app/build/reports/androidTests/permission
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.notClass=com.blazingsystems.visualizer.MusicPermissionTest --no-daemon
            mkdir -p ../../device-evidence && adb exec-out run-as com.blazingsystems.visualizer tar -C files -cf - acceptance > ../../device-evidence/acceptance.tar
            python3 -c 'import tarfile; t=tarfile.open("../../device-evidence/acceptance.tar"); assert {"acceptance/model-parity.json", "acceptance/graph-chord_3d.png", "acceptance/graph-radial.png", "acceptance/quick-preview.json", "acceptance/mp3-note-preview.json", "acceptance/mp3-note-preview.png", "acceptance/video-background-preview.png"} <= set(t.getnames()), "Missing native evidence"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blazing-Visualizer-API-${{ matrix.api }}-reports
          path: |
            experiments/Blazing-Visualizer/app/build/reports/androidTests/
            experiments/Blazing-Visualizer/app/build/outputs/androidTest-results/
            device-evidence/
