name: Blazing Visualizer Android
on:
  push:
    branches: [blazing-visualizer, main]
    paths: ['experiments/Blazing-Visualizer/**', '.github/workflows/blazing-visualizer.yml']
  pull_request:
    paths: ['experiments/Blazing-Visualizer/**', '.github/workflows/blazing-visualizer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blazing-visualizer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/Blazing-Visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Host regression suite
        timeout-minutes: 15
        run: timeout --signal=TERM --kill-after=30s 12m ./gradlew clean :app:testDebugUnitTest --no-daemon --console=plain --stacktrace --info
      - name: Lint and Android APK assemblies
        timeout-minutes: 12
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Blazing-Visualizer-preview-APK
          path: experiments/Blazing-Visualizer/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blazing-Visualizer-host-reports
          path: |
            experiments/Blazing-Visualizer/app/build/reports/
            experiments/Blazing-Visualizer/app/build/test-results/
  device:
    timeout-minutes: 25
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          working-directory: experiments/Blazing-Visualizer
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.blazingsystems.visualizer.MusicPermissionTest -Pandroid.testInstrumentationRunnerArguments.freshAudioPermission=true --no-daemon
            mv app/build/reports/androidTests/connected app/build/reports/androidTests/permission
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.notClass=com.blazingsystems.visualizer.MusicPermissionTest --no-daemon
            mkdir -p ../../device-evidence && adb exec-out run-as com.blazingsystems.visualizer tar -C files -cf - acceptance > ../../device-evidence/acceptance.tar
            python3 -c 'import tarfile; t=tarfile.open("../../device-evidence/acceptance.tar"); assert {"acceptance/model-parity.json", "acceptance/graph-chord_3d.png", "acceptance/graph-radial.png", "acceptance/quick-preview.json", "acceptance/video-background-preview.png"} <= set(t.getnames()), "Missing native evidence"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blazing-Visualizer-API-${{ matrix.api }}-reports
          path: |
            experiments/Blazing-Visualizer/app/build/reports/androidTests/
            experiments/Blazing-Visualizer/app/build/outputs/androidTest-results/
            device-evidence/
