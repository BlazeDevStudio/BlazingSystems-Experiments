name: LAN Messenger v0.3.0 - evidence gated preview binaries
on:
  push:
    branches: [release/lan-messenger-v030-evidence-publisher]
    paths: [.github/workflows/lan-messenger-v030-qa-release.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
env:
  VERIFIED_RUN: '40305812372'
  VERIFIED_SHA: '49a13412f5a66ffd6d64c2973f81241027183c50'
  RELEASE_TAG: 'lan-messenger-v0.3.0-preview.2'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact v0.3.0 four-job acceptance (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$VERIFIED_RUN" -R "$GITHUB_REPOSITORY" --exit-status --interval 10
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json, os
          run=json.load(open("run.json"))
          assert run["head_sha"]==os.environ["VERIFIED_SHA"], "Refuse wrong source SHA"
          assert run["status"]=="completed" and run["conclusion"]=="success", "Source run is not green"
          jobs={j["name"]: j["conclusion"] for j in json.load(open("jobs.json"))["jobs"]}
          required=("android", "windows", "android-install-test", "android-pair-lan")
          assert all(jobs.get(name)=="success" for name in required), f"Acceptance incomplete: {jobs}"
          print("Verified exact source head and 4 successful jobs:", run["head_sha"])
          PY
  windows-installer:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact tested Windows executable payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:VERIFIED_RUN --repo $env:GITHUB_REPOSITORY --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch tested Windows archive" }
          $archive = 'artifacts/windows/LAN-Messenger-Windows-Optimized.zip'
          $sum = (Get-Content artifacts/windows/SHA256SUMS.txt -Encoding UTF8 | Where-Object { $_ -match 'LAN-Messenger-Windows-Optimized.zip' } | Select-Object -First 1).Trim().Split()[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $sum.ToLower()) { throw 'Windows payload SHA256 mismatch' }
          Expand-Archive $archive -DestinationPath windows-payload -Force
          if (!(Test-Path windows-payload/lan_messenger.exe)) { throw 'Missing tested Windows EXE' }
      - name: Create and smoke-test per-user Setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup unavailable' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @'
          [Setup]
          AppId=BlazingSystems.LANMessenger
          AppName=LAN Messenger
          AppVersion=0.3.0
          AppVerName=LAN Messenger 0.3.0 Preview
          DefaultDirName={localappdata}\Programs\LAN Messenger
          DefaultGroupName=LAN Messenger
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          OutputDir=dist
          OutputBaseFilename=LAN-Messenger-Windows-Setup-v0.3.0-preview.2
          Compression=lzma2
          SolidCompression=yes
          UninstallDisplayName=LAN Messenger
          [Files]
          Source: "windows-payload\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\LAN Messenger"; Filename: "{app}\lan_messenger.exe"
          [Run]
          Filename: "{app}\lan_messenger.exe"; Description: "Launch LAN Messenger"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compile failed' }
          $setup = (Resolve-Path dist/LAN-Messenger-Windows-Setup-v0.3.0-preview.2.exe).Path
          if ((Get-Item $setup).Length -lt 1000000) { throw 'Installer too small' }
          # Windows GUI-subsystem installers can return control to PowerShell
          # before their installation child process completes. Start-Process
          # -Wait observes the process tree; checking file existence before
          # completion causes a false-negative smoke result.
          $installerProcess = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "Installation smoke failed: exit $($installerProcess.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\LAN Messenger\lan_messenger.exe'
          if (!(Test-Path $installed)) {
            Write-Host "Expected installed executable: $installed"
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | Select-Object Name,FullName
            throw 'Installed EXE missing after installer process exit'
          }
          Write-Host "PASS: Setup EXE installed tested binary: $installed"
      - uses: actions/upload-artifact@v4
        with:
          name: LAN-Messenger-Windows-Setup-v0.3.0-preview.2
          path: dist/LAN-Messenger-Windows-Setup-v0.3.0-preview.2.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [verify, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries and two-endpoint evidence from verified SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android artifacts/windows artifacts/evidence dist
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Optimized --dir artifacts/android
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Windows-Optimized --dir artifacts/windows
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name LAN-Messenger-Android-Peer-LAN-Evidence --dir artifacts/evidence
      - uses: actions/download-artifact@v4
        with:
          name: LAN-Messenger-Windows-Setup-v0.3.0-preview.2
          path: artifacts/installer
      - name: Reject bad checksums and missing proof, stage direct downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,zipfile
          root=pathlib.Path('artifacts')
          proof=json.loads((root/'evidence/webrtc-two-endpoint-transport-proof.json').read_text())
          keys=('caller_transport_connected','receiver_transport_connected','caller_connected_ui','receiver_live_ui')
          assert all(proof.get(k) is True for k in keys), f'No independent two-endpoint proof: {proof}'
          entries=[
            ('android','app-arm64-v8a-release.apk','LAN-Messenger-Android-arm64-v0.3.0-preview.2.apk'),
            ('android','app-armeabi-v7a-release.apk','LAN-Messenger-Android-arm32-v0.3.0-preview.2.apk'),
            ('android','app-x86_64-release.apk','LAN-Messenger-Android-x86_64-v0.3.0-preview.2.apk'),
            ('windows','LAN-Messenger-Windows-Optimized.zip','LAN-Messenger-Windows-Portable-v0.3.0-preview.2.zip'),
          ]
          dist=pathlib.Path('dist')
          for folder,name,dest in entries:
            directory=root/folder
            sums={(line.split()[1]).lstrip('*'):line.split()[0].lower()
                  for line in (directory/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines()
                  if len(line.split()) >= 2}
            source=directory/name
            actual=hashlib.sha256(source.read_bytes()).hexdigest()
            assert sums.get(name)==actual, f'SHA256 mismatch {name}'
            if source.suffix=='.zip':
              with zipfile.ZipFile(source) as z:
                assert z.testzip() is None and 'lan_messenger.exe' in z.namelist()
            shutil.copy2(source,dist/dest)
          installer=root/'installer/LAN-Messenger-Windows-Setup-v0.3.0-preview.2.exe'
          assert installer.exists() and installer.stat().st_size>1_000_000
          shutil.copy2(installer, dist/installer.name)
          shutil.copy2(root/'evidence/webrtc-two-endpoint-transport-proof.json',
                       dist/'WEbrtc-two-device-connected-proof.json')
          report=json.loads((root/'evidence/voice-call-report.json').read_text())
          events='\\n'.join(report.get('events', []))
          assert 'PASS: both Android peers decoded remote camera frames' in events, 'Missing actual decoded-frame evidence'
          assert 'PASS: Android native OS confirmed real PiP after HOME' in events, 'Missing native PiP confirmation'
          assert 'PASS: real dual-decoded video + OS PiP + hangup survived' in events, 'Missing video and PiP survival proof'
          shutil.copy2(root/'evidence/voice-call-report.json',
                       dist/'video-pip-e2e-report.json')
          print('PASS: checksums, native installer, 2 WebRTC transports, two decoded video feeds and Android OS PiP')
          PY
          (cd dist && sha256sum *.apk *.zip *.exe > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'EOF'
          # LAN Messenger v0.3.0 — Verified Cloud Preview 2
          
          **Not a production-certified intercom.** Source commit `49a13412f5a66ffd6d64c2973f81241027183c50`; all four cloud jobs must pass at https://github.com/BlazingSystems/BlazingSystems-Experiments/actions/runs/40305812372.
          
          Android: choose the single APK for your CPU (normally arm64). CI APKs are development signed and may not upgrade previous preview installs; uninstalling removes app-private chats/files. Windows: choose Setup EXE (unsigned), or extract the entire portable ZIP before launching lan_messenger.exe. Windows might warn about unknown publisher.
          
          **New acceptance evidence:** two Android emulators on one virtual LAN with overlay permission granted; background incoming Answer used only the system notification (no duplicate app-owned overlay), both peers independently reached WebRTC Connected, and a subsequent video call rendered decoded camera frames at BOTH endpoints. Android native PiP callback was observed after pressing Home, and the call survived hangup. The Windows installer is compiled and install-smoke tested. These are cloud emulators, not a real Samsung or Windows-to-Android physical call.
          
          **Not yet independently verified:** audible voice quality, Windows-to-Android media and draggable live-call toast on physical devices, Android OEM background/PiP behaviors, 3–4 participant group video, Bluetooth helmet audio routes, release signing/key migration, third-party security audit. This is a real compiled preview for field evaluation, not a final production deployment or motorcycle safety device.
          EOF
      - name: Publish GitHub prerelease with durable direct APK and Setup links
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.zip dist/*.exe dist/SHA256SUMS.txt dist/WEbrtc-two-device-connected-proof.json dist/video-pip-e2e-report.json \
            --repo "$GITHUB_REPOSITORY" --target "$VERIFIED_SHA" \
            --title "LAN Messenger v0.3.0 — Evidence-Gated Preview 2" \
            --notes-file dist/RELEASE-NOTES.md --prerelease
